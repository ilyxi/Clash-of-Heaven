<script>
// ---- js/render.js ----
'use strict';
// ---------------------------------------------------------------------------
// World renderer: ground, depth-sorted props/fighters/projectiles, effects,
// overhead bars, and full-screen overlays (cut-ins, flashes, genjutsu).
// ---------------------------------------------------------------------------

const Render = (() => {
  let canvas, ctx, VW = 640, VH = 360, scale = 3;
  let vignette = null;
  let puddle = null, fireTile = null;
  let lastT = performance.now();

  function init(cv) {
    canvas = cv;
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
    puddle = makeBlob('#5aa0e0', 23, 11);
    fireTile = makeDiamond('#ff7a1a', 0.8);
  }

  // Soft dithered ellipse; overlapping blobs merge into organic puddles.
  function makeBlob(color, rx, ry) {
    const c = U.makeCanvas(rx * 2 + 2, ry * 2 + 2);
    const x = c.getContext('2d');
    x.fillStyle = color;
    for (let py = 0; py < c.height; py++) for (let px = 0; px < c.width; px++) {
      const dx = (px + 0.5 - c.width / 2) / rx, dy = (py + 0.5 - c.height / 2) / ry;
      const e = Math.sqrt(dx * dx + dy * dy);
      if (e > 1) continue;
      if (e > 0.6 && U.hash2(px, py, 5) > 1 - (e - 0.6) / 0.4 * 0.9) continue;
      x.fillRect(px, py, 1, 1);
    }
    x.fillStyle = '#bfe0ff';
    for (let k = 0; k < 5; k++) x.fillRect(Math.round(rx * 0.5 + U.hash2(k, 1, 9) * rx), Math.round(ry * 0.5 + U.hash2(k, 2, 9) * ry), 2, 1);
    return c;
  }

  function makeDiamond(color, density) {
    const c = U.makeCanvas(TILE_W, TILE_H);
    const x = c.getContext('2d');
    x.fillStyle = color;
    for (let py = 0; py < TILE_H; py++) for (let px = 0; px < TILE_W; px++) {
      const e = Math.abs(px + 0.5 - 16) / 16 + Math.abs(py + 0.5 - 8) / 8;
      if (e > 1) continue;
      if (e > 0.7 && U.hash2(px, py, 3) > density * (1 - (e - 0.7) / 0.3)) continue;
      x.fillRect(px, py, 1, 1);
    }
    return c;
  }

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    const zoom = (Settings.data && Settings.data.zoom) || 'normal';
    const target = zoom === 'near' ? 200 : zoom === 'far' ? 330 : 250;
    // Prefer an even scale so the 2x hi-res canvas maps to whole screen pixels.
    const s = h / target;
    const even = Math.max(2, 2 * Math.round(s / 2)), any = Math.max(1, Math.round(s));
    scale = Math.abs(h / even - target) <= target * 0.22 ? even : any;
    VW = Math.ceil(w / scale); VH = Math.ceil(h / scale);
    canvas.width = VW * HIRES; canvas.height = VH * HIRES;
    canvas.logicalW = VW; canvas.logicalH = VH;
    canvas.style.width = VW * scale + 'px'; canvas.style.height = VH * scale + 'px';
    ctx.setTransform(HIRES, 0, 0, HIRES, 0, 0);
    ctx.imageSmoothingEnabled = false;
    vignette = U.makeCanvas(VW, VH);
    const v = vignette.getContext('2d');
    const g = v.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.35, VW / 2, VH / 2, Math.max(VW, VH) * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.45)');
    v.fillStyle = g; v.fillRect(0, 0, VW, VH);
    if (W) { W.cam.w = VW; W.cam.h = VH; }
  }

  // Awakened fighters get tweaked eyes/markings baked into their sprite.
  const lookCache = new Map();
  function lookFor(f) {
    const a = f.awakened ? f.awakened.def.id : null;
    if (!a) return f.look;
    const key = f.id + ':' + a;
    let l = lookCache.get(key);
    if (l) return l;
    l = Object.assign({}, f.look);
    if (a === 'crimson') l.eyes = '#ff2020';
    if (a === 'sage') { l.eyes = '#ffb020'; }
    if (a === 'beast') { l.eyes = '#ff6a10'; l.extra = l.extra === 'mask' ? 'mask' : 'marks'; }
    if (a === 'curse') l.eyes = '#ffe040';
    if (a === 'gates') l.skin = U.mix(f.look.skin, '#ff5a4a', 0.35);
    lookCache.set(key, l);
    return l;
  }

  // ---- fighters -------------------------------------------------------------------
  function drawFighter(ctx, f, cam, viewer) {
    let [pose, frame] = f.poseFrame();
    const look = lookFor(f);
    const lying = pose === 'lying';
    if (lying) pose = 'hurt';
    const view = f.view, flip = f.flip;
    const cv = Sprites.get(look, pose, frame, view);
    let sx = Math.round((f.x - f.y) * HALF_W - cam.x), sy = Math.round((f.x + f.y) * HALF_H - f.visZ() - cam.y);
    if (f.freeze > 0 && (f.state === 'hitstun' || f.state === 'air')) sx += (Math.floor(f.time * 60) % 2) ? 1 : -1;
    if (f.mount) {
      const m = f.mount;
      if (f.flash > 0 && Math.floor(f.time * 30) % 2) ctx.globalAlpha = 0.6;
      if (m.t < 1.5 && Math.floor(f.time * 10) % 2) ctx.globalAlpha = 0.55;
      drawHawk(ctx, sx, sy, f.facing, m.flap, false);
      ctx.globalAlpha = 1;
    }

    let alpha = 1;
    const enemyOfViewer = viewer && Combat.enemies(viewer, f);
    if (f.st.stealth > 0) alpha = enemyOfViewer ? (U.dist(viewer.x, viewer.y, f.x, f.y) < 1.4 ? 0.35 : 0.08) : 0.45;
    if (f.spawnProt > 0 && Math.floor(f.time * 12) % 2) alpha *= 0.4;
    if (f.dead) alpha *= U.clamp(1 - (f.deadT - 2.2) / 1, 0, 1);
    if (alpha <= 0.01) return;
    ctx.globalAlpha = alpha;

    const aw = f.awakened ? f.awakened.def.id : null;
    const key = Sprites.lookKey(look) + '|' + pose + '|' + frame + '|' + view;
    // pre-sprite awakening layers
    if (!lying && aw === 'spirit') {
      const big = Sprites.getTinted(look, pose, frame, view, '#9a60ff');
      ctx.globalAlpha = alpha * (0.3 + Math.sin(f.time * 6) * 0.05);
      ctx.save(); ctx.translate(sx, sy + 2); ctx.scale(flip ? -2 : 2, 2); ctx.drawImage(big, -SPR_OX, -SPR_OY, SPR_W, SPR_H); ctx.restore();
      ctx.globalAlpha = alpha * 0.5;
      ctx.fillStyle = '#c8a0ff';
      for (let k = 0; k < 4; k++) ctx.fillRect(sx - 9, sy - 46 + k * 5, 18, 1);
      ctx.globalAlpha = alpha;
    }
    if (!lying && aw === 'beast') {
      const sil = Sprites.getTinted(look, pose, frame, view, Math.floor(f.time * 10) % 2 ? '#ff7a20' : '#ff4a10');
      ctx.globalAlpha = alpha * 0.85;
      for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1], [-1, -1], [1, -1]]) blitSprite(ctx, sil, sx + ox, sy + oy, flip);
      ctx.fillStyle = '#ff6a10';
      for (let k = 0; k < 3; k++) {
        const bx = sx + (flip ? 5 : -5), by = sy - 12;
        for (let s = 0; s < 10; s++) {
          const a = -1.2 + k * 0.5 + Math.sin(f.time * 5 + k + s * 0.3) * 0.3;
          ctx.fillRect(Math.round(bx + Math.cos(a + Math.PI) * s * (flip ? -1.2 : 1.2)), Math.round(by + Math.sin(a) * s), 2, 2);
        }
      }
      ctx.globalAlpha = alpha;
    }
    if (!lying && (f.hasBuff('larmor') || aw === 'gates') && Math.floor(f.time * 20) % 3 === 0) {
      const sil = Sprites.getTinted(look, pose, frame, view, aw === 'gates' ? '#60ff80' : '#bfe0ff');
      ctx.globalAlpha = alpha * 0.7;
      blitSprite(ctx, sil, sx + U.randi(-1, 1), sy + U.randi(-1, 0), flip);
      ctx.globalAlpha = alpha;
    }

    if (lying) {
      ctx.save();
      ctx.translate(sx + (flip ? 13 : -13), sy - 3);
      ctx.rotate(flip ? -Math.PI / 2 : Math.PI / 2);
      if (flip) ctx.scale(1, 1);
      ctx.drawImage(cv, -SPR_OX, -SPR_OY + 6, SPR_W, SPR_H);
      ctx.restore();
    } else {
      blitSprite(ctx, cv, sx, sy, flip);
    }
    // overlays
    let tint = null, ta = 0;
    if (f.flash > 0) { tint = '#ffffff'; ta = 0.85; }
    else if (f.hasBuff('stoneskin')) { tint = '#8a8078'; ta = 0.45; }
    else if (aw === 'curse') { tint = '#2a0a3a'; ta = 0.3 + Math.sin(f.time * 4) * 0.1; }
    else if (f.st.genjutsu > 0) { tint = '#400010'; ta = 0.4; }
    else if (f.st.para > 0 && Math.floor(f.time * 20) % 2) { tint = '#e0f0ff'; ta = 0.6; }
    if (tint && !lying) {
      ctx.globalAlpha = alpha * ta;
      blitSprite(ctx, Sprites.getTinted(look, pose, frame, view, tint), sx, sy, flip);
    }
    ctx.globalAlpha = 1;
    void key;
  }

  function drawOverhead(ctx, f, cam, viewer) {
    if (!f.alive || f.isClone) return;
    if (f.st.stealth > 0 && viewer && Combat.enemies(viewer, f)) return;
    const vz = f.visZ ? f.visZ() : f.z;
    const wx = Math.round((f.x - f.y) * HALF_W - cam.x), wy = Math.round((f.x + f.y) * HALF_H - vz - cam.y) - 38;
    if (wx < -30 || wx > cam.w + 30 || wy < -20 || wy > cam.h + 40) return;
    // drawn in canvas pixels (finer than world pixels) to keep bars and names small
    ctx.setTransform(1, 0, 0, 1, wx * HIRES, wy * HIRES);
    const sx = 0, sy = 0;
    const w = 30;
    ctx.fillStyle = '#120a18'; ctx.fillRect(sx - w / 2 - 1, sy - 1, w + 2, 8);
    ctx.fillStyle = '#3a2a30'; ctx.fillRect(sx - w / 2, sy, w, 4);
    const hp = U.clamp(f.hp / f.maxHp, 0, 1);
    ctx.fillStyle = hp < 0.3 ? '#ff4a4a' : f.teamColor; ctx.fillRect(sx - w / 2, sy, Math.round(w * hp), 4);
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(sx - w / 2, sy, Math.round(w * hp), 1);
    ctx.fillStyle = '#6fa8ff'; ctx.fillRect(sx - w / 2, sy + 5, Math.round(w * f.chakra / f.maxChakra), 1);
    Font.draw(ctx, String(f.level), sx - w / 2 - 3, sy - 1, '#ffe9a0', { align: 'right', outline: '#120a18' });
    if (f === viewer) {
      const b = Math.floor(f.time * 3) % 2;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(sx - 3, sy - 9 + b, 7, 1); ctx.fillRect(sx - 2, sy - 8 + b, 5, 1); ctx.fillRect(sx - 1, sy - 7 + b, 3, 1); ctx.fillRect(sx, sy - 6 + b, 1, 1);
    } else if (!viewer || U.dist(viewer.x, viewer.y, f.x, f.y) < 11) {
      Font.draw(ctx, f.name.split(' ')[0].toUpperCase(), sx, sy - 10, f.teamColor, { align: 'center', outline: '#120a18' });
    }
    if (f.awakened) {
      const k = f.awakened.t / f.awakened.def.dur;
      ctx.fillStyle = f.awakened.def.colors[1]; ctx.fillRect(sx - w / 2, sy + 7, Math.round(w * k), 1);
    }
    if (f.mount && f.mount.shield > 0) {
      ctx.fillStyle = '#e8f0ff'; ctx.fillRect(sx - w / 2, sy + 9, Math.round(w * f.mount.shield / f.mount.maxShield), 1);
    }
    if (f.state === 'stun' || f.st.genjutsu > 0) {
      for (let k = 0; k < 3; k++) {
        const a = f.time * 5 + k * 2.1;
        ctx.fillStyle = f.st.genjutsu > 0 ? '#ff5050' : '#ffe14a';
        ctx.fillRect(Math.round(sx + Math.cos(a) * 12), Math.round(sy + 12 + Math.sin(a) * 3), 3, 3);
      }
    }
    ctx.setTransform(HIRES, 0, 0, HIRES, 0, 0);
  }

  // ---- blocks -----------------------------------------------------------------------
  function drawBlock(ctx, b, A, cam, dt, fadeRect) {
    const spr = Art.get(b.type, b.v, A.theme);
    let sx = Math.round((b.i - b.j) * HALF_W - cam.x), sy = Math.round((b.i + b.j) * HALF_H - cam.y);
    if (b.shake > 0) { b.shake -= dt; sx += (Math.floor(b.shake * 60) % 2) ? 1 : -1; }
    let rise = 0;
    if (b.rise > 0) { b.rise -= dt; rise = Math.round(b.rise / 0.25 * b.def.h); }
    const dx = sx + spr.ox, dy = sy + spr.oy + rise;
    let alpha = 1;
    if (b.life > 0 && b.life < 1.2) alpha = Math.floor(b.life * 10) % 2 ? 0.5 : 1;
    if (fadeRect && dx < fadeRect.x1 && dx + spr.c.width > fadeRect.x0 && dy < fadeRect.y1 && dy + spr.c.height - 8 > fadeRect.y0) alpha = Math.min(alpha, 0.42);
    ctx.globalAlpha = alpha;
    if (rise) {
      ctx.save(); ctx.beginPath(); ctx.rect(dx, dy - rise - 60, spr.c.width, spr.c.height - TILE_H + 60 + 8); ctx.clip();
      drawHi(ctx, spr.c, dx, dy);
      ctx.restore();
    } else drawHi(ctx, spr.c, dx, dy);
    if (b.flash > 0) {
      b.flash -= dt;
      ctx.globalAlpha = alpha * 0.7;
      drawHi(ctx, Sprites_tint(spr.c, '#ffffff'), dx, dy);
    }
    if (b.hp < b.maxHp * 0.6 && b.maxHp !== Infinity) {
      ctx.globalAlpha = alpha;
      Art.crackOverlay(ctx, dx, dy, spr.c.width, spr.c.height - 6, b.i * 31 + b.j, 1 - b.hp / b.maxHp);
    }
    if (b.burning > 0) {
      ctx.globalAlpha = 0.25 + Math.random() * 0.15;
      drawHi(ctx, Sprites_tint(spr.c, '#ff6a1a'), dx, dy);
    }
    ctx.globalAlpha = 1;
  }

  const tintMap = new Map();
  function Sprites_tint(c, col) {
    let m = tintMap.get(c);
    if (!m) { m = {}; tintMap.set(c, m); }
    if (m[col]) return m[col];
    const t = U.makeCanvas(c.width, c.height);
    const x = t.getContext('2d');
    x.drawImage(c, 0, 0);
    x.globalCompositeOperation = 'source-atop';
    x.fillStyle = col; x.fillRect(0, 0, t.width, t.height);
    t.lw = c.lw; t.lh = c.lh;
    m[col] = t;
    return t;
  }

  // ---- world ---------------------------------------------------------------------------
  function world(w) {
    ctx.setTransform(HIRES, 0, 0, HIRES, 0, 0);
    ctx.imageSmoothingEnabled = false;
    const now = performance.now();
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    if (w.cam.w !== VW || w.cam.h !== VH) { w.cam.w = VW; w.cam.h = VH; }
    const A = w.arena;
    const cam = { x: Math.round(w.cam.x + w.cam.sx), y: Math.round(w.cam.y + w.cam.sy), w: VW, h: VH };
    const viewer = w.camTarget;
    ctx.fillStyle = A.T.outside;
    ctx.fillRect(0, 0, VW, VH);
    // ground
    const gx = cam.x + A.originX, gy = cam.y;
    const sx0 = Math.max(0, gx), sy0 = Math.max(0, gy);
    const sw = Math.min(A.ground.width / A.groundRes - sx0, VW - (sx0 - gx)), sh = Math.min(A.ground.height / A.groundRes - sy0, VH - (sy0 - gy));
    const GR = A.groundRes;
    if (sw > 0 && sh > 0) ctx.drawImage(A.ground, sx0 * GR, sy0 * GR, sw * GR, sh * GR, sx0 - gx, sy0 - gy, sw, sh);

    // visible tile range
    const c1 = w.screenToWorld(-40, -120), c2 = w.screenToWorld(VW + 40, -120), c3 = w.screenToWorld(-40, VH + 110), c4 = w.screenToWorld(VW + 40, VH + 110);
    const i0 = Math.max(0, Math.floor(Math.min(c1.x, c2.x, c3.x, c4.x))), i1 = Math.min(A.w - 1, Math.ceil(Math.max(c1.x, c2.x, c3.x, c4.x)));
    const j0 = Math.max(0, Math.floor(Math.min(c1.y, c2.y, c3.y, c4.y))), j1 = Math.min(A.h - 1, Math.ceil(Math.max(c1.y, c2.y, c3.y, c4.y)));

    // ground overlays: water sparkle, puddles, burning tiles
    const tk = Math.floor(w.realTime * 3);
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const k = A.idx(i, j);
      const tsx = (i - j) * HALF_W - cam.x, tsy = (i + j) * HALF_H - cam.y;
      if (tsx < -20 || tsx > VW + 20 || tsy < -20 || tsy > VH + 10) continue;
      if (A.tiles[k] === T_WATER) {
        const h = U.hash2(i, j, tk);
        if (h > 0.55) { ctx.fillStyle = h > 0.85 ? '#ffffff' : '#bfe0ff'; ctx.fillRect(Math.round(tsx - 8 + h * 16), Math.round(tsy + 4 + U.hash2(j, i, tk) * 8), 2, 1); }
      } else if (A.wet[k] > 0) {
        ctx.globalAlpha = Math.min(0.42, A.wet[k] * 0.15);
        ctx.drawImage(puddle, Math.round(tsx - puddle.width / 2 + (U.hash2(i, j, 1) - 0.5) * 6), Math.round(tsy + 8 - puddle.height / 2 + (U.hash2(j, i, 2) - 0.5) * 4));
        ctx.globalAlpha = 1;
      }
      if (A.fire[k] > 0) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.3 + Math.random() * 0.25;
        ctx.drawImage(fireTile, Math.round(tsx - 16), Math.round(tsy));
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    // ground-level hazards and particles
    for (const h of w.hazards) if (h.drawGround) h.drawGround(ctx, cam);
    FX.draw(ctx, cam, 0);
    // shadows + team rings
    for (const f of w.fighters) {
      if (f.removed) continue;
      if (f.st.stealth > 0 && viewer && Combat.enemies(viewer, f)) continue;
      const [sx, sy] = DF.sp(f.x, f.y, 0, cam);
      if (sx < -30 || sx > VW + 30 || sy < -10 || sy > VH + 40) continue;
      const s = f.mount ? 3.4 : Math.max(0.5, 1 - f.z / 120);
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      PX.ellipse(ctx, sx, sy, 7 * s, 3.5 * s);
      if (!f.dead && !f.isClone) {
        ctx.fillStyle = f.teamColor;
        ctx.globalAlpha = f === viewer ? 0.95 : 0.6;
        PX.ellipseRing(ctx, sx, sy, 8, 4, 1);
        ctx.globalAlpha = 1;
      }
    }
    for (const p of w.projectiles) {
      if (p.z > 3 && p.kind !== 'shadow') { const [sx, sy] = DF.sp(p.x, p.y, 0, cam); ctx.fillStyle = 'rgba(0,0,0,0.22)'; PX.ellipse(ctx, sx, sy, Math.max(2, p.size * 0.8), Math.max(1, p.size * 0.4)); }
    }

    // depth-sorted scene
    const items = [];
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const b = A.blocks[A.idx(i, j)];
      if (!b) continue;
      const tsx = (i - j) * HALF_W - cam.x, tsy = (i + j) * HALF_H - cam.y;
      if (tsx < -60 || tsx > VW + 60 || tsy < -30 || tsy > VH + 110) continue;
      items.push({ d: i + j + 1, b });
    }
    // riders fly above props, so they sort as if a couple of tiles closer to the camera
    for (const f of w.fighters) if (!f.removed) items.push({ d: f.x + f.y + 0.01 + (f.mount ? 2.5 : 0), f });
    for (const p of w.projectiles) items.push({ d: p.x + p.y + 0.02, p });
    for (const h of w.hazards) if (h.drawSorted && !h.dead) items.push({ d: h.depth ? h.depth() : h.x + h.y, h });
    items.sort((a, b) => a.d - b.d);

    // occlusion: fade props that hide the watched fighter
    let fade = null;
    if (viewer && viewer.alive) {
      const [vx, vy] = DF.sp(viewer.x, viewer.y, viewer.z, cam);
      fade = { x0: vx - 10, x1: vx + 10, y0: vy - 30, y1: vy, d: viewer.x + viewer.y };
    }
    for (const it of items) {
      if (it.b) drawBlock(ctx, it.b, A, cam, dt, fade && it.d > fade.d + 0.3 ? fade : null);
      else if (it.f) drawFighter(ctx, it.f, cam, viewer);
      else if (it.p) { const p = it.p; if (p.draw) p.draw(ctx, p, cam); else (PROJ_DRAW[p.kind] || PROJ_DRAW.orb)(ctx, p, cam); }
      else if (it.h) it.h.drawSorted(ctx, cam);
    }

    for (const h of w.hazards) if (h.draw) h.draw(ctx, cam);
    FX.draw(ctx, cam, 1);
    drawReticle(w, cam);
    for (const f of w.fighters) drawOverhead(ctx, f, cam, viewer);
    drawLockMarker(w, cam);
    FX.drawTexts(ctx, cam);

    // atmosphere
    if (A.T.tint) { ctx.fillStyle = A.T.tint; ctx.fillRect(0, 0, VW, VH); }
    ctx.drawImage(vignette, 0, 0, VW, VH);
    drawOffscreenArrows(w, cam, viewer);
    drawMoon(w);
    if (w.flashT > 0) {
      ctx.globalAlpha = Math.min(1, w.flashT / w.flashDur) * 0.8;
      ctx.fillStyle = w.flashCol; ctx.fillRect(0, 0, VW, VH);
      ctx.globalAlpha = 1;
    }
    if (w.cutin) drawCutin(w.cutin);
  }

  // Rotating brackets around the locked-on enemy.
  function drawLockMarker(w, cam) {
    const p = w.player, t = p && p.lock;
    if (!t || !t.alive || !p.alive) return;
    const [sx, sy] = DF.sp(t.x, t.y, t.visZ(), cam);
    const cy = sy - 15, r = 13 + Math.sin(w.realTime * 6) * 1.5;
    const a0 = w.realTime * 2;
    ctx.fillStyle = '#120a18';
    for (let k = 0; k < 4; k++) {
      const a = a0 + k * Math.PI / 2;
      const bx = sx + Math.cos(a) * r, by = cy + Math.sin(a) * r * 0.9;
      PX.line(ctx, bx, by, bx - Math.cos(a + 0.6) * 5, by - Math.sin(a + 0.6) * 5, 3);
      PX.line(ctx, bx, by, bx - Math.cos(a - 0.6) * 5, by - Math.sin(a - 0.6) * 5, 3);
    }
    ctx.fillStyle = '#ff4a5a';
    for (let k = 0; k < 4; k++) {
      const a = a0 + k * Math.PI / 2;
      const bx = sx + Math.cos(a) * r, by = cy + Math.sin(a) * r * 0.9;
      PX.line(ctx, bx, by, bx - Math.cos(a + 0.6) * 5, by - Math.sin(a + 0.6) * 5, 1);
      PX.line(ctx, bx, by, bx - Math.cos(a - 0.6) * 5, by - Math.sin(a - 0.6) * 5, 1);
    }
    // ground ring so you can read their position while they're airborne
    ctx.fillStyle = 'rgba(255,74,90,0.7)';
    const [gx, gy] = DF.sp(t.x, t.y, 0, cam);
    PX.ellipseRing(ctx, gx, gy, 10, 5, 1);
  }

  // Ground reticle at the player's aim point (easier to read than the OS cursor).
  let cursorHidden = false;
  function drawReticle(w, cam) {
    const p = w.player;
    const show = !!(p && p.alive && !w.demo && !w.over && Input.usingMouse() && !p.lock);
    if (show !== cursorHidden) { cursorHidden = show; canvas.style.cursor = show ? 'none' : 'crosshair'; }
    if (!p || !p.alive || w.demo || w.over || p.lock) return;
    const [sx, sy] = DF.sp(p.aimX, p.aimY, 0, cam);
    const r = 5 + (Math.floor(w.realTime * 3) % 2);
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = '#120a18';
    for (const [dx, dy] of [[-2 * r, 0], [2 * r, 0], [0, -r], [0, r]]) ctx.fillRect(sx + dx - 2, sy + dy - 2, 4, 4);
    ctx.fillStyle = p.teamColor;
    for (const [dx, dy] of [[-2 * r, 0], [2 * r, 0], [0, -r], [0, r]]) ctx.fillRect(sx + dx - 1, sy + dy - 1, 2, 2);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(sx, sy, 1, 1);
    ctx.globalAlpha = 1;
  }

  function drawOffscreenArrows(w, cam, viewer) {
    if (!viewer || !viewer.alive || w.demo) return;
    for (const f of w.fighters) {
      if (!f.alive || f.isClone || !Combat.enemies(viewer, f) || f.st.stealth > 0) continue;
      const d = U.dist(viewer.x, viewer.y, f.x, f.y);
      if (d > 20) continue;
      const [sx, sy] = DF.sp(f.x, f.y, 14, cam);
      if (sx > 0 && sx < VW && sy > 0 && sy < VH) continue;
      const cx = VW / 2, cy = VH / 2;
      const a = Math.atan2(sy - cy, sx - cx);
      const ex = U.clamp(cx + Math.cos(a) * VW, 10, VW - 10), ey = U.clamp(cy + Math.sin(a) * VH, 30, VH - 50);
      ctx.fillStyle = f.teamColor;
      ctx.globalAlpha = 0.5 + 0.5 * (1 - d / 20);
      for (let k = 0; k < 4; k++) {
        const bx = ex - Math.cos(a) * k * 1.5, by = ey - Math.sin(a) * k * 1.5;
        const px = -Math.sin(a) * (3 - k), py = Math.cos(a) * (3 - k);
        PX.line(ctx, bx - px, by - py, bx + px, by + py, 1);
      }
      ctx.globalAlpha = 1;
    }
  }

  function drawMoon(w) {
    const m = w.moonFx;
    if (!m) return;
    const v = w.camTarget;
    if (!v || !(m.victims.includes(v) || m.caster === v)) return;
    const k = Math.min(1, m.t / 0.3) * (m.t > m.dur - 0.3 ? (m.dur - m.t) / 0.3 : 1);
    ctx.globalAlpha = 0.45 * k;
    ctx.fillStyle = '#5a0008'; ctx.fillRect(0, 0, VW, VH);
    ctx.globalAlpha = 0.9 * k;
    ctx.fillStyle = '#ff2030'; PX.circle(ctx, VW / 2, 60, 34);
    ctx.fillStyle = '#b00010'; PX.circle(ctx, VW / 2 + 6, 56, 26);
    ctx.fillStyle = '#ff5060'; PX.circle(ctx, VW / 2 - 10, 50, 8);
    ctx.globalAlpha = 1;
  }

  function drawCutin(c) {
    const f = c.f;
    const el = ELEMENTS[f.ultimate.element] || ELEMENTS.shinobi;
    const k = c.t / c.dur;
    const inK = Math.min(1, c.t / 0.15), outK = k > 0.8 ? (1 - k) / 0.2 : 1;
    const h = Math.round(64 * inK * outK);
    const y = Math.round(VH * 0.32);
    ctx.fillStyle = 'rgba(10,6,18,0.85)'; ctx.fillRect(0, y - h / 2, VW, h);
    ctx.fillStyle = el.color; ctx.fillRect(0, y - h / 2, VW, 2); ctx.fillRect(0, y + h / 2 - 2, VW, 2);
    if (h < 20) return;
    // speed lines
    ctx.fillStyle = U.rgba(el.light, 0.35);
    for (let n = 0; n < 12; n++) { const ly = y - h / 2 + 4 + ((n * 37 + Math.floor(c.t * 60) * 13) % (h - 8)); ctx.fillRect((n * 97 + c.t * 900) % VW, ly, 30 + (n % 3) * 20, 1); }
    // narrow (portrait) screens: smaller portrait and title so the name fits
    const narrow = VW < 320;
    const por = Sprites.portrait(lookFor(f), narrow ? 2 : 3);
    const px = Math.round(U.lerp(-por.lw, narrow ? 2 : VW * 0.18, U.easeOutCubic(Math.min(1, c.t / 0.25))) + c.t * (narrow ? 6 : 12));
    ctx.save(); ctx.beginPath(); ctx.rect(0, y - h / 2 + 2, VW, h - 4); ctx.clip();
    drawHi(ctx, por, px, y - por.lh / 2 + 6);
    ctx.restore();
    const nameScale = narrow && Font.measure(c.name.toUpperCase(), 2) > VW - por.lw - 10 ? 1 : 2;
    const nameW = Font.measure(c.name.toUpperCase(), nameScale);
    const tx0 = narrow ? Math.max(por.lw + 4, Math.min(VW * 0.42, VW - nameW - 4)) : VW * 0.42;
    const tx = Math.round(U.lerp(VW + 50, tx0, U.easeOutCubic(Math.min(1, c.t / 0.3))));
    Font.draw(ctx, 'ULTIMATE', tx, y - 18, el.light, { outline: '#120a18' });
    Font.draw(ctx, c.name.toUpperCase(), tx, y - 6, '#ffffff', { scale: nameScale, outline: '#120a18' });
    Font.draw(ctx, f.name.toUpperCase(), tx, y + 14, el.color, { outline: '#120a18' });
  }

  return {
    init, resize, world, lookFor,
    get ctx() { return ctx; }, get VW() { return VW; }, get VH() { return VH; }, get scale() { return scale; }, get canvas() { return canvas; },
  };
})();

<script>
// ---- js/hud.js ----
'use strict';
// ---------------------------------------------------------------------------
// In-game HUD drawn in pixel space on top of the world.
// ---------------------------------------------------------------------------

const HUD = (() => {
  let mini = null, miniT = 0, miniFor = null;
  const OUT = '#120a18';
  const KEYS = ['Q', 'E', 'R', 'F'];

  function bar(ctx, x, y, w, h, k, col, bg = '#2a2030', edge = OUT) {
    ctx.fillStyle = edge; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    ctx.fillStyle = bg; ctx.fillRect(x, y, w, h);
    const fw = Math.round(w * U.clamp(k, 0, 1));
    ctx.fillStyle = col; ctx.fillRect(x, y, fw, h);
    if (h >= 4) { ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(x, y, fw, 1); }
  }

  function panel(ctx, x, y, w, h) {
    ctx.fillStyle = 'rgba(12,8,20,0.72)'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#3a2e4a'; ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1); ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h);
  }

  // The HUD is drawn in canvas pixels (half the size of world pixels) so it
  // stays compact; on small windows it scales back up to stay readable.
  let hudK = 1;
  function draw(ctx, w) {
    hudK = Math.max(1, Math.round(2 * HIRES / Render.scale));
    ctx.setTransform(hudK, 0, 0, hudK, 0, 0);
    ctx.imageSmoothingEnabled = false;
    const VW = Math.floor(Render.canvas.width / hudK), VH = Math.floor(Render.canvas.height / hudK);
    const f = w.player || w.camTarget;
    if (!f) return;
    if (w.player && w.player.alive && w.player.hp < w.player.maxHp * 0.25) {
      // low health warning pulse
      const k = 0.5 + 0.5 * Math.sin(w.realTime * 7);
      for (let i = 0; i < 6; i++) {
        ctx.fillStyle = `rgba(200,20,30,${(0.28 - i * 0.045) * (0.5 + 0.5 * k)})`;
        ctx.fillRect(i * 3, i * 3, VW - i * 6, 3); ctx.fillRect(i * 3, VH - i * 3 - 3, VW - i * 6, 3);
        ctx.fillRect(i * 3, i * 3, 3, VH - i * 6); ctx.fillRect(VW - i * 3 - 3, i * 3, 3, VH - i * 6);
      }
    }
    if (!w.demo) {
      drawStatus(ctx, f, w);
      drawSlots(ctx, f, VW, VH, w);
      if (f.mount && f === w.player) {
        const m = f.mount, bw = 120, x = Math.round(VW / 2 - bw / 2), y = VH - 92;
        const pad = Input.usingPad(), sony = Input.pad.sony;
        Font.draw(ctx, 'STORM HAWK ' + Math.ceil(m.t) + 'S', VW / 2, y - 10, '#9af0c8', { align: 'center', outline: OUT });
        bar(ctx, x, y, bw, 3, m.shield / m.maxShield, '#e8f0ff');
        const keys = pad ? (sony ? ['SQUARE', 'TRIANGLE', 'CROSS'] : ['X', 'Y', 'A']) : ['LMB', 'K', 'SPACE'];
        Font.draw(ctx, keys[0] + ' BOMB  ' + keys[1] + ' DIVE  ' + keys[2] + ' HOP OFF', VW / 2, y + 6, '#e8dcc0', { align: 'center', outline: OUT });
      }
    }
    drawMatchInfo(ctx, w, VW);
    drawTargetFrame(ctx, w, VW, VH);
    drawMinimap(ctx, w, VW);
    drawKillfeed(ctx, w, VW);
    drawCombo(ctx, f, VH);
    drawNotices(ctx, w, VW, VH);
    if (w.player && w.player.dead && !w.over) {
      const p = w.player;
      const txt = p.eliminated ? 'ELIMINATED - SPECTATING' : 'RESPAWN IN ' + Math.max(1, Math.ceil(p.respawnT));
      Font.draw(ctx, txt, VW / 2, VH * 0.62, '#ffffff', { align: 'center', scale: 2, outline: OUT });
    }
    if (!w.player && !w.demo) Font.draw(ctx, 'SPECTATING ' + (w.camTarget ? w.camTarget.name.toUpperCase() : '') + '   [A]/[D] SWITCH', VW / 2, VH - 62, '#c9b6ff', { align: 'center', outline: OUT });
    if (w.player && w.startT < 14 && !w.over) drawControlsHint(ctx, VW, VH, w.startT);
    if (Input.isDown('score') && !w.demo) drawScoreboard(ctx, w, VW, VH);
  }

  function drawStatus(ctx, f, w) {
    const x = 4, y = 4, pw = 152;
    panel(ctx, x, y, pw, 40);
    const por = Sprites.portrait(Render.lookFor(f), 1);
    ctx.fillStyle = '#1a1226'; ctx.fillRect(x + 3, y + 3, 30, 34);
    ctx.save(); ctx.beginPath(); ctx.rect(x + 3, y + 3, 30, 34); ctx.clip();
    drawHi(ctx, por, x + 6, y + 9);
    ctx.restore();
    ctx.fillStyle = f.teamColor; ctx.fillRect(x + 3, y + 36, 30, 1);
    const tx = x + 37, bw = pw - 41;
    Font.draw(ctx, f.name.split(' ')[0].toUpperCase(), tx, y + 3, '#ffffff', { outline: OUT });
    Font.draw(ctx, 'LV' + f.level, x + pw - 4, y + 3, '#ffe14a', { align: 'right', outline: OUT });
    bar(ctx, tx, y + 13, bw, 6, f.hp / f.maxHp, f.hp < f.maxHp * 0.3 ? '#ff4a4a' : '#5ad06a');
    bar(ctx, tx, y + 21, bw, 3, f.chakra / f.maxChakra, f.state === 'charge' && Math.floor(f.time * 10) % 2 ? '#bfe0ff' : '#4a8cff');
    bar(ctx, tx, y + 26, bw, 1, f.level >= MAX_LEVEL ? 1 : f.xp / f.xpNext(), '#ffe14a');
    // bottom row: taijutsu level, kunai ammo, substitution logs
    Font.draw(ctx, 'T' + f.taiLvl(), tx, y + 30, '#ffb070', { outline: OUT });
    for (let k = 0; k < 4; k++) {
      ctx.fillStyle = k < f.kunai ? '#d8dce6' : '#3a3a44';
      ctx.fillRect(tx + 16 + k * 5, y + 30, 1, 6); ctx.fillRect(tx + 15 + k * 5, y + 34, 3, 1);
    }
    for (let k = 0; k < 2; k++) {
      const full = f.sub >= (k + 1) * 50;
      const lx = tx + 40 + k * 12, ly = y + 32;
      ctx.fillStyle = full ? '#a8763e' : '#3a2a20'; ctx.fillRect(lx, ly, 10, 4);
      ctx.fillStyle = full ? '#e8c890' : '#4a3a2a'; ctx.fillRect(lx + 8, ly, 2, 4);
      if (!full && f.sub > k * 50) { ctx.fillStyle = '#6a4a2a'; ctx.fillRect(lx, ly + 3, Math.round(10 * ((f.sub - k * 50) / 50)), 1); }
    }
    if (f.guard < 100) bar(ctx, tx + 66, y + 33, bw - 66, 2, f.guard / 100, f.guard < 30 ? '#ff8a4a' : '#e8e8f0');
    // statuses under the panel
    let sx = x + 2;
    const st = [];
    if (f.st.burn > 0) st.push(['BURN', '#ff8a1f']);
    if (f.st.wet > 0) st.push(['WET', '#6ec6ff']);
    if (f.st.para > 0) st.push(['SHOCK', '#e0f0ff']);
    if (f.st.slow > 0) st.push(['SLOW', '#c08a4a']);
    if (f.st.stealth > 0) st.push(['HIDDEN', '#c9b6ff']);
    for (const b of f.buffs) st.push([b.id === 'stoneskin' ? 'STONE' : b.id === 'larmor' ? 'VOLT' : 'BUFF', '#ffe14a']);
    for (const [t, c] of st.slice(0, 4)) { sx += Font.draw(ctx, t, sx, y + 44, c, { outline: OUT }) + 5; }
  }

  // Health bar of the locked-on enemy, top centre.
  function drawTargetFrame(ctx, w, VW, VH) {
    const p = w.player, t = p && p.lock;
    if (!t || !t.alive) return;
    const E = ELEMENTS[t.affinity] || ELEMENTS.shinobi;
    const bw = 120, x = Math.round(VW / 2 - bw / 2), y = VH - 70;
    panel(ctx, x - 4, y - 3, bw + 8, 21);
    Font.draw(ctx, t.name.toUpperCase(), x, y, t.teamColor, { outline: OUT });
    Font.draw(ctx, 'LV' + t.level, x + bw, y, '#ffe14a', { align: 'right', outline: OUT });
    bar(ctx, x, y + 10, bw, 4, t.hp / t.maxHp, t.hp < t.maxHp * 0.3 ? '#ff4a4a' : '#ff8a5a');
    ctx.fillStyle = E.color; ctx.fillRect(x, y + 15, 12, 1);
    if (t.awakened) { ctx.fillStyle = t.awakened.def.colors[1]; ctx.fillRect(x + 14, y + 15, Math.round((bw - 14) * t.awakened.t / t.awakened.def.dur), 1); }
  }

  function orb(ctx, cx, cy, r, k, col, label, ready, time, active) {
    ctx.fillStyle = OUT; PX.circle(ctx, cx, cy, r + 1);
    ctx.fillStyle = '#1e1628'; PX.circle(ctx, cx, cy, r);
    const fillTo = Math.round(cy + r - k * r * 2);
    ctx.save(); ctx.beginPath(); ctx.rect(cx - r - 1, fillTo, r * 2 + 3, r * 2 + 2); ctx.clip();
    ctx.fillStyle = col; PX.circle(ctx, cx, cy, r);
    ctx.restore();
    if (ready) {
      const p = Math.floor(time * 6) % 2;
      ctx.fillStyle = '#ffffff'; PX.ellipseRing(ctx, cx, cy, r + 2 + p, r + 2 + p, 1);
    }
    if (active) { ctx.fillStyle = '#ffffff'; PX.ellipseRing(ctx, cx, cy, r + 1, r + 1, 1); }
    Font.draw(ctx, label, cx, cy - 3, ready ? '#ffffff' : '#c8c0d8', { align: 'center', outline: OUT });
  }

  function drawSlots(ctx, f, VW, VH, w) {
    const size = 24, gap = 5;
    const total = size * 4 + gap * 3;
    const x0 = Math.round(VW / 2 - total / 2), y0 = VH - size - 14;
    panel(ctx, x0 - 36, y0 - 9, total + 72, size + 21);
    for (let i = 0; i < 4; i++) {
      const s = f.jutsu[i];
      const x = x0 + i * (size + gap);
      if (!s) { ctx.fillStyle = '#1a1226'; ctx.fillRect(x, y0, size, size); continue; }
      ctx.drawImage(Icons.jutsu(s.def), x, y0);
      const maxCd = f.cooldownFor(s);
      if (s.cd > 0) {
        const k = s.cd / maxCd;
        ctx.fillStyle = 'rgba(8,4,14,0.72)'; ctx.fillRect(x + 1, y0 + 1, size - 2, Math.round((size - 2) * k));
        Font.draw(ctx, String(Math.ceil(s.cd)), x + size / 2, y0 + 8, '#ffffff', { align: 'center', outline: OUT });
      } else if (f.chakra < f.costFor(s)) {
        ctx.fillStyle = 'rgba(30,60,160,0.55)'; ctx.fillRect(x + 1, y0 + 1, size - 2, size - 2);
      }
      if (f.state === 'cast' && f.castSlot === i) { ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y0 - 1, size, 1); ctx.fillRect(x, y0 + size, size, 1); }
      if (Input.usingPad()) {
        Font.draw(ctx, Input.pad.sony ? 'L2' : 'LT', x + 1, y0 + size + 3, '#e8dcc0', { outline: OUT });
        padGlyph(ctx, x + size - 5, y0 + size + 6, i);
      } else {
        Font.draw(ctx, KEYS[i], x + size / 2, y0 + size + 3, '#e8dcc0', { align: 'center', outline: OUT });
      }
      const L = f.lvlOf(s.id);
      for (let p = 0; p < 5; p++) {
        ctx.fillStyle = p < L ? (L >= 5 ? '#ff9af0' : '#8ff0ff') : '#3a2e4a';
        ctx.fillRect(x + 2 + p * 4, y0 - 5, 3, 2);
      }
      Font.draw(ctx, String(f.costFor(s)), x + size - 2, y0 + size - 8, '#8fb8ff', { align: 'right', outline: OUT });
    }
    // awakening & ultimate orbs
    const aw = f.awakening, ul = f.ultimate;
    const pad = Input.usingPad(), sony = Input.pad.sony;
    if (aw) {
      const k = f.awakened ? f.awakened.t / aw.dur : f.awak / 100;
      orb(ctx, x0 - 20, y0 + 11, 11, k, aw.colors[1], pad ? (sony ? 'R1' : 'RB') : 'T', !f.awakened && f.awak >= 100, f.time, !!f.awakened);
    }
    if (ul) {
      const el = ELEMENTS[ul.element] || ELEMENTS.shinobi;
      orb(ctx, x0 + total + 20, y0 + 11, 11, f.ult / 100, el.color, pad ? (sony ? 'R2' : 'RT') : 'G', f.ult >= 100, f.time, f.state === 'ult');
    }
    // hover labels
    if (f.awak >= 100 && aw && !f.awakened) Font.draw(ctx, 'AWAKEN!', x0 - 20, y0 - 18, aw.colors[0], { align: 'center', outline: OUT });
    if (f.ult >= 100 && ul) Font.draw(ctx, 'ULTIMATE!', x0 + total + 20, y0 - 18, '#ffe14a', { align: 'center', outline: OUT });
    void w;
  }

  function drawMatchInfo(ctx, w, VW) {
    const c = w.cfg;
    if (w.demo) return;
    const cx = VW / 2;
    let y = 5;
    if (c.timeLimit) {
      const col = w.timeLeft < 30 ? (Math.floor(w.realTime * 4) % 2 ? '#ff6a6a' : '#ffffff') : '#ffffff';
      Font.draw(ctx, U.fmtTime(w.timeLeft), cx, y, col, { align: 'center', scale: 2, outline: OUT });
      y += 18;
    }
    if (c.training) {
      Font.draw(ctx, 'TRAINING DOJO', cx, y, '#ffd35c', { align: 'center', scale: 2, outline: OUT });
      Font.draw(ctx, 'PARTNERS REVIVE - ESC TO LEAVE', cx, y + 18, '#c8c0d8', { align: 'center', outline: OUT });
      return;
    }
    const goal = c.winType === 'kills' ? 'FIRST TO ' + c.killLimit + ' KO' : c.stock + ' LIVES - LAST ONE STANDING';
    Font.draw(ctx, goal, cx, y, '#c8c0d8', { align: 'center', outline: OUT });
    y += 11;
    if (c.mode === 'teams') {
      const teams = Object.keys(w.teamScore).map(Number);
      const bw = 28;
      let x = cx - (teams.length * (bw + 4)) / 2;
      for (const t of teams) {
        ctx.fillStyle = OUT; ctx.fillRect(x - 1, y - 1, bw + 2, 12);
        ctx.fillStyle = U.shade(TEAM_COLORS[t], -0.45); ctx.fillRect(x, y, bw, 10);
        ctx.fillStyle = TEAM_COLORS[t]; ctx.fillRect(x, y, bw, 2);
        const val = c.winType === 'stock' ? w.fighters.filter((f) => f.team === t && !f.isClone).reduce((a, f) => a + Math.max(0, f.lives), 0) : w.teamScore[t];
        Font.draw(ctx, String(val), x + bw / 2, y + 2, '#ffffff', { align: 'center' });
        x += bw + 4;
      }
    } else {
      const list = w.fighters.filter((f) => !f.isClone).sort((a, b) => (c.winType === 'stock' ? b.lives - a.lives : 0) || b.kills - a.kills || b.dmgDealt - a.dmgDealt).slice(0, 3);
      list.forEach((f, i) => {
        const v = c.winType === 'stock' ? f.lives + ' LIVES' : f.kills + ' KO';
        Font.draw(ctx, (i + 1) + '. ' + f.name.split(' ')[0].toUpperCase() + '  ' + v, cx, y + i * 9, f === w.player ? '#ffe14a' : f.teamColor, { align: 'center', outline: OUT });
      });
    }
  }

  const MQ = 1.1; // minimap pixels per tile step
  function buildMini(w) {
    const A = w.arena;
    const Wd = Math.ceil((A.w + A.h) * MQ), Hd = Math.ceil((A.w + A.h) * MQ / 2);
    const c = U.makeCanvas(Wd + 3, Hd + 3);
    const x = c.getContext('2d');
    const P = A.T.pal;
    for (let j = 0; j < A.h; j++) for (let i = 0; i < A.w; i++) {
      const k = A.idx(i, j);
      const t = A.tiles[k];
      let col = [P.grass, P.dirt, P.stone, P.sand, P.water, P.wood, P.rock, P.snow][t][1];
      const b = A.blocks[k];
      if (b) col = b.type === 'cliff' ? [40, 34, 40] : [col[0] * 0.55, col[1] * 0.55, col[2] * 0.55];
      if (A.fire[k] > 0) col = [255, 120, 30];
      x.fillStyle = `rgb(${col[0] | 0},${col[1] | 0},${col[2] | 0})`;
      x.fillRect(Math.round((i - j + A.h) * MQ) + 1, Math.round((i + j) * MQ / 2) + 1, 2, 1);
    }
    return c;
  }

  function drawMinimap(ctx, w, VW) {
    const A = w.arena;
    miniT -= 1 / 60;
    if (!mini || miniT <= 0 || miniFor !== A) { mini = buildMini(w); miniT = 1.5; miniFor = A; }
    const mx = VW - mini.width - 6, my = 5;
    panel(ctx, mx - 3, my - 2, mini.width + 6, mini.height + 5);
    ctx.drawImage(mini, mx, my);
    feedY = my + mini.height + 8;
    const toMini = (x, y) => [mx + 1 + Math.round((x - y + A.h) * MQ), my + 1 + Math.round((x + y) * MQ / 2)];
    // camera frame
    const c = w.cam;
    const p1 = w.screenToWorld(0, 0), p2 = w.screenToWorld(c.w, c.h);
    const [ax, ay] = toMini(p1.x, p1.y), [bx, by] = toMini(p2.x, p2.y);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(ax, ay, bx - ax, 1); ctx.fillRect(ax, by, bx - ax, 1); ctx.fillRect(ax, ay, 1, by - ay); ctx.fillRect(bx, ay, 1, by - ay);
    const viewer = w.player;
    for (const f of w.fighters) {
      if (!f.alive || f.isClone) continue;
      if (viewer && f.st.stealth > 0 && Combat.enemies(viewer, f)) continue;
      const [px, py] = toMini(f.x, f.y);
      ctx.fillStyle = OUT; ctx.fillRect(px - 2, py - 2, 4, 4);
      ctx.fillStyle = f === viewer ? (Math.floor(w.realTime * 4) % 2 ? '#ffffff' : '#ffe14a') : f.teamColor;
      ctx.fillRect(px - 1, py - 1, 2, 2);
    }
  }

  let feedY = 72;
  function drawKillfeed(ctx, w, VW) {
    let y = feedY;
    for (const k of w.killfeed) {
      const age = w.realTime - k.t;
      if (age > 6) continue;
      ctx.globalAlpha = age > 5 ? 6 - age : 1;
      const vn = k.victim.name.split(' ')[0].toUpperCase();
      const kn = k.killer ? k.killer.name.split(' ')[0].toUpperCase() : '';
      const mid = k.name ? ' [' + k.name.toUpperCase() + '] ' : ' > ';
      const total = Font.measure(kn + mid + vn) + 8;
      const x = VW - 6 - total;
      ctx.fillStyle = 'rgba(12,8,20,0.6)'; ctx.fillRect(x, y - 2, total, 11);
      let cx = x + 4;
      if (kn) cx += Font.draw(ctx, kn, cx, y, k.killer.teamColor);
      cx += Font.draw(ctx, mid, cx, y, '#a898b8');
      Font.draw(ctx, vn, cx, y, k.victim.teamColor);
      ctx.globalAlpha = 1;
      y += 12;
    }
  }

  function drawCombo(ctx, f, VH) {
    if (!f || f.comboShowT <= 0 || f.comboShow < 2) return;
    const n = f.comboShow;
    f.bestCombo = Math.max(f.bestCombo || 0, n);
    const k = f.comboShowT;
    ctx.globalAlpha = Math.min(1, k * 2);
    const col = n >= 15 ? '#ff5af0' : n >= 10 ? '#ff6a3a' : n >= 5 ? '#ffc83a' : '#ffffff';
    const pop = k > 1.3 ? 4 : 3;
    Font.draw(ctx, String(n), 12, VH * 0.42, col, { scale: pop, outline: OUT });
    Font.draw(ctx, 'HIT COMBO', 12, VH * 0.42 + pop * 7 + 3, '#ffffff', { outline: OUT });
    ctx.globalAlpha = 1;
  }

  function drawNotices(ctx, w, VW, VH) {
    let y = VH * 0.2;
    for (const n of w.notices) {
      const a = n.t < 0.15 ? n.t / 0.15 : n.t > 2.4 ? (3 - n.t) / 0.6 : 1;
      ctx.globalAlpha = U.clamp(a, 0, 1);
      const big = /VICTORY|DEFEAT|WINS|DRAW/.test(n.text);
      Font.draw(ctx, n.text, VW / 2, y, n.color, { align: 'center', scale: big ? 3 : 1, outline: OUT });
      y += big ? 30 : 12;
      ctx.globalAlpha = 1;
    }
  }

  // PlayStation shapes or Xbox letters, centred on (x, y).
  function padGlyph(ctx, x, y, i) {
    x = Math.round(x); y = Math.round(y);
    if (!Input.pad.sony) { Font.draw(ctx, 'ABXY'[i], x, y - 3, ['#5ad06a', '#ff5a4a', '#4aa8ff', '#ffc83a'][i], { align: 'center', outline: OUT }); return; }
    ctx.fillStyle = OUT; ctx.fillRect(x - 4, y - 4, 9, 9);
    ctx.fillStyle = ['#8fb8ff', '#ff7a7a', '#ff9ad8', '#7fe0b0'][i];
    if (i === 0) { PX.line(ctx, x - 3, y - 3, x + 3, y + 3); PX.line(ctx, x - 3, y + 3, x + 3, y - 3); }
    else if (i === 1) PX.ellipseRing(ctx, x, y, 3, 3, 1);
    else if (i === 2) { ctx.fillRect(x - 3, y - 3, 7, 1); ctx.fillRect(x - 3, y + 3, 7, 1); ctx.fillRect(x - 3, y - 3, 1, 7); ctx.fillRect(x + 3, y - 3, 1, 7); }
    else { PX.line(ctx, x, y - 3, x - 3, y + 3); PX.line(ctx, x, y - 3, x + 3, y + 3); ctx.fillRect(x - 3, y + 3, 7, 1); }
  }

  function drawControlsHint(ctx, VW, VH, t) {
    const sony = Input.pad.sony;
    const lines = Input.usingPad() ? (sony ? [
      'L-STICK MOVE  CROSS JUMP  SQUARE ATTACK',
      'TRIANGLE HEAVY  CIRCLE DASH  R1 BLOCK',
      'R3 LOCK-ON  R2 KUNAI (HOLD)  L1 CHAKRA',
      'HOLD L2 + FACE BUTTON = JUTSU',
      'L2+R2 ULTIMATE  L2+R1 AWAKEN',
    ] : [
      'L-STICK MOVE  A JUMP  X ATTACK',
      'Y HEAVY  B DASH  RB BLOCK',
      'RS LOCK-ON  RT KUNAI (HOLD)  LB CHAKRA',
      'HOLD LT + FACE BUTTON = JUTSU',
      'LT+RT ULTIMATE  LT+RB AWAKEN',
    ]) : [
      'WASD MOVE  MOUSE AIM  SPACE JUMP',
      'LMB ATTACK (HOLD = HEAVY)  RMB BLOCK',
      'SHIFT DASH / SUBSTITUTE  Z LOCK-ON',
      'Q E R F JUTSU  X KUNAI  C CHAKRA',
      'T AWAKEN  G ULTIMATE  ESC PAUSE',
    ];
    ctx.globalAlpha = t > 11 ? (14 - t) / 3 : 1;
    const wdt = Math.max(...lines.map((l) => Font.measure(l))) + 12;
    panel(ctx, 4, 58, wdt, lines.length * 10 + 6);
    lines.forEach((l, i) => Font.draw(ctx, l, 9, 62 + i * 10, '#e8dcc0'));
    ctx.globalAlpha = 1;
    void VW; void VH;
  }

  function drawScoreboard(ctx, w, VW, VH) {
    const list = w.fighters.filter((f) => !f.isClone).sort((a, b) => (w.cfg.mode === 'teams' ? a.team - b.team : 0) || b.kills - a.kills || b.dmgDealt - a.dmgDealt);
    const rowH = 12, wd = 300, h = 30 + list.length * rowH;
    const x = Math.round(VW / 2 - wd / 2), y = Math.round(VH / 2 - h / 2);
    panel(ctx, x, y, wd, h);
    Font.draw(ctx, 'SHINOBI', x + 8, y + 8, '#c8c0d8');
    const cols = [['LV', 150], ['K', 175], ['D', 197], ['A', 219], ['DMG', 255], [w.cfg.winType === 'stock' ? 'LIVES' : 'COMBO', 290]];
    for (const [t, cx] of cols) Font.draw(ctx, t, x + cx, y + 8, '#c8c0d8', { align: 'right' });
    list.forEach((f, i) => {
      const ry = y + 22 + i * rowH;
      if (f === w.player) { ctx.fillStyle = 'rgba(255,225,74,0.12)'; ctx.fillRect(x + 2, ry - 2, wd - 4, rowH); }
      ctx.fillStyle = f.teamColor; ctx.fillRect(x + 6, ry, 3, 7);
      Font.draw(ctx, f.name.toUpperCase(), x + 13, ry, f.dead ? '#806878' : '#ffffff');
      const vals = [f.level, f.kills, f.deaths, f.assists, Math.round(f.dmgDealt), w.cfg.winType === 'stock' ? Math.max(0, f.lives) : f.bestCombo || 0];
      vals.forEach((v, k) => Font.draw(ctx, String(v), x + cols[k][1], ry, '#e8dcc0', { align: 'right' }));
    });
  }

  return { draw, invalidateMini() { mini = null; } };
})();

</script>
<script>
// ---- js/ui.js ----
'use strict';
// ---------------------------------------------------------------------------
// HTML menus: title, battle setup, character creator, roster, how-to-play,
// settings, pause and results. Rendered into #ui over the game canvas.
// ---------------------------------------------------------------------------

const UI = (() => {
  let root;
  let rafs = [];

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const k in attrs) {
        const v = attrs[k];
        if (v === undefined || v === null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'style') el.style.cssText = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    return el;
  }

  let backFn = null; // what the controller's Circle/B button does on this screen

  function clear() {
    for (const id of rafs) cancelAnimationFrame(id);
    rafs = [];
    root.innerHTML = '';
    Input.enabled = true;
  }

  function screen(cls, ...kids) {
    clear();
    const s = h('div', { class: 'screen ' + cls }, ...kids);
    root.appendChild(s);
    if (document.body.classList.contains('pad-nav')) requestAnimationFrame(() => { if (!root.contains(document.activeElement)) focusEl(preferred()); });
    return s;
  }

  // ---- controller navigation ---------------------------------------------------
  function focusables() {
    return [...root.querySelectorAll('button, select, input, [tabindex]')].filter((el) => !el.disabled && el.offsetParent !== null);
  }
  function preferred() {
    const els = focusables();
    return root.querySelector('.btn.primary') || els.find((el) => !el.classList.contains('back')) || els[0];
  }
  function focusEl(el) {
    if (!el) return;
    el.focus({ preventScroll: true });
    el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  function moveFocus(cur, dir) {
    const r = cur.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let best = null, bs = Infinity;
    for (const el of focusables()) {
      if (el === cur) continue;
      const q = el.getBoundingClientRect();
      const dx = q.left + q.width / 2 - cx, dy = q.top + q.height / 2 - cy;
      const along = dir === 'up' ? -dy : dir === 'down' ? dy : dir === 'left' ? -dx : dx;
      const perp = dir === 'up' || dir === 'down' ? Math.abs(dx) : Math.abs(dy);
      if (along <= 4) continue;
      const score = along + perp * 2.2;
      if (score < bs) { bs = score; best = el; }
    }
    if (best) { focusEl(best); SFX.play('ui', 0.4); }
  }
  // Re-focus the same slot if a click re-rendered the screen.
  function keepFocus(el, action) {
    const idx = focusables().indexOf(el);
    action();
    if (!root.contains(document.activeElement)) {
      const els = focusables();
      focusEl(els[Math.min(Math.max(0, idx), els.length - 1)]);
    }
  }
  function stepSelect(el, d) {
    keepFocus(el, () => {
      el.selectedIndex = (el.selectedIndex + d + el.options.length) % el.options.length;
      el.dispatchEvent(new Event('change', { bubbles: true }));
    });
  }
  function padEvent(ev) {
    document.body.classList.add('pad-nav');
    const cur = document.activeElement;
    const has = root.contains(cur) && focusables().includes(cur);
    if (ev === 'back') { if (backFn) { SFX.play('uiBack', 0.8); backFn(); } return; }
    if (ev === 'prevTab' || ev === 'nextTab') {
      const tabs = [...root.querySelectorAll('.tabs button')];
      const i = tabs.findIndex((t) => t.classList.contains('on'));
      if (tabs.length) tabs[(i + (ev === 'nextTab' ? 1 : -1) + tabs.length) % tabs.length].click();
      return;
    }
    if (!has) { focusEl(preferred()); return; }
    if (ev === 'accept' || ev === 'start') {
      if (cur.tagName === 'SELECT') stepSelect(cur, 1);
      else if (cur.tagName === 'INPUT' && cur.type === 'text') return;
      else keepFocus(cur, () => cur.click());
      return;
    }
    if ((ev === 'left' || ev === 'right') && cur.tagName === 'INPUT' && cur.type === 'range') {
      const step = parseFloat(cur.step) || 0.1;
      cur.value = U.clamp(parseFloat(cur.value) + (ev === 'left' ? -step : step), parseFloat(cur.min), parseFloat(cur.max));
      cur.dispatchEvent(new Event('input', { bubbles: true }));
      return;
    }
    if ((ev === 'left' || ev === 'right') && cur.tagName === 'SELECT') { stepSelect(cur, ev === 'left' ? -1 : 1); return; }
    moveFocus(cur, ev);
  }

  let toastEl = null, toastT = null;
  function toast(text) {
    if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; document.body.appendChild(toastEl); }
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  function btn(text, fn, cls = '') {
    return h('button', {
      class: 'btn ' + cls, text,
      onmouseenter: () => SFX.play('ui', 0.5),
      onclick: (e) => { SFX.init(); SFX.play(cls.includes('back') ? 'uiBack' : 'uiOk', 0.8); fn(e); },
    });
  }

  function seg(options, value, onPick) {
    const wrap = h('div', { class: 'seg' });
    for (const [v, label] of options) {
      wrap.appendChild(h('button', {
        class: v === value ? 'on' : '', text: label,
        onclick: () => { SFX.play('ui', 0.6); onPick(v); },
      }));
    }
    return wrap;
  }

  function portraitCanvas(look, scale = 2) {
    const src = Sprites.portrait(look, scale);
    const c = U.makeCanvas(src.width, src.height);
    c.className = 'px';
    c.getContext('2d').drawImage(src, 0, 0);
    return c;
  }

  function randomPortrait() {
    const c = U.makeCanvas(24, 22);
    c.className = 'px';
    const x = c.getContext('2d');
    x.fillStyle = '#241a34'; x.fillRect(2, 1, 20, 20);
    Font.draw(x, '?', 12, 7, '#ffd35c', { align: 'center', outline: '#120a18' });
    return c;
  }

  function iconImg(canvas, size = 48) { return h('img', { class: 'px', src: canvas.toDataURL(), width: size, height: size, alt: '' }); }

  function elTag(el) {
    const E = ELEMENTS[el] || ELEMENTS.shinobi;
    return h('span', { class: 'tag', style: `background:${E.color}`, text: E.short });
  }

  // =================================================================== TITLE
  function title() {
    backFn = null;
    screen('clear',
      h('div', { class: 'logo' }, h('span', { class: 'l1', text: 'CLASH' }), h('span', { class: 'l2', text: 'OF' }), h('span', { class: 'l3', text: 'HEAVEN' })),
      h('div', { class: 'tagline', text: 'SHINOBI ARENA  -  UP TO 10 FIGHTERS' }),
      h('div', { class: 'menu' },
        btn('Quick Battle', () => Game.quickBattle(), 'primary'),
        btn('Custom Battle', () => setup()),
        btn('Training Dojo', () => Game.training()),
        btn('Create Shinobi', () => creator(null, title)),
        btn('Roster', () => roster()),
        btn('How to Play', () => howto(title)),
        btn('Settings', () => settings(title)),
      ),
      h('div', { class: 'footer', text: 'Keyboard + mouse, or a controller (PS5 / Xbox: press any button to connect)  -  M to mute' }),
    );
  }

  // =================================================================== SETUP
  const SETUP_KEY = 'coh_setup_v1';
  function defaultSetup() {
    return { mode: 'ffa', teamCount: 2, count: 6, winType: 'kills', killLimit: 10, stock: 3, timeLimit: 300, map: 'random', diff: 'normal', player: PRESETS[7].id, spectate: false, slots: [] };
  }
  function loadSetup() {
    const s = Object.assign(defaultSetup(), Store.get(SETUP_KEY, {}));
    if (!Roster.byId(s.player)) s.player = Roster.all()[0].id;
    fixSlots(s);
    return s;
  }
  function fixSlots(s) {
    s.slots = s.slots || [];
    while (s.slots.length < s.count) { const i = s.slots.length; s.slots.push({ char: i === 0 ? s.player : 'random', team: i % s.teamCount, diff: s.diff }); }
    s.slots.length = s.count;
    s.slots[0].char = s.player;
    for (const sl of s.slots) { if (sl.team >= s.teamCount) sl.team = sl.team % s.teamCount; if (sl.char !== 'random' && !Roster.byId(sl.char)) sl.char = 'random'; }
  }

  function setup() {
    backFn = title;
    const s = loadSetup();
    const save = () => Store.set(SETUP_KEY, s);
    const rerender = () => { save(); setup(); };
    const all = Roster.all();

    const rules = h('div', { class: 'panel' },
      h('h3', { text: 'MODE' }),
      seg([['ffa', 'Free For All'], ['teams', 'Teams']], s.mode, (v) => { s.mode = v; rerender(); }),
      s.mode === 'teams' ? h('div', null, h('h3', { text: 'TEAMS' }), seg([[2, '2 Teams'], [3, '3'], [4, '4'], [5, '5']], s.teamCount, (v) => { s.teamCount = v; s.slots.forEach((sl, i) => { sl.team = i % v; }); rerender(); })) : null,
      h('h3', { text: 'FIGHTERS' }),
      seg([2, 3, 4, 5, 6, 7, 8, 9, 10].map((n) => [n, String(n)]), s.count, (v) => { s.count = v; fixSlots(s); rerender(); }),
      h('h3', { text: 'VICTORY' }),
      seg([['kills', 'KO Race'], ['stock', 'Survival']], s.winType, (v) => { s.winType = v; rerender(); }),
      h('div', { style: 'margin-top:8px' }, s.winType === 'kills'
        ? seg([[5, '5 KO'], [10, '10 KO'], [15, '15 KO'], [25, '25 KO']], s.killLimit, (v) => { s.killLimit = v; rerender(); })
        : seg([[1, '1 Life'], [3, '3 Lives'], [5, '5 Lives']], s.stock, (v) => { s.stock = v; rerender(); })),
      h('h3', { text: 'TIME LIMIT' }),
      seg([[180, '3 min'], [300, '5 min'], [480, '8 min'], [720, '12 min'], [0, 'None']], s.timeLimit, (v) => { s.timeLimit = v; rerender(); }),
      h('h3', { text: 'ARENA' }),
      seg([['random', 'Random'], ...Object.keys(THEMES).map((k) => [k, THEMES[k].name])], s.map, (v) => { s.map = v; rerender(); }),
      h('h3', { text: 'AI DIFFICULTY (ALL)' }),
      seg([...Object.keys(AI_DIFF).map((k) => [k, AI_DIFF[k].name]), ['mixed', 'Mixed']], s.diff, (v) => { s.diff = v; s.slots.forEach((sl) => { sl.diff = v === 'mixed' ? U.pick(Object.keys(AI_DIFF)) : v; }); rerender(); }),
    );

    const playerPick = h('div', { class: 'roster', style: 'max-height:210px;overflow-y:auto' });
    for (const c of all) {
      const card = h('div', { tabindex: '0', class: 'rcard' + (c.id === s.player ? ' on' : ''), onclick: () => { s.player = c.id; s.slots[0].char = c.id; rerender(); } },
        portraitCanvas(c.look, 1), h('div', { class: 'n', text: c.name }), h('div', { class: 'el', style: `color:${(ELEMENTS[c.affinity] || ELEMENTS.shinobi).color}`, text: (ELEMENTS[c.affinity] || ELEMENTS.shinobi).name }));
      if (!c.id.startsWith('p_')) card.appendChild(h('div', { class: 'badge', text: 'CUSTOM' }));
      playerPick.appendChild(card);
    }

    const list = h('div', { class: 'slotlist' });
    s.slots.forEach((sl, i) => {
      const isPlayer = i === 0 && !s.spectate;
      const ch = sl.char === 'random' ? null : Roster.byId(sl.char);
      const sel = h('select', { onchange: (e) => { sl.char = e.target.value; if (i === 0) s.player = sl.char === 'random' ? s.player : sl.char; rerender(); } },
        !isPlayer ? h('option', { value: 'random', text: 'Random' }) : null,
        ...all.map((c) => h('option', { value: c.id, text: c.name })));
      sel.value = sl.char;
      const teamSel = s.mode === 'teams' ? h('select', { onchange: (e) => { sl.team = +e.target.value; save(); } }, ...Array.from({ length: s.teamCount }, (_, t) => h('option', { value: t, text: TEAM_NAMES[t] }))) : h('span');
      if (s.mode === 'teams') { teamSel.value = sl.team; teamSel.style.color = TEAM_COLORS[sl.team]; }
      const diffSel = isPlayer ? h('span', { class: 'you', text: 'YOU' }) : h('select', { onchange: (e) => { sl.diff = e.target.value; save(); } }, ...Object.keys(AI_DIFF).map((k) => h('option', { value: k, text: AI_DIFF[k].name })));
      if (!isPlayer) diffSel.value = sl.diff in AI_DIFF ? sl.diff : 'normal';
      list.appendChild(h('div', { class: 'srow' }, ch ? portraitCanvas(ch.look, 1) : randomPortrait(), sel, teamSel, diffSel));
    });

    const fighters = h('div', { class: 'panel' },
      h('h3', { text: 'YOUR SHINOBI' }),
      playerPick,
      h('div', { class: 'row', style: 'margin:10px 0' },
        h('label', { class: 'row', style: 'gap:6px;cursor:pointer' }, h('input', { type: 'checkbox', checked: s.spectate, onchange: (e) => { s.spectate = e.target.checked; rerender(); } }), 'Spectate only (all AI)'),
        h('span', { class: 'grow' }),
        btn('Create New', () => creator(null, setup), 'small')),
      h('h3', { text: 'ROSTER' }),
      list,
    );

    screen('dim',
      h('div', { class: 'topbar' }, btn('Back', title, 'small back'), h('h2', { text: 'CUSTOM BATTLE' }), btn('Start Battle', () => { save(); Game.startFromSetup(s); }, 'primary')),
      h('div', { class: 'wrap cols setup' }, rules, fighters),
    );
  }

  // Turn a setup into a World config.
  function buildConfig(s) {
    const all = Roster.all();
    const used = new Set();
    const map = s.map === 'random' ? U.pick(Object.keys(THEMES)) : s.map;
    const entries = s.slots.map((sl, i) => {
      let c = sl.char === 'random' ? null : Roster.byId(sl.char);
      if (!c) {
        const pool = all.filter((x) => !used.has(x.id));
        c = U.pick(pool.length ? pool : all);
      }
      used.add(c.id);
      const isPlayer = i === 0 && !s.spectate;
      return { char: U.deepCopy(c), team: s.mode === 'teams' ? sl.team : i, isPlayer, diff: sl.diff === 'mixed' || !AI_DIFF[sl.diff] ? U.pick(Object.keys(AI_DIFF)) : sl.diff };
    });
    return { map, mode: s.mode, teamCount: s.teamCount, winType: s.winType, killLimit: s.killLimit, stock: s.stock, timeLimit: s.timeLimit, entries, seed: (Math.random() * 1e9) | 0 };
  }

  // ================================================================= CREATOR
  function creator(existing, back) {
    backFn = () => (back || title)();
    const isNew = !existing || existing.id.startsWith('p_');
    const ch = existing ? U.deepCopy(existing) : Roster.randomCharacter('New Shinobi');
    if (!existing || existing.id.startsWith('p_')) { ch.id = Roster.newId(); if (existing) ch.name = existing.name + ' II'; }
    let tab = 'look', selSlot = 0, filter = 'all';
    let view = 'F', flip = false, poseIdx = 0, facingIdx = 0;
    const POSE_CYCLE = [['idle', 2], ['run', 8], ['jump', 1], ['airkick', 3], ['lunge', 3], ['spin', 2], ['jab', 3], ['cross', 3], ['kick', 3], ['uppercut', 3], ['seal', 2], ['release', 1], ['block', 1], ['charge', 2], ['raise', 1], ['victory', 1]];

    const prev = U.makeCanvas(SPR_W * 5, SPR_H * 5);
    prev.className = 'px';
    const pctx = prev.getContext('2d');
    const statsBox = h('div', { style: 'width:100%' });
    const body = h('div');
    const nameInput = h('input', { type: 'text', value: ch.name, maxlength: 20, oninput: (e) => { ch.name = e.target.value; renderStats(); } });

    function renderStats() {
      statsBox.innerHTML = '';
      const E = ELEMENTS[ch.affinity] || ELEMENTS.shinobi;
      const add = (k, v, col) => statsBox.appendChild(h('div', { class: 'stat' }, h('span', { text: k }), h('b', { text: v, style: col ? `color:${col}` : '' })));
      add('Name', ch.name || '-');
      add('Affinity', E.name, E.color);
      ch.jutsu.forEach((id, i) => add('Jutsu ' + ['Q', 'E', 'R', 'F'][i], JUTSU[id] ? JUTSU[id].name : '-', JUTSU[id] ? ELEMENTS[JUTSU[id].element].color : ''));
      add('Awakening', AWAKENINGS[ch.awakening].name, AWAKENINGS[ch.awakening].colors[1]);
      add('Ultimate', ULTIMATES[ch.ultimate].name, ELEMENTS[ULTIMATES[ch.ultimate].element].color);
    }

    let t0 = performance.now();
    function anim() {
      const t = (performance.now() - t0) / 1000;
      const [pose, n] = POSE_CYCLE[poseIdx % POSE_CYCLE.length];
      const frame = Math.floor(t * (pose === 'run' ? 12 : 3)) % n;
      pctx.clearRect(0, 0, prev.width, prev.height);
      const spr = Sprites.get(ch.look, pose, frame, view);
      pctx.save();
      if (flip) { pctx.translate(prev.width, 0); pctx.scale(-1, 1); }
      pctx.fillStyle = 'rgba(0,0,0,0.3)';
      pctx.fillRect(SPR_OX * 5 - 30, (SPR_OY - 1) * 5, 60, 8);
      pctx.drawImage(spr, 0, 0, SPR_W * 5, SPR_H * 5);
      pctx.restore();
      rafs.push(requestAnimationFrame(anim));
    }

    function lookTab() {

  // ================================================================= RESULTS
  function results(w) {
    backFn = () => Game.toMenu();
    const rows = w.fighters.filter((f) => !f.isClone);
    const score = (f) => f.kills * 3 + f.assists + f.dmgDealt / 250;
    const mvp = rows.slice().sort((a, b) => score(b) - score(a))[0];
    rows.sort((a, b) => (b.team === w.winner) - (a.team === w.winner) || b.kills - a.kills || b.dmgDealt - a.dmgDealt);
    const p = w.player;
    let head, col;
    if (w.winner === null) { head = 'DRAW'; col = '#c8c0d8'; }
    else if (p) { const won = p.team === w.winner; head = won ? 'VICTORY' : 'DEFEAT'; col = won ? '#ffd35c' : '#ff6a6a'; }
    else { head = w.teamLabel(w.winner).toUpperCase() + ' WINS'; col = '#ffd35c'; }
    const table = h('table', { class: 'res' },
      h('tr', null, ...['', 'SHINOBI', 'LV', 'KO', 'DOWN', 'ASSIST', 'DAMAGE', 'BEST COMBO'].map((t) => h('th', { text: t }))),
      ...rows.map((f) => h('tr', { class: f === p ? 'me' : '' },
        h('td', null, portraitCanvas(f.look, 1)),
        h('td', null, h('span', { style: `color:${f.teamColor}`, text: f.name }), f === mvp ? h('span', { class: 'mvp', text: 'MVP' }) : null, f.team === w.winner ? h('span', { class: 'note', text: '  winner' }) : null),
        ...[f.level, f.kills, f.deaths, f.assists, Math.round(f.dmgDealt), f.bestCombo || 0].map((v) => h('td', { text: String(v) })))));
    let mastery = null;
    if (p) {
      const ms = Object.entries(p.mastery).map(([id, m]) => `${id === 'taijutsu' ? 'Taijutsu' : (JUTSU[id] || ULTIMATES[id]).name} Lv${m.lvl}`).join('  -  ');
      mastery = h('p', { class: 'note', style: 'margin-top:12px', text: 'Your mastery this match: ' + ms });
    }
    screen('dim',
      h('div', { class: 'bigresult', style: `color:${col}`, text: head }),
      h('div', { class: 'wrap panel', style: 'max-width:860px' }, table, mastery),
      h('div', { class: 'row center', style: 'margin-top:16px' },

      h('div', { class: 'pausebox', style: 'width:min(560px,90vw)' },
        h('div', { class: 'bigresult', style: 'color:#ffd35c;font-size:22px;margin:0', text: 'PREPARING ARENA' }),
        mapName ? h('div', { class: 'tagline', style: 'margin:0', text: mapName.toUpperCase() }) : null,
        h('p', { style: 'color:#efe6d4', text: 'TIP: ' + U.pick(TIPS) }),
      ),
    );
  }

  function init() {
    root = document.getElementById('ui');
    window.addEventListener('mousemove', () => document.body.classList.remove('pad-nav'));
  }
  function hide() { clear(); }

  return { init, title, setup, creator, roster, howto, settings, pause, results, hide, loading, buildConfig, loadSetup, padEvent, toast, get open() { return root && root.childElementCount > 0; } };
})();

</script>
<script>
// ---- js/main.js ----
'use strict';
// ---------------------------------------------------------------------------
// Boot + main loop (fixed 60 Hz simulation, render every animation frame).
// ---------------------------------------------------------------------------

const Game = {
  STEP: 1 / 60,
  world: null,
  screen: 'title',
  paused: false,
  acc: 0,
  last: 0,
  resultsShown: false,
  lastSetup: null,
  lastCfg: null,
  audioReady: false,
  errors: 0,

  boot() {
    Settings.load();
    const cv = document.getElementById('game');
    Input.attach(cv);
    Render.init(cv);
    UI.init();
    const unlock = () => {
      if (this.audioReady) return;
      this.audioReady = true;
      SFX.init();
      SFX.Music.start(this.screen === 'game' ? 'battle' : 'menu');
    };
    window.addEventListener('pointerdown', unlock);
    window.addEventListener('keydown', unlock);
    window.addEventListener('gamepadconnected', (e) => {
      const sony = /054c|dualsense|dualshock|wireless controller|playstation/i.test(e.gamepad.id || '');
      const name = /dualsense|0ce6|0df2/i.test(e.gamepad.id || '') ? 'PS5 CONTROLLER' : sony ? 'PLAYSTATION CONTROLLER' : 'CONTROLLER';
      UI.toast(name + ' CONNECTED');
      if (this.world && this.screen === 'game') this.world.notice(name + ' CONNECTED', '#8ff0ff');
    });
    window.addEventListener('gamepaddisconnected', () => UI.toast('CONTROLLER DISCONNECTED'));
    this.startDemo();
    UI.title();
    const boot = document.getElementById('boot');
    if (boot) boot.remove();
    requestAnimationFrame((t) => { this.last = t; this.loop(t); });
  },

  startDemo() {
    const picks = U.shuffle(Roster.all().slice()).slice(0, 6);
    this.world = new World({
      map: U.pick(Object.keys(THEMES)), demo: true, mode: 'ffa', winType: 'kills', killLimit: 999, timeLimit: 0,
      entries: picks.map((c) => ({ char: U.deepCopy(c), isPlayer: false, diff: 'hard' })),
    });
    this.screen = 'title';
    this.paused = false;
  },

  quickBattle() {
    const s = UI.loadSetup();
    const diff = s.diff in AI_DIFF ? s.diff : 'normal';
    const q = Object.assign({}, s, { mode: 'ffa', count: 6, winType: 'kills', killLimit: 10, timeLimit: 300, map: 'random', spectate: false });
    q.slots = [{ char: s.player, team: 0, diff }];
    for (let i = 1; i < 6; i++) q.slots.push({ char: 'random', team: i, diff });
    this.startFromSetup(q);
  },

  training() {
    const s = UI.loadSetup();
    const me = Roster.byId(s.player) || Roster.all()[0];
    const partners = U.shuffle(PRESETS.filter((p) => p.id !== me.id)).slice(0, 3);
    this.lastSetup = null;
    this.start({
      map: 'forest', mode: 'ffa', winType: 'kills', killLimit: 99999, timeLimit: 0, training: true, seed: (Math.random() * 1e9) | 0,
      entries: [{ char: U.deepCopy(me), isPlayer: true }, ...partners.map((c, i) => ({ char: U.deepCopy(c), isPlayer: false, diff: i === 2 ? 'easy' : 'dummy' }))],
    });
  },

  startFromSetup(s) {
    this.lastSetup = U.deepCopy(s);
    this.start(UI.buildConfig(s));
  },

  start(cfg) {
    this.lastCfg = cfg;
    // show a loading card for a frame; baking the arena takes a few hundred ms
    UI.loading(THEMES[cfg.map] ? THEMES[cfg.map].name : '');
    this.paused = true;
    setTimeout(() => this.begin(cfg), 30);
  },

  begin(cfg) {
    UI.hide();
    this.world = new World(cfg);
    this.screen = 'game';
    this.paused = false;
    this.resultsShown = false;
    this.acc = 0;
    HUD.invalidateMini();
    Input.tick();
    if (this.audioReady) SFX.Music.start('battle');
  },

  rematch() {
    if (this.lastSetup) this.startFromSetup(this.lastSetup);
    else if (this.lastCfg) this.start(Object.assign({}, this.lastCfg, { seed: (Math.random() * 1e9) | 0 }));
  },

  toMenu(silent) {
    this.startDemo();
    if (!silent) UI.title();
    if (this.audioReady) SFX.Music.start('menu');
  },

  pause() {
    if (this.screen !== 'game' || !this.world || this.world.over) return;
    this.paused = true;
    UI.pause();
  },

  resume() {
    this.paused = false;
    UI.hide();
    Input.tick();
  },

  loop(t) {
    const dt = Math.min(0.1, Math.max(0, (t - this.last) / 1000));
    this.last = t;
    try {
      this.frame(dt);
      this.errors = 0;
    } catch (e) {
      this.errors++;
      console.error(e);
      if (this.errors > 30) { this.errors = 0; this.toMenu(); }
    }
    requestAnimationFrame((tt) => this.loop(tt));
  },

  frame(dt) {
    const w = this.world;
    Input.poll();
    const menuEv = Input.menuEvents();
    const uiWasOpen = UI.open;
    if (Input.consume('mute')) { Settings.data.muted = !Settings.data.muted; Settings.save(); }
    if (this.screen === 'game') {
      if (Input.consume('pause')) { if (this.paused) this.resume(); else this.pause(); }
      if (!w.player && !this.paused) {
        if (Input.consume('left')) w.spectateNext(-1);
        if (Input.consume('right')) w.spectateNext(1);
      }
    }
    // controller navigation for the HTML menus
    if (uiWasOpen && UI.open) {
      for (const ev of menuEv) {
        if (ev === 'start' && this.screen === 'game') continue; // pause toggle handled above
        if (!this.audioReady) { this.audioReady = true; SFX.init(); SFX.Music.start(this.screen === 'game' ? 'battle' : 'menu'); }
        UI.padEvent(ev);
      }
    }
    if (!this.paused) {
      this.acc += dt;
      let n = 0;
      while (this.acc >= this.STEP && n < 5) {
        Input.tick();
        w.update(this.STEP);
        this.acc -= this.STEP;
        n++;
      }
      if (n >= 5) this.acc = 0;
    }
    Render.world(w);
    if (this.screen === 'game' && !this.resultsShown) HUD.draw(Render.ctx, w);
    if (this.screen === 'game' && w.over && w.overT > 3.2 && !this.resultsShown) {
      this.resultsShown = true;
      UI.results(w);
    }
    if (w.demo && w.demoReset) this.startDemo();
  },
};

if (document.readyState === 'complete') Game.boot();
else window.addEventListener('load', () => Game.boot());

</script>
