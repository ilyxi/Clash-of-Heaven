<script>
// ---- js/art.js ----
'use strict';
// ---------------------------------------------------------------------------
// Procedural pixel art for map props: iso cubes (walls, houses, cliffs),
// trees, rocks, crates and friends. Every sprite is generated once and cached.
// Each sprite returns { c: canvas, ox, oy } where (ox, oy) is the offset from
// the tile's top vertex on screen.
// ---------------------------------------------------------------------------

const Art = (() => {
  const cache = new Map();

  function rgb(hex) { return U.hexToRgb(hex); }

  // Pixel-exact iso cube of height H with per-face texture callbacks.
  // tex(face, u, v, x, y) -> [r,g,b] | null  (face: 'top' | 'left' | 'right')
  function cube(H, tex) {
    const w = TILE_W, h = TILE_H + H;
    const c = U.makeCanvas(w, h);
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(w, h);
    const d = img.data;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let face = null, u = 0, v = 0;
        const cx = x + 0.5, cy = y + 0.5;
        if (Math.abs(cx - 16) / 16 + Math.abs(cy - 8) / 8 <= 1) {
          face = 'top';
          u = cx / 16 + cy / 8 - 1;    // along +x axis (0..1)
          v = cy / 8 - cx / 16 + 1;    // along +y axis (0..1)
        } else if (cx < 16) {
          const e = 8 + cx / 2;
          if (cy >= e && cy <= e + H) { face = 'left'; u = x; v = cy - e; }
        } else {
          const e = 16 - (cx - 16) / 2;
          if (cy >= e && cy <= e + H) { face = 'right'; u = x - 16; v = cy - e; }
        }
        if (!face) continue;
        const col = tex(face, u, v, x, y);
        if (!col) continue;
        const i = (y * w + x) * 4;
        d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = col[3] === undefined ? 255 : col[3];
      }
    }
    ctx.putImageData(img, 0, 0);
    return { c, ox: -16, oy: -H };
  }

  function mul(c, k) { return [c[0] * k, c[1] * k, c[2] * k]; }
  function jitter(c, x, y, seed, amt) {
    const n = (U.hash2(x, y, seed) - 0.5) * amt;
    return [c[0] + n * 255, c[1] + n * 255, c[2] + n * 255];
  }

  // ---- cube textures ---------------------------------------------------------
  function stoneWall(H, seed, base = '#8e8e96') {
    const B = rgb(base);
    return cube(H, (f, u, v, x, y) => {
      if (f === 'top') {
        const edge = u < 0.08 || v < 0.08 || u > 0.92 || v > 0.92;
        return jitter(mul(B, edge ? 1.0 : 1.18), x, y, seed, 0.06);
      }
      const k = f === 'left' ? 0.92 : 0.7;
      const row = Math.floor(v / 5);
      const off = row % 2 ? 4 : 0;
      const mortar = v % 5 < 1 || ((u + off) % 8) < 1;
      return jitter(mul(B, mortar ? k * 0.72 : k), x, y, seed, 0.07);
    });
  }

  function house(H, seed, roof, wall) {
    const R = rgb(roof), W = rgb(wall);
    const win = seed % 3 !== 0;
    return cube(H, (f, u, v, x, y) => {
      if (f === 'top') {
        const stripe = Math.floor((u * 8)) % 2 === 0;
        const edge = u < 0.07 || v < 0.07 || u > 0.93 || v > 0.93;
        return jitter(mul(R, edge ? 0.7 : stripe ? 1.05 : 0.9), x, y, seed, 0.04);
      }
      const k = f === 'left' ? 1 : 0.72;
      if (v < 3) return mul(R, 0.62 * k); // eave shadow
      if (v > H - 3) return mul([90, 70, 55], k); // foundation
      if (win && f === 'right' && u > 5 && u < 11 && v > 7 && v < 14) {
        if (u < 6 || u > 9.5 || v < 8 || v > 12.5) return mul([70, 45, 30], k);
        return [40, 50, 70];
      }
      if (win && f === 'left' && seed % 4 === 1 && u > 5 && u < 11 && v > 9) {
        return (u < 6 || u > 10) ? mul([70, 45, 30], k) : mul([60, 38, 24], k); // door
      }
      const beam = u % 16 < 1 || v % 12 < 1;
      return jitter(mul(W, beam ? k * 0.75 : k), x, y, seed, 0.05);
    });
  }

  function rockCube(H, seed, base, topCol) {
    const B = rgb(base), T = topCol ? rgb(topCol) : null;
    return cube(H, (f, u, v, x, y) => {
      const n = U.fbm(x * 0.35, y * 0.35, seed, 2);
      if (f === 'top') {
        if (T) return jitter(mul(T, 0.9 + n * 0.3), x, y, seed, 0.1);
        return jitter(mul(B, 1.1 + n * 0.2), x, y, seed, 0.06);
      }
      if (T && v < 2 + U.hash2(x, 0, seed) * 2) return mul(T, f === 'left' ? 0.85 : 0.65);
      const k = f === 'left' ? 0.95 : 0.68;
      const crack = U.hash2(Math.floor(x / 3), Math.floor(y / 4), seed) > 0.86;
      return jitter(mul(B, k * (0.8 + n * 0.4) * (crack ? 0.7 : 1)), x, y, seed, 0.05);
    });
  }

  function crate(seed) {
    const W = rgb('#a8763e');
    const H = 12;
    return cube(H, (f, u, v, x, y) => {
      if (f === 'top') {
        const edge = u < 0.12 || v < 0.12 || u > 0.88 || v > 0.88;
        return mul(W, edge ? 0.75 : 1.08);
      }
      const k = f === 'left' ? 1 : 0.72;
      const frame = u < 2 || u > 14 || v < 2 || v > H - 2;
      const cross = Math.abs(u - v * 16 / H) < 1.3 || Math.abs(u - (H - v) * 16 / H) < 1.3;
      return jitter(mul(W, k * (frame || cross ? 0.7 : 1)), x, y, seed, 0.05);
    });
  }

  // ---- freeform sprites ---------------------------------------------------------
  function sprite(w, h, ax, ay, drawFn) {
    const c = U.makeCanvas(w, h);
    const ctx = c.getContext('2d');
    drawFn(ctx);
    outlineCanvas(c, '#140c16');
    // anchor (ax, ay) sits at tile centre = top vertex + (0, 8)
    return { c, ox: -ax, oy: 8 - ay };
  }

  function outlineCanvas(canvas, color) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    const [r, g, b] = U.hexToRgb(color);
    const solid = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) solid[i] = d[i * 4 + 3] > 200 ? 1 : 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (solid[i]) continue;
      if ((x > 0 && solid[i - 1]) || (x < w - 1 && solid[i + 1]) || (y > 0 && solid[i - w]) || (y < h - 1 && solid[i + w])) {
        d[i * 4] = r; d[i * 4 + 1] = g; d[i * 4 + 2] = b; d[i * 4 + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  function dither(ctx, cx, cy, r, color, seed, density) {
    ctx.fillStyle = color;
    for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
      if (x * x + y * y > r * r) continue;
      if (U.hash2(cx + x, cy + y, seed) < density) ctx.fillRect(cx + x, cy + y, 1, 1);
    }
  }

  function shadow(ctx, cx, cy, rx, ry) {
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    PX.ellipse(ctx, cx, cy, rx, ry);
  }

  function tree(seed, pal) {
    const r = U.rng(seed);
    return sprite(44, 56, 22, 50, (ctx) => {
      shadow(ctx, 22, 50, 12, 5);
      ctx.fillStyle = '#5a3a22'; ctx.fillRect(20, 34, 5, 16);
      ctx.fillStyle = '#7a5232'; ctx.fillRect(20, 34, 2, 16);
      ctx.fillStyle = '#3e2616'; ctx.fillRect(24, 34, 1, 16);
      ctx.fillStyle = '#5a3a22'; ctx.fillRect(18, 48, 2, 2); ctx.fillRect(25, 48, 2, 2);
      const blobs = [[22, 20, 12], [13, 27, 8], [31, 27, 8], [22, 29, 9], [16, 14, 7], [28, 15, 7]];
      for (const b of blobs) { ctx.fillStyle = pal[0]; PX.circle(ctx, b[0] + r.int(-1, 1), b[1] + 1, b[2]); }
      for (const b of blobs) { ctx.fillStyle = pal[1]; PX.circle(ctx, b[0] - 1, b[1] - 1, b[2] - 2); }
      for (const b of blobs) { ctx.fillStyle = pal[2]; PX.circle(ctx, b[0] - 3, b[1] - 3, Math.max(1, b[2] - 6)); }
      dither(ctx, 22, 22, 15, pal[3], seed, 0.08);
      dither(ctx, 26, 28, 12, pal[0], seed + 5, 0.12);
    });
  }

  function pine(seed, pal, snowy) {
    return sprite(36, 60, 18, 54, (ctx) => {
      shadow(ctx, 18, 54, 10, 4);
      ctx.fillStyle = '#4a2e1a'; ctx.fillRect(16, 42, 4, 12);
      ctx.fillStyle = '#6a4428'; ctx.fillRect(16, 42, 1, 12);
      const layers = [[44, 16, 10], [34, 13, 10], [24, 10, 10], [15, 7, 9]];
      for (const [by, hw, hh] of layers) {
        for (let y = 0; y < hh; y++) {
          const w = Math.round(hw * (y + 1) / hh);
          ctx.fillStyle = pal[0]; ctx.fillRect(18 - w, by - hh + y, w * 2, 1);
          ctx.fillStyle = pal[1]; ctx.fillRect(18 - w, by - hh + y, Math.max(1, w - 1), 1);
          if (y % 3 === 0) { ctx.fillStyle = pal[2]; ctx.fillRect(18 - w + 1, by - hh + y, Math.max(1, (w >> 1)), 1); }
          if (snowy && (y < 3 || (y === hh - 1 && U.hash2(by, y, seed) > 0.3))) {
            ctx.fillStyle = y < 2 ? '#f4f8ff' : '#d8e4f4';
            ctx.fillRect(18 - w, by - hh + y, w * 2 - (y === hh - 1 ? w : 0), 1);
          }
        }
      }
      ctx.fillStyle = pal[2]; ctx.fillRect(17, 5, 2, 3);
      dither(ctx, 18, 30, 14, pal[3], seed, 0.05);
    });
  }

  function palm(seed) {
    const r = U.rng(seed);
    return sprite(48, 56, 24, 50, (ctx) => {
      shadow(ctx, 24, 50, 11, 4);
      const lean = r.pick([-1, 1]);
      let x = 23, y = 50;
      for (let i = 0; i < 26; i++) {
        ctx.fillStyle = i % 3 === 0 ? '#7a5a36' : '#9a7446';
        ctx.fillRect(Math.round(x), y, 4, 1);
        y--; x += lean * (i / 40);
      }
      const tx = Math.round(x) + 2, ty = y;
      const fronds = [[-18, 6], [-12, -6], [0, -9], [12, -6], [18, 6], [-6, 9], [8, 9]];
      for (const [fx, fy] of fronds) {
        for (let t = 0; t <= 1; t += 0.05) {
          const px = tx + fx * t, py = ty + fy * t + (t * t) * 8 - (1 - t) * t * 6;
          ctx.fillStyle = '#2f7a2f'; ctx.fillRect(Math.round(px) - 1, Math.round(py), 3, 2);
          ctx.fillStyle = '#5fb04a'; ctx.fillRect(Math.round(px), Math.round(py), 1, 1);
        }
      }
      ctx.fillStyle = '#6a4a2a'; ctx.fillRect(tx - 2, ty, 4, 3);
    });
  }

  function bush(seed, pal) {
    return sprite(24, 18, 12, 14, (ctx) => {
      shadow(ctx, 12, 14, 8, 3);
      ctx.fillStyle = pal[0]; PX.circle(ctx, 8, 10, 5); PX.circle(ctx, 15, 10, 5); PX.circle(ctx, 12, 7, 5);
      ctx.fillStyle = pal[1]; PX.circle(ctx, 7, 9, 3); PX.circle(ctx, 11, 6, 3);
      dither(ctx, 12, 9, 6, pal[2], seed, 0.12);
      if (seed % 2) { ctx.fillStyle = '#ff6fa8'; ctx.fillRect(9, 7, 1, 1); ctx.fillRect(14, 9, 1, 1); ctx.fillRect(12, 11, 1, 1); }
    });
  }

  function rock(seed, base, big) {
    const r = U.rng(seed);
    const R = big ? 11 : 8;
    return sprite(32, 30, 16, 24, (ctx) => {
      const pts = [];
      const n = 9;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TAU;
        const rr = R * r.range(0.75, 1.1);
        pts.push([16 + Math.cos(a) * rr, 18 + Math.sin(a) * rr * 0.75 - (Math.sin(a) < 0 ? 3 : 0)]);
      }
      ctx.fillStyle = U.shade(base, -0.25);
      ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); ctx.fill();
      ctx.fillStyle = base;
      ctx.beginPath(); pts.forEach((p, i) => { const x = p[0] - 1.5, y = p[1] - 2; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); ctx.fill();
      ctx.fillStyle = U.shade(base, 0.25);
      PX.ellipse(ctx, 13, 13, R * 0.45, R * 0.28);
      // crack
      ctx.fillStyle = U.shade(base, -0.4);
      PX.line(ctx, 16, 12, 18, 17); PX.line(ctx, 18, 17, 17, 20);
      // pixelize (remove antialiased edges), then tuck the shadow underneath
      const img = ctx.getImageData(0, 0, 32, 30);
      for (let i = 3; i < img.data.length; i += 4) img.data[i] = img.data[i] >= 128 ? 255 : 0;
      ctx.putImageData(img, 0, 0);
      ctx.globalCompositeOperation = 'destination-over';
      shadow(ctx, 16, 24, R + 2, 4);
      ctx.globalCompositeOperation = 'source-over';
    });
  }

  function barrel(seed) {
    return sprite(20, 24, 10, 20, (ctx) => {
      shadow(ctx, 10, 20, 6, 2);
      ctx.fillStyle = '#8a5a2c'; ctx.fillRect(5, 6, 10, 14);
      ctx.fillStyle = '#a8763e'; ctx.fillRect(5, 6, 4, 14);
      ctx.fillStyle = '#5a3a1c'; ctx.fillRect(13, 6, 2, 14);
      ctx.fillStyle = '#50505a'; ctx.fillRect(5, 8, 10, 1); ctx.fillRect(5, 17, 10, 1);
      ctx.fillStyle = '#6a4424'; PX.ellipse(ctx, 10, 6, 5, 2);
      ctx.fillStyle = '#4a2e18'; PX.ellipse(ctx, 10, 6, 3, 1);
    });
  }

  function fence(seed, dir) {
    return sprite(34, 22, 17, 16, (ctx) => {
      ctx.fillStyle = '#8a6036';
      const dx = dir ? 1 : -1;
      for (let i = -1; i <= 1; i++) {
        const x = 17 + i * 8 * dx, y = 16 + i * 4;
        ctx.fillStyle = '#6a4424'; ctx.fillRect(x - 1, y - 11, 3, 11);
        ctx.fillStyle = '#9a7040'; ctx.fillRect(x - 1, y - 11, 1, 11);
      }
      ctx.fillStyle = '#a07848';
      PX.line(ctx, 17 - 10 * dx, 16 - 5 - 8, 17 + 10 * dx, 16 + 5 - 8, 2);
      PX.line(ctx, 17 - 10 * dx, 16 - 5 - 4, 17 + 10 * dx, 16 + 5 - 4, 2);
    });
  }

  function lantern() {
    return sprite(16, 30, 8, 26, (ctx) => {
      shadow(ctx, 8, 26, 5, 2);
      ctx.fillStyle = '#7a7a82'; ctx.fillRect(6, 14, 4, 12);
      ctx.fillStyle = '#9a9aa2'; ctx.fillRect(6, 14, 1, 12);
      ctx.fillStyle = '#8a8a92'; ctx.fillRect(3, 24, 10, 3); ctx.fillRect(3, 11, 10, 3);
      ctx.fillStyle = '#ffd36a'; ctx.fillRect(5, 6, 6, 5);
      ctx.fillStyle = '#fff2b0'; ctx.fillRect(6, 7, 2, 3);
      ctx.fillStyle = '#6a6a72'; ctx.fillRect(2, 4, 12, 2); ctx.fillRect(5, 2, 6, 2);
    });
  }

  function pillar(base, H) {
    return sprite(22, H + 14, 11, H + 10, (ctx) => {
      shadow(ctx, 11, H + 10, 8, 3);
      const B = base;
      ctx.fillStyle = U.shade(B, -0.1); ctx.fillRect(3, H + 3, 16, 6);
      ctx.fillStyle = B; ctx.fillRect(5, 6, 12, H);
      ctx.fillStyle = U.shade(B, 0.2); ctx.fillRect(5, 6, 3, H);
      ctx.fillStyle = U.shade(B, -0.3); ctx.fillRect(15, 6, 2, H);
      ctx.fillStyle = U.shade(B, -0.15);
      for (let y = 10; y < H + 4; y += 6) ctx.fillRect(9, y, 1, 4);
      ctx.fillStyle = U.shade(B, 0.1); ctx.fillRect(2, 2, 18, 5);
      ctx.fillStyle = U.shade(B, 0.3); ctx.fillRect(2, 2, 18, 1);
    });
  }

  function statue(seed) {
    // A huge carved warrior statue occupying one tile (placed in groups).
    return sprite(40, 92, 20, 86, (ctx) => {
      shadow(ctx, 20, 86, 14, 5);
      const S = '#8a8478', L = '#aaa496', D = '#5e584e';
      ctx.fillStyle = D; ctx.fillRect(6, 74, 28, 12);
      ctx.fillStyle = S; ctx.fillRect(6, 74, 26, 10);
      ctx.fillStyle = S; ctx.fillRect(12, 40, 16, 34);         // body
      ctx.fillStyle = L; ctx.fillRect(12, 40, 5, 34);
      ctx.fillStyle = D; ctx.fillRect(26, 40, 2, 34);
      ctx.fillStyle = S; ctx.fillRect(13, 22, 14, 18);          // head
      ctx.fillStyle = L; ctx.fillRect(13, 22, 4, 18);
      ctx.fillStyle = D; ctx.fillRect(17, 30, 2, 2); ctx.fillRect(22, 30, 2, 2);
      ctx.fillStyle = D; for (let i = 0; i < 6; i++) ctx.fillRect(11 + i * 3, 14 + (i % 2) * 3, 3, 9 - (i % 2) * 3); // spiky hair
      ctx.fillStyle = S; ctx.fillRect(4, 42, 8, 6); ctx.fillRect(28, 42, 8, 6);  // shoulders
      ctx.fillStyle = S; ctx.fillRect(28, 26, 6, 18);           // raised arm
      ctx.fillStyle = L; ctx.fillRect(28, 20, 6, 7);            // hand seal
      ctx.fillStyle = D; ctx.fillRect(15, 56, 10, 2);
      dither(ctx, 20, 55, 18, D, seed, 0.06);
    });
  }

  function cactus(seed) {
    return sprite(22, 30, 11, 26, (ctx) => {
      shadow(ctx, 11, 26, 6, 2);
      ctx.fillStyle = '#3f8a3a'; ctx.fillRect(9, 6, 5, 20);
      ctx.fillStyle = '#6ab04a'; ctx.fillRect(9, 6, 2, 20);
      ctx.fillStyle = '#3f8a3a'; ctx.fillRect(4, 12, 3, 8); ctx.fillRect(4, 18, 6, 3);
      ctx.fillRect(15, 9, 3, 7); ctx.fillRect(13, 14, 5, 3);
      ctx.fillStyle = '#6ab04a'; ctx.fillRect(4, 12, 1, 8); ctx.fillRect(15, 9, 1, 7);
      if (seed % 2) { ctx.fillStyle = '#ff5f8a'; ctx.fillRect(10, 4, 3, 2); }
    });
  }

  function trainingLog() {
    return sprite(16, 26, 8, 22, (ctx) => {
      shadow(ctx, 8, 22, 5, 2);
      ctx.fillStyle = '#8a5a2c'; ctx.fillRect(4, 4, 8, 18);
      ctx.fillStyle = '#a8763e'; ctx.fillRect(4, 4, 3, 18);
      ctx.fillStyle = '#5a3a1c'; ctx.fillRect(11, 4, 1, 18);
      ctx.fillStyle = '#c89a5e'; PX.ellipse(ctx, 8, 4, 4, 1);
      ctx.fillStyle = '#e8e4da'; ctx.fillRect(4, 10, 8, 2); ctx.fillRect(4, 15, 8, 1);
    });
  }

  function iceSpike(seed) {
    return sprite(20, 30, 10, 26, (ctx) => {
      ctx.fillStyle = '#8fd0ff';
      for (let y = 0; y < 22; y++) { const w = Math.round((y / 22) * 6); ctx.fillRect(10 - w, 4 + y, w * 2 + 1, 1); }
      ctx.fillStyle = '#e8f8ff';
      for (let y = 4; y < 22; y++) ctx.fillRect(9, 4 + y, 1, 1);
    });
  }

  // Public: get sprite for a block.
  function get(type, variant, theme) {
    const key = type + ':' + variant + ':' + (theme || '');
    let s = cache.get(key);
    if (s) return s;
    const v = variant | 0;
    const leafPal = theme === 'valley'
      ? [['#4a6a2a', '#6a8a36', '#9ab04a', '#c8d070'], ['#6a5a2a', '#8a7a36', '#b0a04a', '#e0c070']][v % 2]
      : [['#2f6a2a', '#3f8a36', '#62b04a', '#a8e070'], ['#285a36', '#357a44', '#4f9e56', '#8fd08a'], ['#3a6a1f', '#4f8a2a', '#7ab03f', '#c8e070']][v % 3];
    switch (type) {
      case 'tree': s = tree(v * 7 + 3, leafPal); break;
      case 'pine': s = pine(v * 5 + 1, ['#1f4a2f', '#2f6a3f', '#4f8a4f', '#8fc08a'], theme === 'snow'); break;
      case 'palm': s = palm(v * 3 + 11); break;
      case 'bush': s = bush(v, leafPal); break;
      case 'rock': s = rock(v * 13 + 7, theme === 'desert' ? '#c8a070' : theme === 'valley' ? '#8a7a6a' : '#8a8a90', false); break;
      case 'boulder': s = rock(v * 17 + 5, theme === 'desert' ? '#b89060' : theme === 'valley' ? '#7a6a5a' : '#7a7a82', true); break;
      case 'crate': s = crate(v); break;
      case 'barrel': s = barrel(v); break;
      case 'fence': s = fence(v, v % 2); break;
      case 'lantern': s = lantern(); break;
      case 'log': s = trainingLog(); break;
      case 'pillar': s = pillar(theme === 'desert' ? '#d0a870' : '#a09a90', 30); break;
      case 'statue': s = statue(v); break;
      case 'cactus': s = cactus(v); break;
      case 'ice': s = iceSpike(v); break;
      case 'wall': s = stoneWall(22, v, theme === 'desert' ? '#c8a070' : '#8e8e96'); break;
      case 'ruin': s = stoneWall(14 + (v % 3) * 6, v, '#c8a070'); break;
      case 'house': {
        const roofs = ['#b8483a', '#3a6ab8', '#4a8a4a', '#c07a2a', '#8a4ab0'];
        const walls = ['#e8d8b8', '#d8c8a8', '#f0e0c8'];
        s = house(26, v, roofs[Math.floor(v / 7) % roofs.length], walls[v % 3]);
        break;
      }
      case 'cliff': {
        const top = theme === 'desert' ? '#d8b070' : theme === 'valley' ? '#7a8a4a' : theme === 'snow' ? '#e4ecf6' : '#4f8a36';
        const base = theme === 'desert' ? '#a87a4a' : theme === 'valley' ? '#7a6a5e' : theme === 'snow' ? '#6e7686' : '#6e6a64';
        s = rockCube(40 + (v % 4) * 6, v, base, top);
        break;
      }
      case 'earthwall': s = rockCube(22, v, '#9a6a3a', '#b8864a'); break;
      case 'stonepile': s = rockCube(10, v, '#8a8a90'); break;
      default: s = crate(v);
    }
    s = { c: epx2(s.c), ox: s.ox, oy: s.oy };
    cache.set(key, s);
    return s;
  }

  // Cracked overlay reused for damaged blocks.
  function crackOverlay(ctx, x, y, w, h, seed, amount) {
    ctx.fillStyle = 'rgba(20,10,10,0.55)';
    const n = Math.floor(amount * 6) + 1;
    const r = U.rng(seed);
    for (let i = 0; i < n; i++) {
      let px = x + r.range(w * 0.2, w * 0.8), py = y + r.range(h * 0.2, h * 0.8);
      for (let k = 0; k < 5; k++) {
        const nx = px + r.range(-3, 3), ny = py + r.range(1, 3);
        PX.line(ctx, px, py, nx, ny);
        px = nx; py = ny;
      }
    }
  }

  return { get, crackOverlay, outlineCanvas };
})();

</script>
<script>
// ---- js/fx.js ----
'use strict';
// ---------------------------------------------------------------------------
// Particles, floating text and short-lived custom visual effects.
// World coords (x, y in tiles; z in pixels). Layer 0 = on the ground (drawn
// under fighters), layer 1 = in the air (drawn over the scene).
// ---------------------------------------------------------------------------

// Draw a character-sized sprite so its feet anchor lands on (sx, sy).
function blitSprite(ctx, canvas, sx, sy, flip) {
  sx = Math.round(sx); sy = Math.round(sy);
  const w = canvas.lw || canvas.width, h = canvas.lh || canvas.height;
  if (!flip) { ctx.drawImage(canvas, sx - SPR_OX, sy - SPR_OY, w, h); return; }
  ctx.save();
  ctx.translate(sx, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(canvas, -SPR_OX, sy - SPR_OY, w, h);
  ctx.restore();
}

const FX = (() => {
  const MAX = 2600;
  let parts = [];
  let texts = [];
  let customs = [];
  let enabled = true;

  function add(p) {
    if (!enabled) return null;
    if (parts.length >= MAX) parts.splice(0, 200);
    p.t = 0;
    p.vx = p.vx || 0; p.vy = p.vy || 0; p.vz = p.vz || 0; p.z = p.z || 0;
    p.g = p.g === undefined ? 0 : p.g;
    p.drag = p.drag || 0;
    p.size = p.size || 1;
    p.layer = p.layer === undefined ? 1 : p.layer;
    parts.push(p);
    return p;
  }

  function update(dt) {
    let w = 0;
    for (let n = 0; n < parts.length; n++) {
      const p = parts[n];
      p.t += dt;
      if (p.t >= p.life) continue;
      if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; p.vz *= k; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vz -= p.g * dt; p.z += p.vz * dt;
      if (p.z < 0 && p.g > 0) {
        p.z = 0;
        if (p.bounce) { p.vz = -p.vz * p.bounce; p.vx *= 0.6; p.vy *= 0.6; if (Math.abs(p.vz) < 20) p.bounce = 0; }
        else { p.vz = 0; p.vx *= 0.5; p.vy *= 0.5; }
      }
      if (p.grow) p.size += p.grow * dt;
      parts[w++] = p;
    }
    parts.length = w;
    let tw = 0;
    for (const t of texts) {
      t.t += dt;
      if (t.t < t.life) { t.z += t.vz * dt; t.vz *= Math.exp(-3 * dt); texts[tw++] = t; }
    }
    texts.length = tw;
    let cw = 0;
    for (const c of customs) {
      c.t += dt;
      if (c.update) c.update(dt);
      if (c.t < c.life) customs[cw++] = c;
    }
    customs.length = cw;
  }

  function colorAt(p) {
    if (typeof p.color === 'string') return p.color;
    const k = Math.min(p.color.length - 1, Math.floor((p.t / p.life) * p.color.length));
    return p.color[k];
  }

  function draw(ctx, cam, layer) {
    // custom effects first (under particles)
    for (const c of customs) if ((c.layer || 0) === layer && c.draw) c.draw(ctx, cam, c.t / c.life, c);
    let additive = false;
    for (let pass = 0; pass < 2; pass++) {
      for (const p of parts) {
        if (p.layer !== layer) continue;
        if (!!p.add !== (pass === 1)) continue;
        if (pass === 1 && !additive) { ctx.globalCompositeOperation = 'lighter'; additive = true; }
        const sx = Math.round((p.x - p.y) * HALF_W - cam.x);
        const sy = Math.round((p.x + p.y) * HALF_H - p.z - cam.y);
        if (sx < -40 || sy < -40 || sx > cam.w + 40 || sy > cam.h + 40) continue;
        const k = p.t / p.life;
        const alpha = p.fade === false ? 1 : k > 0.6 ? 1 - (k - 0.6) / 0.4 : 1;
        ctx.globalAlpha = alpha * (p.alpha || 1);
        ctx.fillStyle = colorAt(p);
        const s = Math.max(1, Math.round(p.size));
        switch (p.kind) {
          case 'smoke':
          case 'glow':
            PX.circle(ctx, sx, sy, s);
            break;
          case 'spark': {
            const len = p.len || 3;
            const vx = (p.vx - p.vy) * HALF_W, vy = (p.vx + p.vy) * HALF_H - p.vz;
            const l = Math.hypot(vx, vy) || 1;
            PX.line(ctx, sx, sy, sx - (vx / l) * len, sy - (vy / l) * len, s);
            break;
          }
          case 'ring': {
            const r = p.size;
            PX.ellipseRing(ctx, sx, sy, r * ISO_RX, r * ISO_RY, p.thick || 1);
            break;
          }
          default:
            ctx.fillRect(sx - (s >> 1), sy - (s >> 1), s, s);
        }
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // Floating numbers are drawn in canvas pixels (HIRES finer than the world).
  function drawTexts(ctx, cam) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    for (const t of texts) {
      const sx = ((t.x - t.y) * HALF_W - cam.x) * HIRES;
      const sy = ((t.x + t.y) * HALF_H - t.z - cam.y) * HIRES;
      const k = t.t / t.life;
      if (k > 0.75) ctx.globalAlpha = 1 - (k - 0.75) / 0.25;
      const pop = t.t < 0.1 ? 1 + (0.1 - t.t) * 8 : 1;
      Font.draw(ctx, t.s, Math.round(sx), Math.round(sy), t.color, { align: 'center', outline: '#120a18', scale: Math.max(1, Math.round((t.scale || 1) * pop * 1.34)) });
      ctx.globalAlpha = 1;
    }
    ctx.setTransform(HIRES, 0, 0, HIRES, 0, 0);
  }

  // ---- presets ------------------------------------------------------------------
  const R = U.rand;
  function burst(x, y, z, n, o) {
    for (let i = 0; i < n; i++) {
      const a = R(0, TAU), sp = R(o.min || 1, o.max || 4);
      add({
        x, y, z: z + R(-2, 2), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: R(o.vzMin || 20, o.vzMax || 120),
        g: o.g === undefined ? 300 : o.g, drag: o.drag || 2, life: R(o.lifeMin || 0.25, o.lifeMax || 0.6),
        color: Array.isArray(o.colors) && typeof o.colors[0] !== 'string' ? o.colors : U.pick(o.colors), size: o.size || 1, kind: o.kind, add: o.add, bounce: o.bounce,
        len: o.len,
      });
    }
  }

  const ELEM_COLORS = {
    fire: ['#fff6b0', '#ffd35c', '#ff8a1f', '#e0401a'],
    water: ['#e8f6ff', '#9ad4ff', '#3fa0ff', '#1f6ad0'],
    earth: ['#ecc98f', '#c08a4a', '#8a5a2c', '#5e3b1a'],
    wind: ['#ffffff', '#d8fff0', '#9af0c8', '#5fd0a0'],
    lightning: ['#ffffff', '#e0f0ff', '#8fc8ff', '#5f7aff'],
    shinobi: ['#ffffff', '#e8dcff', '#b89aff', '#7a5ad0'],
    phys: ['#ffffff', '#fff2c0', '#ffd080'],
  };

  const api = {
    add, update, draw, drawTexts, ELEM_COLORS,
    clear() { parts = []; texts = []; customs = []; },
    get count() { return parts.length; },
    set enabled(v) { enabled = v; },

    custom(o) { o.t = 0; o.life = o.life || 0.5; customs.push(o); return o; },

    text(x, y, z, s, color = '#fff', o = {}) {
      texts.push({ x: x + R(-0.15, 0.15), y: y + R(-0.15, 0.15), z, s, color, t: 0, life: o.life || 0.9, vz: o.vz || 50, scale: o.scale || 1 });
      if (texts.length > 80) texts.shift();
    },

    hit(x, y, z, element, power = 1) {
      const cols = ELEM_COLORS[element] || ELEM_COLORS.phys;
      burst(x, y, z, Math.round(5 + power * 5), { colors: cols, kind: 'spark', min: 2, max: 6 + power * 2, g: 100, drag: 5, lifeMin: 0.12, lifeMax: 0.3, add: true, len: 3 + power * 2 });
      add({ x, y, z, life: 0.1, color: '#ffffff', size: 3 + power * 2, kind: 'glow', add: true, alpha: 0.8 });
    },
    spark(x, y, z, colors, n = 6, speed = 4) {
      burst(x, y, z, n, { colors, kind: 'spark', min: speed * 0.4, max: speed, g: 120, drag: 4, lifeMin: 0.1, lifeMax: 0.3, add: true });
    },
    debris(x, y, z, colors, n = 8, power = 1) {
      burst(x, y, z, Math.round(n), { colors, min: 0.5 * power, max: 3 * power, vzMin: 60, vzMax: 200 * power, g: 520, drag: 0.8, lifeMin: 0.6, lifeMax: 1.2, size: 2, bounce: 0.35 });
    },
    dust(x, y, n = 6, color) {
      for (let i = 0; i < n; i++) {
        const a = R(0, TAU), sp = R(0.3, 1.5);
        add({ x: x + R(-0.2, 0.2), y: y + R(-0.2, 0.2), z: R(0, 4), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: R(5, 25), drag: 3, life: R(0.4, 0.8), color: color || U.pick(['#c8b89a', '#a8987a', '#d8ccb4']), size: R(1.5, 3), grow: 3, kind: 'smoke', alpha: 0.7 });
      }
    },
    smoke(x, y, n = 4, dark) {
      for (let i = 0; i < n; i++) {
        add({ x: x + R(-0.3, 0.3), y: y + R(-0.3, 0.3), z: R(2, 10), vx: R(-0.3, 0.3), vy: R(-0.3, 0.3), vz: R(15, 35), drag: 1, life: R(0.8, 1.6), color: dark ? ['#5a5a60', '#48484e', '#38383c'] : ['#d8d8dc', '#b8b8c0', '#98989f'], size: R(2, 3.5), grow: 3, kind: 'smoke', alpha: 0.6 });
      }
    },
    poof(x, y, n = 14) {
      for (let i = 0; i < n; i++) {
        const a = R(0, TAU), sp = R(1, 3.5);
        add({ x, y, z: R(4, 20), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vz: R(-20, 40), drag: 4, life: R(0.4, 0.8), color: ['#ffffff', '#e8e8f0', '#c8c8d4'], size: R(2.5, 4.5), grow: 4, kind: 'smoke', alpha: 0.9 });
      }
    },
    flame(x, y, z = 0, big = 1) {
      add({ x: x + R(-0.1, 0.1), y: y + R(-0.1, 0.1), z: z + R(0, 3), vx: R(-0.2, 0.2), vy: R(-0.2, 0.2), vz: R(25, 55) * big, drag: 1.5, life: R(0.35, 0.7), color: ELEM_COLORS.fire, size: R(1.5, 3) * big, grow: -3, kind: 'glow', add: true });
    },
    splash(x, y, n = 10, power = 1) {
      burst(x, y, 2, n, { colors: ['#e8f6ff', '#9ad4ff', '#3fa0ff'], min: 0.5, max: 2.5 * power, vzMin: 60, vzMax: 170 * power, g: 500, drag: 1, lifeMin: 0.35, lifeMax: 0.7, size: 2 });
    },
    leaves(x, y, z, n = 6) {
      burst(x, y, z, n, { colors: ['#3f8a36', '#62b04a', '#a8e070'], min: 0.3, max: 2, vzMin: 20, vzMax: 90, g: 60, drag: 2, lifeMin: 0.8, lifeMax: 1.6, size: 2 });
    },
    electric(x, y, z, n = 6) {
      burst(x, y, z, n, { colors: ELEM_COLORS.lightning, kind: 'spark', min: 1, max: 5, g: 0, drag: 6, lifeMin: 0.06, lifeMax: 0.2, add: true, len: 4 });
    },
    wind(x, y, z, n = 4) {
      burst(x, y, z, n, { colors: ELEM_COLORS.wind, kind: 'spark', min: 2, max: 6, g: 0, drag: 3, lifeMin: 0.15, lifeMax: 0.35, add: true, len: 5 });
    },
    aura(x, y, colors, n = 2, h = 26, spread = 0.35) {
      for (let i = 0; i < n; i++) {
        add({ x: x + R(-spread, spread), y: y + R(-spread, spread), z: R(0, h * 0.6), vz: R(30, 70), drag: 1, life: R(0.3, 0.6), color: colors, size: R(1, 2.5), grow: -2, kind: 'glow', add: true });
      }
    },
    ring(x, y, r, color, life = 0.35, grow = 8, thick = 1) {
      add({ x, y, z: 0, life, color, size: r, grow, kind: 'ring', layer: 0, thick });
    },
    glow(x, y, z, r, color, life = 0.15) {
      add({ x, y, z, life, color, size: r, kind: 'glow', add: true, grow: -r / life * 0.5 });
    },
    chakra(x, y, n, colors) {
      burst(x, y, 12, n, { colors: colors || ELEM_COLORS.shinobi, kind: 'glow', min: 0.5, max: 2, g: -60, drag: 3, lifeMin: 0.2, lifeMax: 0.5, add: true, size: 1.5 });
    },
    // Motion smear that follows a fighter's strike: 'arc' = swept crescent
    // (kicks, sweeps, uppercuts), 'thrust' = speed streaks along the punch line.
    smear(f, o = {}) {
      const ang0 = f.facing, reach = o.reach || 1, arc = o.arc || 1.4, z0 = o.z !== undefined ? o.z : 16;
      const col = o.color || '#ffffff', edge = o.edge || '#bfe0ff', rise = o.rise || 0, dir = o.dir || 1;
      const kind = o.kind || 'arc';
      api.custom({
        life: o.life || 0.13, layer: 1,
        draw(ctx, cam, k) {
          ctx.globalAlpha = (1 - k) * 0.9;
          if (kind === 'thrust') {
            const ca = Math.cos(ang0), sa = Math.sin(ang0), px = -sa, py = ca;
            for (let n = -1; n <= 1; n++) {
              const off = n * 0.09, len = reach * (n === 0 ? 1 : 0.7), st = 0.25 + k * 0.35;
              const [ax, ay] = DF.sp(f.x + ca * st + px * off, f.y + sa * st + py * off, f.z + z0 + n * 2, cam);
              const [bx, by] = DF.sp(f.x + ca * (st + len) + px * off, f.y + sa * (st + len) + py * off, f.z + z0 + n * 2, cam);
              ctx.fillStyle = n === 0 ? col : edge;
              PX.line(ctx, ax, ay, bx, by, n === 0 && k < 0.4 ? 2 : 1);
            }
            ctx.globalAlpha = 1;
            return;
          }
          const sweep = Math.min(1, k * 3.2), N = 16;
          for (let i = 0; i <= N; i++) {
            const u = i / N;
            if (u > sweep) break;
            const a = ang0 + dir * (-arc / 2 + arc * u);
            const r = reach * (0.7 + 0.3 * Math.sin(u * Math.PI));
            const [sx, sy] = DF.sp(f.x + Math.cos(a) * r, f.y + Math.sin(a) * r, f.z + z0 + rise * (0.5 - u), cam);
            const th = Math.max(1, Math.round(Math.sin(u * Math.PI) * 3 * (1 - k) + 0.4));
            ctx.fillStyle = edge; ctx.fillRect(Math.round(sx - th / 2) - 1, Math.round(sy - th / 2), th + 2, th);
            ctx.fillStyle = col; ctx.fillRect(Math.round(sx - th / 2), Math.round(sy - th / 2), th, Math.max(1, th - 1));
          }
          ctx.globalAlpha = 1;
        },
      });
    },
    // Comic-style starburst where a blow lands.
    impact(x, y, z, power = 1, color) {
      const rot = R(0, TAU), rays = power > 1.5 ? 10 : 8;
      api.custom({
        life: 0.12 + power * 0.03, layer: 1,
        draw(ctx, cam, k) {
          const [sx, sy] = DF.sp(x, y, z, cam);
          const Rr = (5 + power * 5) * (0.55 + k * 0.8);
          ctx.globalAlpha = 1 - k;
          ctx.fillStyle = color || '#fff2b0';
          for (let i = 0; i < rays; i++) {
            const a = rot + i * TAU / rays, len = Rr * (i % 2 ? 0.6 : 1);
            PX.line(ctx, sx + Math.cos(a) * Rr * 0.3, sy + Math.sin(a) * Rr * 0.25, sx + Math.cos(a) * len, sy + Math.sin(a) * len * 0.8, i % 2 ? 1 : 2);
          }
          ctx.fillStyle = '#ffffff';
          PX.circle(ctx, sx, sy, Math.max(1, Math.round((1 - k) * (2 + power * 1.8))));
          if (power > 1) PX.ellipseRing(ctx, sx, sy, Math.round(Rr * 1.1), Math.round(Rr * 0.8), 1);
          ctx.globalAlpha = 1;
        },
      });
    },
    // Ghost image of a sprite that fades (dash trails, flash step).
    afterimage(canvas, x, y, z, flip, life = 0.25, alpha = 0.55) {
      api.custom({
        life, layer: 1,
        draw(ctx, cam, k) {
          ctx.globalAlpha = (1 - k) * alpha;
          blitSprite(ctx, canvas, (x - y) * HALF_W - cam.x, (x + y) * HALF_H - z - cam.y, flip);
          ctx.globalAlpha = 1;
        },
      });
    },
  };
  return api;
})();

<script>
// ---- js/drawfx.js ----
'use strict';
// ---------------------------------------------------------------------------
// Pixel drawing helpers for jutsu visuals and default projectile renderers.
// ---------------------------------------------------------------------------

const DF = {
  // world -> screen (camera applied)
  sp(x, y, z, cam) { return [Math.round((x - y) * HALF_W - cam.x), Math.round((x + y) * HALF_H - (z || 0) - cam.y)]; },
  // world direction -> normalized screen direction
  sdir(vx, vy, vz = 0) {
    const sx = (vx - vy) * HALF_W, sy = (vx + vy) * HALF_H - vz;
    const l = Math.hypot(sx, sy) || 1;
    return [sx / l, sy / l];
  },

  groundEllipse(ctx, x, y, r, cam, fill = true) {
    const [sx, sy] = DF.sp(x, y, 0, cam);
    if (fill) PX.ellipse(ctx, sx, sy, r * ISO_RX, r * ISO_RY);
    else PX.ellipseRing(ctx, sx, sy, r * ISO_RX, r * ISO_RY, 1);
  },

  orb(ctx, sx, sy, r, cols, t = 0) {
    const f = Math.sin(t * 30) > 0 ? 1 : 0;
    ctx.fillStyle = cols[3] || cols[2]; PX.circle(ctx, sx, sy, r + 1 + f);
    ctx.fillStyle = cols[2]; PX.circle(ctx, sx, sy, r);
    ctx.fillStyle = cols[1]; PX.circle(ctx, sx - 1, sy - 1, Math.max(1, r * 0.65));
    ctx.fillStyle = cols[0]; PX.circle(ctx, sx - 1, sy - 1, Math.max(0, r * 0.3));
  },

  // Jagged lightning between two screen points.
  bolt(ctx, x0, y0, x1, y1, outer, inner, jag = 6, segs = 8, width = 2) {
    const pts = [[x0, y0]];
    const dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy) || 1;
    const nx = -dy / l, ny = dx / l;
    for (let i = 1; i < segs; i++) {
      const t = i / segs, o = U.rand(-jag, jag);
      pts.push([x0 + dx * t + nx * o, y0 + dy * t + ny * o]);
    }
    pts.push([x1, y1]);
    ctx.fillStyle = outer;
    for (let i = 0; i < pts.length - 1; i++) PX.line(ctx, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], width + 1);
    ctx.fillStyle = inner;
    for (let i = 0; i < pts.length - 1; i++) PX.line(ctx, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], Math.max(1, width - 1));
    return pts;
  },

  // Column of fire / light rising from the ground.
  column(ctx, sx, sy, w, h, cols, t) {
    for (let y = 0; y < h; y += 2) {
      const k = y / h;
      const ww = Math.max(1, Math.round(w * (1 - k * 0.5) + Math.sin(t * 25 + y * 0.5) * 2));
      ctx.fillStyle = cols[Math.min(cols.length - 1, Math.floor(k * cols.length + Math.random() * 0.8))];
      ctx.fillRect(sx - ww, sy - y - 2, ww * 2, 2);
    }
  },

  crescent(ctx, sx, sy, dx, dy, w, d, col, col2) {
    const nx = -dy, ny = dx;
    for (let i = -10; i <= 10; i++) {
      const t = i / 10;
      const px = sx + nx * t * w - dx * t * t * d, py = sy + ny * t * w - dy * t * t * d;
      ctx.fillStyle = col; ctx.fillRect(Math.round(px) - 1, Math.round(py) - 1, 3, 3);
      ctx.fillStyle = col2; ctx.fillRect(Math.round(px + dx), Math.round(py + dy), 1, 1);
    }
  },

  shadowUnder(ctx, x, y, cam, r = 0.3, a = 0.3) {
    const [sx, sy] = DF.sp(x, y, 0, cam);
    ctx.fillStyle = `rgba(0,0,0,${a})`;
    PX.ellipse(ctx, sx, sy, r * ISO_RX, r * ISO_RY);
  },
};

// Default projectile renderers by kind.
const PROJ_DRAW = {
  kunai(ctx, p, cam) {
    const [sx, sy] = DF.sp(p.x, p.y, p.z, cam);
    const [dx, dy] = DF.sdir(p.vx, p.vy);
    ctx.fillStyle = '#3a3a44'; PX.line(ctx, sx - dx * 5, sy - dy * 5, sx, sy, 1);
    ctx.fillStyle = '#d8dce6'; PX.line(ctx, sx, sy, sx + dx * 3, sy + dy * 3, 2);
    ctx.fillStyle = '#b8322a'; ctx.fillRect(Math.round(sx - dx * 6), Math.round(sy - dy * 6), 2, 2);
    if (p.tag) { ctx.fillStyle = (Math.floor(p.t * 12) % 2) ? '#fff2b0' : '#e8d8a0'; ctx.fillRect(Math.round(sx - dx * 4) - 1, Math.round(sy - dy * 4), 3, 4); }
  },
  fireball(ctx, p, cam) {
    const [sx, sy] = DF.sp(p.x, p.y, p.z, cam);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,120,30,0.35)'; PX.circle(ctx, sx, sy, p.size + 4);
    ctx.globalCompositeOperation = 'source-over';
    DF.orb(ctx, sx, sy, p.size, ['#fffbe0', '#ffd35c', '#ff8a1f', '#c8300f'], p.t);
  },
  flower(ctx, p, cam) {
    const [sx, sy] = DF.sp(p.x, p.y, p.z, cam);
    DF.orb(ctx, sx, sy, p.size, ['#fffbe0', '#ffd35c', '#ff6a1f', '#a3200d'], p.t);
  },
  waterball(ctx, p, cam) {
    const [sx, sy] = DF.sp(p.x, p.y, p.z, cam);
    DF.orb(ctx, sx, sy, p.size, ['#ffffff', '#b8e4ff', '#3fa0ff', '#174f9c'], 0);
  },
  bubble(ctx, p, cam) {
    const [sx, sy] = DF.sp(p.x, p.y, p.z, cam);
    ctx.fillStyle = 'rgba(80,170,255,0.45)'; PX.circle(ctx, sx, sy, p.size);
    ctx.fillStyle = '#b8e4ff'; PX.ellipseRing(ctx, sx, sy, p.size, p.size, 1);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(sx - 2, sy - 3, 2, 2);
  },
  airball(ctx, p, cam) {
    const [sx, sy] = DF.sp(p.x, p.y, p.z, cam);
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = '#d8fff0'; PX.ellipseRing(ctx, sx, sy, p.size, p.size, 1);
    ctx.fillStyle = 'rgba(200,255,235,0.35)'; PX.circle(ctx, sx, sy, p.size - 1);
    ctx.globalAlpha = 1;
  },
  blade(ctx, p, cam) {
    const [sx, sy] = DF.sp(p.x, p.y, p.z, cam);
    const [dx, dy] = DF.sdir(p.vx, p.vy);
    DF.crescent(ctx, sx, sy, dx, dy, p.size, p.size * 0.6, 'rgba(160,255,210,0.75)', '#ffffff');
  },
  rock(ctx, p, cam) {
    DF.shadowUnder(ctx, p.x, p.y, cam, 0.5 * p.size / 8, 0.35);
    const [sx, sy] = DF.sp(p.x, p.y, p.z, cam);
    const r = p.size;
    ctx.fillStyle = '#5e3b1a'; PX.circle(ctx, sx, sy, r + 1);
    ctx.fillStyle = '#9a6a3a'; PX.circle(ctx, sx, sy, r);
    ctx.fillStyle = '#c08a4a'; PX.circle(ctx, sx - 2, sy - 2, r * 0.55);
    ctx.fillStyle = '#6a4424'; ctx.fillRect(sx + 1, sy, 3, 1); ctx.fillRect(sx - 3, sy + 3, 2, 1);
  },
  hound(ctx, p, cam) {
    const [sx, sy] = DF.sp(p.x, p.y, p.z, cam);
    const [dx, dy] = DF.sdir(p.vx, p.vy);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(120,170,255,0.4)'; PX.circle(ctx, sx, sy, 7);
    ctx.globalCompositeOperation = 'source-over';
    const bx = sx - dx * 4, by = sy - dy * 4;
    ctx.fillStyle = '#8fc8ff'; PX.ellipse(ctx, bx, by, 5, 3);
    ctx.fillStyle = '#e0f0ff'; PX.circle(ctx, sx + dx * 3, sy + dy * 3 - 2, 3);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(sx + dx * 4), Math.round(sy + dy * 4 - 3), 1, 1);
    ctx.fillStyle = '#5f7aff';
    for (let i = 0; i < 3; i++) PX.line(ctx, bx, by, bx - dx * 6 + U.rand(-3, 3), by - dy * 6 + U.rand(-3, 3));
  },
  orb(ctx, p, cam) {
    const [sx, sy] = DF.sp(p.x, p.y, p.z, cam);
    const cols = p.cols || FX.ELEM_COLORS[p.element] || FX.ELEM_COLORS.shinobi;
    DF.orb(ctx, sx, sy, p.size, cols, p.t);
  },
  shadow(ctx, p, cam) {
    const [hx, hy] = DF.sp(p.x, p.y, 0, cam);
    const [ox, oy] = DF.sp(p.ox, p.oy, 0, cam);
    ctx.fillStyle = 'rgba(10,6,20,0.8)';
    PX.line(ctx, ox, oy, hx, hy, 3);
    PX.ellipse(ctx, hx, hy, 5, 3);
  },
  shuriken(ctx, p, cam) {
    const [sx, sy] = DF.sp(p.x, p.y, p.z, cam);
    const a = p.t * 30, r = p.size;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(160,255,220,0.35)'; PX.circle(ctx, sx, sy, r + 3);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#e8fff6';
    for (let k = 0; k < 4; k++) {
      const aa = a + k * Math.PI / 2;
      PX.line(ctx, sx, sy, sx + Math.cos(aa) * r, sy + Math.sin(aa) * r * 0.6, 2);
      PX.line(ctx, sx + Math.cos(aa) * r, sy + Math.sin(aa) * r * 0.6, sx + Math.cos(aa + 0.5) * r * 0.7, sy + Math.sin(aa + 0.5) * r * 0.42, 1);
    }
    ctx.fillStyle = '#7fe0b0'; PX.circle(ctx, sx, sy, 2);
  },
  dragon(ctx, p, cam) {
    const h = p.hist || [];
    const cols = p.cols;
    for (let i = 0; i < h.length; i++) {
      const q = h[i];
      const k = i / h.length;
      const [sx, sy] = DF.sp(q[0], q[1], q[2], cam);
      const r = Math.max(1, Math.round(p.size * (0.35 + 0.65 * k)));
      ctx.fillStyle = cols[3]; PX.circle(ctx, sx, sy, r + 1);
      ctx.fillStyle = i % 2 ? cols[2] : cols[1]; PX.circle(ctx, sx, sy, r);
    }
    const [sx, sy] = DF.sp(p.x, p.y, p.z, cam);
    const [dx, dy] = DF.sdir(p.vx, p.vy);
    ctx.fillStyle = cols[3]; PX.circle(ctx, sx, sy, p.size + 2);
    ctx.fillStyle = cols[1]; PX.circle(ctx, sx, sy, p.size + 1);
    ctx.fillStyle = cols[0]; PX.circle(ctx, sx + dx * 2, sy + dy * 2, p.size * 0.5);
    // eyes & horns
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(Math.round(sx + dx * 3 - dy * 3), Math.round(sy + dy * 3 + dx * 3) - 2, 2, 2);
    ctx.fillRect(Math.round(sx + dx * 3 + dy * 3), Math.round(sy + dy * 3 - dx * 3) - 2, 2, 2);
    ctx.fillStyle = cols[2];
    PX.line(ctx, sx - dy * 4, sy + dx * 4 - 3, sx - dx * 6 - dy * 7, sy - dy * 6 + dx * 7 - 6, 1);
    PX.line(ctx, sx + dy * 4, sy - dx * 4 - 3, sx - dx * 6 + dy * 7, sy - dy * 6 - dx * 7 - 6, 1);
  },
  spiral(ctx, p, cam) {
    const [sx, sy] = DF.sp(p.x, p.y, p.z, cam);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(120,180,255,0.4)'; PX.circle(ctx, sx, sy, p.size + 3);
    ctx.globalCompositeOperation = 'source-over';
    DF.orb(ctx, sx, sy, p.size, ['#ffffff', '#cfe8ff', '#5aa0ff', '#2a4fd6'], p.t);
    ctx.fillStyle = '#ffffff';
    for (let k = 0; k < 3; k++) { const a = p.t * 25 + k * 2.1; ctx.fillRect(Math.round(sx + Math.cos(a) * p.size * 0.7), Math.round(sy + Math.sin(a) * p.size * 0.7), 1, 1); }
  },
};
