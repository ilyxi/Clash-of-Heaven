<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clash of Heaven</title>
<meta name="description" content="A 32-bit style pixel shinobi arena brawler. Up to 10 fighters, elemental jutsu, awakenings, ultimates and destructible arenas.">
<meta property="og:type" content="website">
<meta property="og:title" content="Clash of Heaven">
<meta property="og:description" content="Pixel ninja arena brawler. 10 fighters, elemental jutsu, summons, awakenings and ultimates. Play free in your browser.">
<meta property="og:url" content="https://ilyxi.github.io/Clash-of-Heaven/">
<meta property="og:image" content="https://ilyxi.github.io/Clash-of-Heaven/docs/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Clash of Heaven">
<meta name="twitter:description" content="Pixel ninja arena brawler. 10 fighters, elemental jutsu, summons, awakenings and ultimates. Play free in your browser.">
<meta name="twitter:image" content="https://ilyxi.github.io/Clash-of-Heaven/docs/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0a14;
  --panel: rgba(16, 11, 26, 0.94);
  --panel2: rgba(30, 21, 46, 0.95);
  --edge: #3a2e4a;
  --edge2: #5a4a6e;
  --accent: #ff8a2a;
  --accent2: #ffd35c;
  --text: #efe6d4;
  --muted: #a898b8;
  --good: #5ad06a;
  --bad: #ff5a4a;
  --head: 'Press Start 2P', 'Courier New', monospace;
  --body: 'Silkscreen', 'Courier New', monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--text); font-family: var(--body); font-size: 14px; }
#game { position: fixed; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; }
#ui { position: fixed; inset: 0; pointer-events: none; }
#boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--head); color: var(--accent2); background: #0d0a14; font-size: 14px; letter-spacing: 2px; }
canvas.px, img.px { image-rendering: pixelated; image-rendering: crisp-edges; }

.screen { position: absolute; inset: 0; pointer-events: auto; display: flex; flex-direction: column; align-items: center; overflow-y: auto; padding: 18px 16px 24px; }
.screen.dim { background: rgba(8, 5, 14, 0.78); }
.screen.clear { background: linear-gradient(180deg, rgba(8, 5, 14, 0.2) 0%, rgba(8, 5, 14, 0.55) 60%, rgba(8, 5, 14, 0.85) 100%); justify-content: center; }
.hidden { display: none !important; }

h1, h2, h3 { font-family: var(--head); font-weight: normal; margin: 0 0 12px; letter-spacing: 1px; }
h2 { font-size: 18px; color: var(--accent2); text-shadow: 3px 3px 0 #000; }
h3 { font-size: 11px; color: var(--accent); margin-top: 14px; }
p { line-height: 1.5; margin: 6px 0; }

/* ---- title -------------------------------------------------------------- */
.logo { font-family: var(--head); text-align: center; line-height: 1.05; user-select: none; margin-bottom: 8px; }
.logo .l1, .logo .l3 { display: block; font-size: clamp(34px, 7vw, 76px); color: var(--accent2);
  text-shadow: 4px 4px 0 #b8421a, 8px 8px 0 #000, 0 0 30px rgba(255, 140, 40, 0.35); letter-spacing: 4px; }
.logo .l2 { display: block; font-size: clamp(14px, 2.4vw, 22px); color: #fff; text-shadow: 3px 3px 0 #000; margin: 10px 0; letter-spacing: 10px; }
.tagline { font-family: var(--head); font-size: 10px; color: var(--muted); letter-spacing: 3px; margin-bottom: 26px; text-shadow: 2px 2px 0 #000; text-align: center; }
.menu { display: flex; flex-direction: column; gap: 10px; width: min(340px, 90vw); }
.footer { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--muted); text-shadow: 1px 1px 0 #000; pointer-events: none; }

/* ---- buttons & controls ------------------------------------------------ */
.btn { font-family: var(--head); font-size: 11px; line-height: 1.4; color: var(--text); background: #2a1e3a; border: 3px solid #000;
  box-shadow: inset -3px -3px 0 #1a1226, inset 3px 3px 0 #4e3d64; padding: 11px 14px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
.btn:hover, .btn:focus-visible { background: var(--accent); color: #1a0e06; box-shadow: inset -3px -3px 0 #b8521a, inset 3px 3px 0 #ffc07a; outline: none; }
.btn.primary { background: #b8421a; }
.btn.primary:hover { background: var(--accent2); }
.btn.small { font-size: 9px; padding: 7px 9px; }
.btn.danger:hover { background: var(--bad); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.center { justify-content: center; }
.grow { flex: 1; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button { font-family: var(--body); font-size: 13px; background: #1e1530; color: var(--text); border: 2px solid #000; box-shadow: inset 0 0 0 1px #3a2e4a; padding: 6px 10px; cursor: pointer; }
.seg button:hover { background: #3a2a52; }
.seg button.on { background: var(--accent); color: #1a0e06; box-shadow: inset 0 0 0 1px #ffc07a; }
select, input[type=text] { font-family: var(--body); font-size: 14px; background: #120c1e; color: var(--text); border: 2px solid #000; box-shadow: inset 0 0 0 1px var(--edge2); padding: 6px 8px; }
input[type=range] { accent-color: var(--accent); }
label.field { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }

.panel { background: var(--panel); border: 3px solid #000; box-shadow: inset 0 0 0 2px var(--edge), 0 6px 0 rgba(0, 0, 0, 0.5); padding: 16px; }
.wrap { width: min(1180px, 100%); }
.cols { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .cols.two { grid-template-columns: 360px 1fr; } .cols.setup { grid-template-columns: 1fr 1fr; } }
.topbar { display: flex; align-items: center; gap: 12px; width: min(1180px, 100%); margin-bottom: 12px; }
.topbar h2 { margin: 0; flex: 1; }

/* ---- cards ---------------------------------------------------------------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.card { display: flex; gap: 10px; background: #1a1228; border: 2px solid #000; box-shadow: inset 0 0 0 1px var(--edge); padding: 8px; cursor: pointer; text-align: left; color: var(--text); font-family: var(--body); font-size: 12px; }
.card:hover { box-shadow: inset 0 0 0 1px var(--accent); background: #241836; }
.card.on { box-shadow: inset 0 0 0 2px var(--accent2); background: #2e2040; }
.card.disabled { opacity: 0.45; }
.card img { width: 48px; height: 48px; flex: none; }
.card .t { font-family: var(--head); font-size: 9px; color: #fff; margin-bottom: 4px; line-height: 1.4; }
.card .meta { color: var(--muted); font-size: 11px; margin-bottom: 3px; }
.card .d { font-size: 11px; line-height: 1.35; color: #d8cfe0; }
.card .m { font-size: 11px; color: #ff9af0; margin-top: 3px; }
.tag { display: inline-block; padding: 1px 5px; font-size: 10px; border: 1px solid #000; color: #120a18; margin-right: 4px; }

.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.slot { background: #120c1e; border: 2px solid #000; box-shadow: inset 0 0 0 1px var(--edge2); padding: 6px; text-align: center; cursor: pointer; min-height: 88px; font-size: 11px; }
.slot.on { box-shadow: inset 0 0 0 2px var(--accent2); }
.slot img { width: 40px; height: 40px; display: block; margin: 2px auto 4px; }
.slot .k { font-family: var(--head); font-size: 9px; color: var(--accent2); }

.swatches { display: flex; flex-wrap: wrap; gap: 4px; }
.sw { width: 24px; height: 24px; border: 2px solid #000; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2); }
.sw.on { outline: 2px solid var(--accent2); outline-offset: 1px; }

.preview { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.preview canvas { background: radial-gradient(circle at 50% 70%, #3a5a2e 0%, #1a2a16 70%); border: 3px solid #000; box-shadow: inset 0 0 0 2px var(--edge); }
.stat { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; border-bottom: 1px dashed #2e2440; width: 100%; }
.stat b { color: var(--accent2); font-weight: normal; }

.tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.tabs button { font-family: var(--head); font-size: 9px; padding: 9px 11px; background: #1e1530; color: var(--muted); border: 2px solid #000; cursor: pointer; }
.tabs button.on { background: var(--accent); color: #1a0e06; }

.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.rcard { background: #1a1228; border: 2px solid #000; box-shadow: inset 0 0 0 1px var(--edge); padding: 8px; text-align: center; cursor: pointer; font-size: 11px; position: relative; }
.rcard:hover { box-shadow: inset 0 0 0 1px var(--accent); }
.rcard.on { box-shadow: inset 0 0 0 2px var(--accent2); background: #2e2040; }
.rcard canvas { width: 72px; height: 66px; display: block; margin: 0 auto 4px; }
.rcard .n { font-family: var(--head); font-size: 8px; line-height: 1.5; color: #fff; }
.rcard .el { font-size: 10px; }
.rcard .badge { position: absolute; top: 4px; right: 4px; font-size: 9px; background: var(--accent); color: #120a18; padding: 1px 4px; }

.slotlist { display: flex; flex-direction: column; gap: 5px; max-height: 52vh; overflow-y: auto; padding-right: 4px; }
.srow { display: grid; grid-template-columns: 34px 1fr auto auto; gap: 6px; align-items: center; background: #160f24; border: 1px solid #000; padding: 4px; }
.srow canvas { width: 32px; height: 29px; }
.srow .you { font-family: var(--head); font-size: 8px; color: var(--accent2); }

.howto { columns: 2 320px; column-gap: 26px; }
.howto section { break-inside: avoid; margin-bottom: 12px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
.key { font-family: var(--head); font-size: 9px; background: #2a1e3a; border: 2px solid #000; box-shadow: inset -2px -2px 0 #1a1226; padding: 4px 6px; color: var(--accent2); white-space: nowrap; text-align: center; }
.wheel { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; margin: 6px 0; }

table.res { width: 100%; border-collapse: collapse; font-size: 13px; }
table.res th { font-family: var(--head); font-size: 8px; color: var(--muted); text-align: right; padding: 6px; border-bottom: 2px solid var(--edge); }
table.res th:first-child, table.res td:first-child, table.res th:nth-child(2), table.res td:nth-child(2) { text-align: left; }
table.res td { padding: 5px 6px; text-align: right; border-bottom: 1px solid #241a34; }
table.res tr.me td { background: rgba(255, 211, 92, 0.1); }
table.res canvas { width: 32px; height: 29px; vertical-align: middle; }
.bigresult { font-family: var(--head); font-size: clamp(28px, 6vw, 56px); text-shadow: 4px 4px 0 #000; margin: 10px 0 18px; text-align: center; }
.mvp { font-family: var(--head); font-size: 8px; background: var(--accent2); color: #120a18; padding: 2px 4px; margin-left: 6px; }
.note { font-size: 11px; color: var(--muted); }
.pausebox { margin: auto; display: flex; flex-direction: column; gap: 10px; width: min(320px, 90vw); text-align: center; }

/* ---- controller navigation --------------------------------------------- */
body.pad-nav #ui :focus { outline: 3px solid var(--accent2); outline-offset: 2px; }
body.pad-nav #ui .btn:focus { background: var(--accent); color: #1a0e06; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 40px); opacity: 0; transition: transform 0.25s, opacity 0.25s;
  font-family: var(--head); font-size: 10px; letter-spacing: 1px; color: #120a18; background: var(--accent2); border: 3px solid #000; padding: 10px 14px; pointer-events: none; z-index: 10; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<div id="boot">LOADING...</div>

<script>
// ---- js/util.js ----
'use strict';
// ---------------------------------------------------------------------------
// Shared math / color / misc helpers. Loaded first; everything else uses U.
// ---------------------------------------------------------------------------

const TAU = Math.PI * 2;

// Isometric tile dimensions (screen pixels at 1x).
const TILE_W = 32;
const TILE_H = 16;
const HALF_W = TILE_W / 2;
const HALF_H = TILE_H / 2;
// A world circle of radius r tiles projects to an ellipse with these radii (px).
const ISO_RX = HALF_W * Math.SQRT2;
const ISO_RY = HALF_H * Math.SQRT2;

const U = {
  clamp(v, a, b) { return v < a ? a : v > b ? b : v; },
  lerp(a, b, t) { return a + (b - a) * t; },
  rand(a = 0, b = 1) { return a + Math.random() * (b - a); },
  randi(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); },
  chance(p) { return Math.random() < p; },
  pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  },
  dist(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return Math.sqrt(dx * dx + dy * dy); },
  dist2(ax, ay, bx, by) { const dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; },
  angle(ax, ay, bx, by) { return Math.atan2(by - ay, bx - ax); },
  angDiff(a, b) {
    let d = (b - a) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  },
  turnToward(a, target, maxStep) {
    const d = U.angDiff(a, target);
    if (Math.abs(d) <= maxStep) return target;
    return a + Math.sign(d) * maxStep;
  },
  approach(v, target, delta) {
    if (v < target) return Math.min(v + delta, target);
    return Math.max(v - delta, target);
  },
  norm(x, y) {
    const l = Math.sqrt(x * x + y * y);
    return l > 1e-6 ? [x / l, y / l] : [0, 0];
  },
  easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); },
  easeInCubic(t) { return t * t * t; },
  easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },

  // Distance from point to segment, plus projection param t along segment.
  pointSegDist(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    const l2 = dx * dx + dy * dy;
    let t = l2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
    t = U.clamp(t, 0, 1);
    const cx = ax + dx * t, cy = ay + dy * t;
    return { d: Math.sqrt((px - cx) * (px - cx) + (py - cy) * (py - cy)), t };
  },

  // Deterministic PRNG (mulberry32) for map generation.
  rng(seed) {
    let a = seed >>> 0;
    const f = () => {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.range = (lo, hi) => lo + f() * (hi - lo);
    f.int = (lo, hi) => Math.floor(lo + f() * (hi - lo + 1));
    f.pick = (arr) => arr[Math.floor(f() * arr.length)];
    f.chance = (p) => f() < p;
    return f;
  },

  // Cheap hash-based value noise, deterministic per seed.
  hash2(x, y, seed = 0) {
    let h = (x * 374761393 + y * 668265263 + seed * 1442695041) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  },
  valueNoise(x, y, seed = 0) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const s = (t) => t * t * (3 - 2 * t);
    const a = U.hash2(xi, yi, seed), b = U.hash2(xi + 1, yi, seed);
    const c = U.hash2(xi, yi + 1, seed), d = U.hash2(xi + 1, yi + 1, seed);
    const u = s(xf), v = s(yf);
    return U.lerp(U.lerp(a, b, u), U.lerp(c, d, u), v);
  },
  fbm(x, y, seed = 0, oct = 3) {
    let amp = 0.5, freq = 1, sum = 0, norm = 0;
    for (let i = 0; i < oct; i++) {
      sum += amp * U.valueNoise(x * freq, y * freq, seed + i * 17);
      norm += amp; amp *= 0.5; freq *= 2;
    }
    return sum / norm;
  },

  // ---- colors -------------------------------------------------------------
  hexToRgb(hex) {
    const h = hex.replace('#', '');
    const n = parseInt(h.length === 3 ? h.split('').map((c) => c + c).join('') : h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  },
  rgbToHex(r, g, b) {
    const c = (v) => U.clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0');
    return '#' + c(r) + c(g) + c(b);
  },
  // amt > 0 lightens toward white, < 0 darkens toward black.
  shade(hex, amt) {
    const [r, g, b] = U.hexToRgb(hex);
    if (amt >= 0) return U.rgbToHex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt);
    const k = 1 + amt;
    return U.rgbToHex(r * k, g * k, b * k);
  },
  mix(a, b, t) {
    const A = U.hexToRgb(a), B = U.hexToRgb(b);
    return U.rgbToHex(U.lerp(A[0], B[0], t), U.lerp(A[1], B[1], t), U.lerp(A[2], B[2], t));
  },
  rgba(hex, a) {
    const [r, g, b] = U.hexToRgb(hex);
    return `rgba(${r},${g},${b},${a})`;
  },

  makeCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    return c;
  },

  uid: (() => { let n = 1; return () => n++; })(),

  fmtTime(sec) {
    sec = Math.max(0, Math.ceil(sec));
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  },

  deepCopy(o) { return JSON.parse(JSON.stringify(o)); },
};

// ---- isometric projection --------------------------------------------------
const ISO = {
  // world (tile units) -> screen pixels (before camera offset)
  sx(x, y) { return (x - y) * HALF_W; },
  sy(x, y, z = 0) { return (x + y) * HALF_H - z; },
  // screen pixels (before camera) -> world ground position
  toWorld(px, py) {
    const a = px / HALF_W, b = py / HALF_H;
    return { x: (a + b) / 2, y: (b - a) / 2 };
  },
  // Screen-space direction (dx right, dy down) -> normalized world direction.
  screenDirToWorld(dx, dy) { return U.norm(dx + dy, dy - dx); },
  // Facing index for sprites from world angle: 0=SE(front,right) 1=SW(front,left) 2=NE(back,right) 3=NW(back,left)
  facingFromAngle(ang) {
    const dx = Math.cos(ang), dy = Math.sin(ang);
    const sx = dx - dy, sy = dx + dy; // screen direction
    const front = sy >= -0.05;
    const right = sx >= 0;
    return front ? (right ? 0 : 1) : (right ? 2 : 3);
  },
};

// ---- hi-res sprites -----------------------------------------------------------
// Sprites are authored at 1x and upscaled 2x with EPX/Scale2x, which smooths
// diagonals and curves while keeping hard pixel edges. `lw`/`lh` hold the
// logical (1x) size so drawing code can keep working in logical pixels.
const HIRES = 2;
function epx2(src) {
  const w = src.width, h = src.height;
  const s = src.getContext('2d').getImageData(0, 0, w, h);
  const sd = new Uint32Array(s.data.buffer);
  for (let i = 0; i < sd.length; i++) if ((sd[i] >>> 24) === 0) sd[i] = 0; // normalise transparency
  const out = U.makeCanvas(w * 2, h * 2);
  const octx = out.getContext('2d');
  const o = octx.createImageData(w * 2, h * 2);
  const od = new Uint32Array(o.data.buffer);
  const W2 = w * 2;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const P = sd[y * w + x];
      const A = y > 0 ? sd[(y - 1) * w + x] : P;
      const B = x < w - 1 ? sd[y * w + x + 1] : P;
      const C = x > 0 ? sd[y * w + x - 1] : P;
      const D = y < h - 1 ? sd[(y + 1) * w + x] : P;
      const i = (y * 2) * W2 + x * 2;
      od[i] = (C === A && C !== D && A !== B) ? A : P;
      od[i + 1] = (A === B && A !== C && B !== D) ? B : P;
      od[i + W2] = (D === C && D !== B && C !== A) ? C : P;
      od[i + W2 + 1] = (B === D && B !== A && D !== C) ? D : P;
    }
  }
  octx.putImageData(o, 0, 0);
  out.lw = w; out.lh = h;
  return out;
}
// Draw a (possibly hi-res) canvas at its logical size.
function drawHi(ctx, c, x, y) {
  ctx.drawImage(c, Math.round(x), Math.round(y), c.lw || c.width, c.lh || c.height);
}

// ---- pixel primitives (crisp, no anti-aliasing) ----------------------------
const PX = {
  circle(ctx, cx, cy, r) {
    cx = Math.round(cx); cy = Math.round(cy); r = Math.max(0, Math.round(r));
    for (let y = -r; y <= r; y++) {
      const w = Math.round(Math.sqrt(r * r - y * y + r * 0.8));
      ctx.fillRect(cx - w, cy + y, w * 2 + 1, 1);
    }
  },
  ellipse(ctx, cx, cy, rx, ry) {
    cx = Math.round(cx); cy = Math.round(cy);
    rx = Math.max(0.5, rx); ry = Math.max(0.5, ry);
    const R = Math.round(ry);
    for (let y = -R; y <= R; y++) {
      const t = 1 - (y * y) / (ry * ry + ry * 0.6);
      if (t <= 0) continue;
      const w = Math.round(rx * Math.sqrt(t));
      ctx.fillRect(cx - w, cy + y, w * 2 + 1, 1);
    }
  },
  ellipseRing(ctx, cx, cy, rx, ry, thick = 1) {
    cx = Math.round(cx); cy = Math.round(cy);
    const steps = Math.max(16, Math.round((rx + ry) * 2.2));
    for (let i = 0; i < steps; i++) {
      const a = (i / steps) * TAU;
      ctx.fillRect(Math.round(cx + Math.cos(a) * rx), Math.round(cy + Math.sin(a) * ry), thick, thick);
    }
  },
  line(ctx, x0, y0, x1, y1, w = 1) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx + dy, guard = 0;
    const o = Math.floor(w / 2);
    while (guard++ < 2000) {
      ctx.fillRect(x0 - o, y0 - o, w, w);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  },
};

</script>

'use strict';
// ---------------------------------------------------------------------------
// 5x7 bitmap pixel font for crisp in-canvas text. Rendered strings are cached.

const Font = (() => {
  const G = {

    8: ['.###.', '#...#', '#...#', '.###.', '#...#', '#...#', '.###.'],

    ' ': ['..', '..', '..', '..', '..', '..', '..'],
    '.': ['.', '.', '.', '.', '.', '.', '#'],
    ',': ['..', '..', '..', '..', '..', '.#', '#.'],
    '!': ['#', '#', '#', '#', '#', '.', '#'],
    '?': ['.###.', '#...#', '....#', '...#.', '..#..', '.....', '..#..'],
    ':': ['.', '.', '#', '.', '.', '#', '.'],
    ';': ['..', '..', '.#', '..', '..', '.#', '#.'],
    "'": ['#', '#', '.', '.', '.', '.', '.'],
    '"': ['#.#', '#.#', '...', '...', '...', '...', '...'],
    '-': ['...', '...', '...', '###', '...', '...', '...'],
    '+': ['.....', '..#..', '..#..', '#####', '..#..', '..#..', '.....'],
    '/': ['....#', '....#', '...#.', '..#..', '.#...', '#....', '#....'],

    ')': ['#.', '.#', '.#', '.#', '.#', '.#', '#.'],
    '%': ['##..#', '##..#', '...#.', '..#..', '.#...', '#..##', '#..##'],
    '#': ['.#.#.', '.#.#.', '#####', '.#.#.', '#####', '.#.#.', '.#.#.'],
    '*': ['.....', '#.#.#', '.###.', '#####', '.###.', '#.#.#', '.....'],
    '<': ['...#', '..#.', '.#..', '#...', '.#..', '..#.', '...#'],
    '>': ['#...', '.#..', '..#.', '...#', '..#.', '.#..', '#...'],
    '=': ['....', '....', '####', '....', '####', '....', '....'],
    '_': ['.....', '.....', '.....', '.....', '.....', '.....', '#####'],
    '[': ['##', '#.', '#.', '#.', '#.', '#.', '##'],
    ']': ['##', '.#', '.#', '.#', '.#', '.#', '##'],
    '&': ['.##..', '#..#.', '#.#..', '.#...', '#.#.#', '#..#.', '.##.#'],
    '×': ['.....', '.....', '#...#', '.#.#.', '..#..', '.#.#.', '#...#'],
    '^': ['..#..', '.#.#.', '#...#', '.....', '.....', '.....', '.....'],
    '~': ['.....', '.....', '.#...', '#.#.#', '...#.', '.....', '.....'],
    '|': ['#', '#', '#', '#', '#', '#', '#'],
  };
  const GLYPH_H = 7;
  const SPACING = 1;

  function glyph(ch) {
    if (G[ch]) return G[ch];
    const up = ch.toUpperCase();
    return G[up] || G['?'];
  }

  function measure(text, scale = 1) {
    let w = 0;
    for (let i = 0; i < text.length; i++) {
      w += glyph(text[i])[0].length + (i < text.length - 1 ? SPACING : 0);
    }
    return w * scale;
  }

  const cache = new Map();

  function render(text, color, scale, outline, shadow) {
    const key = text + '|' + color + '|' + scale + '|' + (outline || '') + '|' + (shadow || '');
    let c = cache.get(key);
    if (c) return c;
    if (cache.size > 800) cache.clear();
    const pad = outline || shadow ? 1 : 0;
    const w = measure(text, 1);
    c = U.makeCanvas(w * scale + pad * 2 * scale, GLYPH_H * scale + pad * 2 * scale);
    const ctx = c.getContext('2d');
    const paint = (ox, oy, col) => {
      ctx.fillStyle = col;
      let x = 0;
      for (let i = 0; i < text.length; i++) {
        const g = glyph(text[i]);
        for (let r = 0; r < GLYPH_H; r++) {
          const row = g[r];
          for (let k = 0; k < row.length; k++) {
            if (row[k] === '#') ctx.fillRect((x + k + ox) * scale, (r + oy) * scale, scale, scale);
          }
        }
        x += g[0].length + SPACING;
      }
    };
    if (outline) {
      for (let oy = 0; oy <= 2; oy++) for (let ox = 0; ox <= 2; ox++) if (ox !== 1 || oy !== 1) paint(ox, oy, outline);
    } else if (shadow) {
      paint(2, 2, shadow);
      paint(1, 2, shadow);
    }
    paint(pad, pad, color);
    cache.set(key, c);
    return c;
  }

  // align: 'left' | 'center' | 'right'
  function draw(ctx, text, x, y, color = '#fff', opts = {}) {
    text = String(text);
    if (!text.length) return 0;
    const scale = opts.scale || 1;
    const c = render(text, color, scale, opts.outline, opts.shadow);
    const pad = opts.outline || opts.shadow ? scale : 0;
    let dx = Math.round(x) - pad;
    if (opts.align === 'center') dx = Math.round(x - (c.width - pad * 2) / 2) - pad;
    else if (opts.align === 'right') dx = Math.round(x - (c.width - pad * 2)) - pad;
    ctx.drawImage(c, dx, Math.round(y) - pad);
    return c.width - pad * 2;
  }

  return { draw, measure, height: GLYPH_H, render };
})();

</script>
<script>
// ---- js/audio.js ----
'use strict';
// ---------------------------------------------------------------------------
// Synthesized sound effects + procedural music (WebAudio, no assets).
// ---------------------------------------------------------------------------

const SFX = (() => {
  let ac = null, master = null, sfxBus = null, musicBus = null, noiseBuf = null;
  const last = {};
  let voices = 0;
  const settings = { sfx: 0.7, music: 0.45, muted: false };

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain();
    master.connect(ac.destination);
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    comp.connect(master);
    sfxBus = ac.createGain(); sfxBus.connect(comp);
    musicBus = ac.createGain(); musicBus.connect(comp);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    applyVolumes();
  }

  function applyVolumes() {
    if (!ac) return;
    master.gain.value = settings.muted ? 0 : 1;
    sfxBus.gain.value = settings.sfx;
    musicBus.gain.value = settings.music * 0.55;
  }

  function out(pan, bus) {
    let node = bus || sfxBus;
    if (pan && ac.createStereoPanner) {
      const p = ac.createStereoPanner();
      p.pan.value = U.clamp(pan, -1, 1);
      p.connect(node);
      node = p;
    }
    return node;
  }

  function env(g, t, vol, attack, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }

  function tone(o) {
    const t = ac.currentTime + (o.delay || 0);
    const osc = ac.createOscillator();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.freq, t);
    if (o.freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.freqEnd), t + o.dur);
    if (o.detune) osc.detune.value = o.detune;
    const g = ac.createGain();
    env(g, t, o.vol || 0.2, o.attack || 0.005, o.dur);
    osc.connect(g); g.connect(out(o.pan, o.bus));
    osc.start(t); osc.stop(t + o.dur + 0.05);
    voices++; osc.onended = () => voices--;
  }

  function noise(o) {
    const t = ac.currentTime + (o.delay || 0);
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    const f = ac.createBiquadFilter();
    f.type = o.filter || 'lowpass';
    f.frequency.setValueAtTime(o.freq || 1000, t);
    if (o.freqEnd) f.frequency.exponentialRampToValueAtTime(Math.max(20, o.freqEnd), t + o.dur);
    f.Q.value = o.q || 0.8;
    const g = ac.createGain();
    env(g, t, o.vol || 0.2, o.attack || 0.005, o.dur);
    src.connect(f); f.connect(g); g.connect(out(o.pan, o.bus));
    src.start(t, Math.random() * 0.5); src.stop(t + o.dur + 0.05);
    voices++; src.onended = () => voices--;
  }

  const P = {
    swing: (v, p) => noise({ filter: 'bandpass', freq: 900, freqEnd: 3200, dur: 0.09, vol: 0.18 * v, q: 1.2, pan: p }),
    hit: (v, p) => { tone({ type: 'square', freq: 190, freqEnd: 55, dur: 0.08, vol: 0.16 * v, pan: p }); noise({ freq: 2400, freqEnd: 500, dur: 0.07, vol: 0.3 * v, pan: p }); },
    hitHeavy: (v, p) => { tone({ type: 'sine', freq: 140, freqEnd: 35, dur: 0.22, vol: 0.45 * v, pan: p }); noise({ freq: 1600, freqEnd: 200, dur: 0.18, vol: 0.4 * v, pan: p }); },
    block: (v, p) => { tone({ type: 'triangle', freq: 520, freqEnd: 380, dur: 0.06, vol: 0.2 * v, pan: p }); noise({ filter: 'highpass', freq: 2500, dur: 0.05, vol: 0.12 * v, pan: p }); },
    parry: (v, p) => { tone({ type: 'sine', freq: 1500, dur: 0.35, vol: 0.22 * v, pan: p }); tone({ type: 'sine', freq: 2250, dur: 0.25, vol: 0.12 * v, pan: p }); tone({ type: 'square', freq: 3000, dur: 0.05, vol: 0.06 * v, pan: p }); },
    guardBreak: (v, p) => { tone({ type: 'sawtooth', freq: 300, freqEnd: 80, dur: 0.3, vol: 0.2 * v, pan: p }); noise({ freq: 3000, freqEnd: 300, dur: 0.25, vol: 0.3 * v, pan: p }); },
    dash: (v, p) => noise({ filter: 'bandpass', freq: 700, freqEnd: 2600, dur: 0.13, vol: 0.14 * v, q: 1.5, pan: p }),
    kunai: (v, p) => { noise({ filter: 'highpass', freq: 3500, dur: 0.05, vol: 0.1 * v, pan: p }); tone({ type: 'triangle', freq: 1900, freqEnd: 900, dur: 0.07, vol: 0.06 * v, pan: p }); },
    clink: (v, p) => { tone({ type: 'square', freq: 2600, dur: 0.05, vol: 0.08 * v, pan: p }); tone({ type: 'sine', freq: 3400, dur: 0.12, vol: 0.08 * v, pan: p }); },
    fire: (v, p) => { noise({ freq: 1400, freqEnd: 300, dur: 0.4, vol: 0.28 * v, attack: 0.03, pan: p }); tone({ type: 'sawtooth', freq: 90, freqEnd: 50, dur: 0.25, vol: 0.05 * v, pan: p }); },
    fireBig: (v, p) => { noise({ freq: 900, freqEnd: 120, dur: 0.9, vol: 0.4 * v, attack: 0.05, pan: p }); tone({ type: 'sine', freq: 90, freqEnd: 35, dur: 0.7, vol: 0.3 * v, pan: p }); },
    water: (v, p) => { noise({ filter: 'bandpass', freq: 500, freqEnd: 1600, dur: 0.35, vol: 0.28 * v, q: 2.5, attack: 0.02, pan: p }); tone({ type: 'sine', freq: 350, freqEnd: 900, dur: 0.12, vol: 0.08 * v, pan: p, delay: 0.05 }); },
    splash: (v, p) => { noise({ filter: 'bandpass', freq: 1400, freqEnd: 400, dur: 0.25, vol: 0.25 * v, q: 1.5, pan: p }); },
    earth: (v, p) => { noise({ freq: 400, freqEnd: 90, dur: 0.45, vol: 0.4 * v, attack: 0.01, pan: p }); tone({ type: 'sine', freq: 70, freqEnd: 30, dur: 0.4, vol: 0.35 * v, pan: p }); },
    wind: (v, p) => noise({ filter: 'bandpass', freq: 350, freqEnd: 2000, dur: 0.45, vol: 0.3 * v, q: 1, attack: 0.06, pan: p }),
    lightning: (v, p) => {
      noise({ filter: 'highpass', freq: 1800, dur: 0.25, vol: 0.25 * v, pan: p });
      for (let i = 0; i < 4; i++) tone({ type: 'square', freq: U.rand(80, 400), dur: 0.03, vol: 0.08 * v, delay: i * 0.035, pan: p });
    },
    thunder: (v, p) => { noise({ freq: 2500, freqEnd: 90, dur: 1.2, vol: 0.5 * v, pan: p }); P.lightning(v, p); },
    explosion: (v, p) => { noise({ freq: 1000, freqEnd: 70, dur: 0.9, vol: 0.55 * v, pan: p }); tone({ type: 'sine', freq: 100, freqEnd: 28, dur: 0.7, vol: 0.45 * v, pan: p }); },
    poof: (v, p) => noise({ filter: 'bandpass', freq: 1200, freqEnd: 500, dur: 0.18, vol: 0.2 * v, q: 0.7, pan: p }),
    seal: (v, p) => { tone({ type: 'triangle', freq: 1100, dur: 0.03, vol: 0.07 * v, pan: p }); tone({ type: 'triangle', freq: 1300, dur: 0.03, vol: 0.07 * v, delay: 0.06, pan: p }); },
    charge: (v, p) => { tone({ type: 'sine', freq: 180, freqEnd: 360, dur: 0.35, vol: 0.08 * v, attack: 0.1, pan: p }); noise({ filter: 'bandpass', freq: 600, dur: 0.35, vol: 0.05 * v, attack: 0.1, pan: p }); },
    levelup: (v) => { [523, 659, 784, 1046].forEach((f, i) => tone({ type: 'square', freq: f, dur: 0.12, vol: 0.09 * v, delay: i * 0.07 })); },
    mastery: (v) => { [392, 523, 659, 784, 1046, 1318].forEach((f, i) => tone({ type: 'triangle', freq: f, dur: 0.18, vol: 0.12 * v, delay: i * 0.06 })); },
    awaken: (v, p) => { tone({ type: 'sawtooth', freq: 70, freqEnd: 420, dur: 1.0, vol: 0.14 * v, attack: 0.1, pan: p }); noise({ freq: 400, freqEnd: 4000, dur: 0.9, vol: 0.25 * v, attack: 0.2, pan: p }); tone({ type: 'sine', freq: 55, dur: 1.0, vol: 0.3 * v, pan: p }); },
    ult: (v) => { tone({ type: 'sawtooth', freq: 55, dur: 1.2, vol: 0.14 * v, attack: 0.3 }); tone({ type: 'sawtooth', freq: 82.5, dur: 1.2, vol: 0.1 * v, attack: 0.3 }); noise({ freq: 200, freqEnd: 3000, dur: 1.1, vol: 0.25 * v, attack: 0.8 }); },
    ui: (v) => tone({ type: 'square', freq: 880, dur: 0.04, vol: 0.06 * v }),
    uiOk: (v) => { tone({ type: 'square', freq: 660, dur: 0.05, vol: 0.06 * v }); tone({ type: 'square', freq: 990, dur: 0.07, vol: 0.06 * v, delay: 0.05 }); },
    uiBack: (v) => tone({ type: 'square', freq: 440, freqEnd: 330, dur: 0.07, vol: 0.06 * v }),
    ko: (v, p) => { tone({ type: 'sawtooth', freq: 320, freqEnd: 50, dur: 0.6, vol: 0.18 * v, pan: p }); noise({ freq: 1800, freqEnd: 200, dur: 0.5, vol: 0.3 * v, pan: p }); },
    crumble: (v, p) => { noise({ freq: 700, freqEnd: 150, dur: 0.5, vol: 0.35 * v, pan: p }); for (let i = 0; i < 3; i++) tone({ type: 'sine', freq: U.rand(60, 110), freqEnd: 30, dur: 0.12, vol: 0.2 * v, delay: i * 0.07, pan: p }); },
    wood: (v, p) => { noise({ filter: 'bandpass', freq: 450, dur: 0.12, vol: 0.2 * v, q: 2, pan: p }); tone({ type: 'triangle', freq: 170, freqEnd: 120, dur: 0.1, vol: 0.15 * v, pan: p }); },
    sub: (v, p) => { P.poof(v, p); tone({ type: 'square', freq: 900, freqEnd: 1800, dur: 0.08, vol: 0.06 * v, pan: p }); },
    whip: (v, p) => noise({ filter: 'bandpass', freq: 2000, freqEnd: 600, dur: 0.15, vol: 0.25 * v, q: 3, pan: p }),
    beam: (v, p) => { tone({ type: 'sawtooth', freq: 120, dur: 1.0, vol: 0.12 * v, attack: 0.05, pan: p }); noise({ freq: 3000, freqEnd: 600, dur: 1.0, vol: 0.3 * v, pan: p }); },
    burn: (v, p) => noise({ freq: 700, dur: 0.12, vol: 0.06 * v, pan: p }),
    tick: (v) => tone({ type: 'square', freq: 1200, dur: 0.03, vol: 0.05 * v }),
    horn: (v) => { tone({ type: 'sawtooth', freq: 220, dur: 0.7, vol: 0.1 * v, attack: 0.05 }); tone({ type: 'sawtooth', freq: 330, dur: 0.7, vol: 0.08 * v, attack: 0.05 }); },
  };

  // listener position used for positional attenuation
  const listener = { x: 0, y: 0 };

  function play(name, vol = 1, pan = 0) {
    if (!ac || settings.muted || !P[name]) return;
    const now = ac.currentTime;
    if (last[name] && now - last[name] < 0.035) return;
    if (voices > 48) return;
    last[name] = now;
    try { P[name](vol, pan); } catch (e) {
      // audio errors never break gameplay; report each broken sound once
      if (!last['err:' + name]) { last['err:' + name] = 1; console.warn('sfx ' + name + ' failed: ' + e.message); }
    }
  }

  function playAt(name, x, y, vol = 1) {
    const d = U.dist(listener.x, listener.y, x, y);
    if (d > 26) return;
    const att = d < 6 ? 1 : Math.max(0, 1 - (d - 6) / 20);
    const pan = U.clamp(((x - y) - (listener.x - listener.y)) / 18, -0.8, 0.8);
    play(name, vol * att, pan);
  }

  // ---- procedural music -----------------------------------------------------
  const Music = (() => {
    const IN_SCALE = [0, 1, 5, 7, 8]; // Japanese "In" scale
    let timer = null, step = 0, nextTime = 0, track = null, song = null;

    function midi(m) { return 440 * Math.pow(2, (m - 69) / 12); }
    function deg(root, d) {
      const oct = Math.floor(d / 5), i = ((d % 5) + 5) % 5;
      return root + oct * 12 + IN_SCALE[i];
    }

    function compose(seed, battle) {
      const r = U.rng(seed);
      const bars = [];
      const motifs = [];
      for (let m = 0; m < 2; m++) {
        const notes = [];
        let d = r.int(4, 7);
        for (let s = 0; s < 16; s++) {
          if (s % 2 === 1 && r.chance(0.55)) { notes.push(null); continue; }
          if (r.chance(battle ? 0.2 : 0.35)) { notes.push(null); continue; }
          d += r.pick([-2, -1, -1, 0, 1, 1, 2]);
          d = U.clamp(d, 2, 10);
          notes.push({ d, len: r.pick([1, 2, 2, 3]) });
        }
        motifs.push(notes);
      }
      const form = [0, 0, 1, 0, 0, 1, 1, 0];
      for (const f of form) bars.push(motifs[f]);
      const bass = battle ? [0, 0, -2, -1, 0, 0, -2, 1] : [0, -2, -1, 0, 0, -2, -1, -3];
      return { bars, bass, bpm: battle ? 138 : 84, root: battle ? 50 : 52, battle };
    }

    function schedule() {
      if (!ac || !song) return;
      const spb = 60 / song.bpm / 4; // 16th notes
      while (nextTime < ac.currentTime + 0.15) {
        playStep(step, nextTime, spb);
        nextTime += spb;
        step++;
      }
    }

    function voice(type, freq, t, dur, vol, attack = 0.01, vib = 0) {
      const osc = ac.createOscillator();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      if (vib) {
        const lfo = ac.createOscillator(); const lg = ac.createGain();
        lfo.frequency.value = 5.5; lg.gain.value = freq * vib;
        lfo.connect(lg); lg.connect(osc.frequency);
        lfo.start(t); lfo.stop(t + dur + 0.05);
      }
      osc.connect(g); g.connect(musicBus);
      osc.start(t); osc.stop(t + dur + 0.05);
    }
    function drum(t, freq, dur, vol, noiseVol, nf) {
      voice('sine', freq, t, dur, vol, 0.002);
      if (noiseVol) {
        const src = ac.createBufferSource(); src.buffer = noiseBuf;
        const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = nf || 3000; f.Q.value = 0.9;
        const g = ac.createGain();
        g.gain.setValueAtTime(noiseVol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.6);
        src.connect(f); f.connect(g); g.connect(musicBus);
        src.start(t, Math.random() * 0.5); src.stop(t + dur);
      }
    }

    function playStep(s, t, spb) {
      const bar = Math.floor(s / 16) % song.bars.length;
      const i = s % 16;
      const notes = song.bars[bar];
      const n = notes[i];
      if (n) {
        const f = midi(deg(song.root + 12, n.d));
        if (song.battle) {
          voice('square', f, t, spb * n.len * 1.1, 0.045, 0.005);
          voice('triangle', f * 2, t, spb * n.len, 0.02, 0.005);
        } else {
          voice('triangle', f, t, spb * n.len * 2.2, 0.08, 0.004); // koto-like pluck
          voice('sine', f * 2, t, spb * 1.5, 0.02, 0.004);
        }
      }
      // bass
      const b = song.bass[bar];
      if (song.battle) {
        if (i % 4 === 0 || i === 6 || i === 14) voice('triangle', midi(deg(song.root - 12, b)), t, spb * 1.8, 0.12, 0.005);
      } else if (i === 0 || i === 8) {
        voice('triangle', midi(deg(song.root - 12, b)), t, spb * 7, 0.09, 0.02);
      }
      // drums
      if (song.battle) {
        if (i === 0 || i === 3 || i === 8 || i === 10) drum(t, 62, 0.3, 0.35, 0.06, 200); // taiko
        if (i === 4 || i === 12) drum(t, 180, 0.12, 0.08, 0.14, 2500); // rim
        if (i % 2 === 1) drum(t, 0.1, 0.05, 0.0001, 0.03, 8000); // shaker
      } else {
        if (i === 0) drum(t, 70, 0.4, 0.18, 0.02, 300);
        if (i === 10) drum(t, 90, 0.2, 0.08, 0.01, 300);
      }
    }

    function start(which) {
      if (!ac) return;
      if (track === which && timer) return;
      stop();
      track = which;
      song = compose(which === 'battle' ? 1337 + U.randi(0, 5) : 777, which === 'battle');
      step = 0; nextTime = ac.currentTime + 0.1;
      timer = setInterval(schedule, 30);
    }
    function stop() { if (timer) clearInterval(timer); timer = null; track = null; }
    return { start, stop, get track() { return track; } };
  })();

  return {
    init, play, playAt, listener, settings, applyVolumes, Music,
    get ready() { return !!ac; },
  };
})();

<script>
// ---- js/input.js ----
'use strict';
// ---------------------------------------------------------------------------
// Keyboard / mouse / gamepad input. Edges ("pressed") are queued between
// simulation ticks so no tap is ever lost regardless of frame timing.
// ---------------------------------------------------------------------------

const Input = (() => {
  const BINDINGS = {
    up: ['KeyW', 'ArrowUp'],
    down: ['KeyS', 'ArrowDown'],
    left: ['KeyA', 'ArrowLeft'],
    right: ['KeyD', 'ArrowRight'],
    light: ['Mouse0', 'KeyJ'],
    heavy: ['KeyK'],               // also: hold left mouse
    jump: ['Space'],
    dash: ['ShiftLeft', 'ShiftRight'],
    block: ['Mouse2', 'KeyL'],
    lock: ['KeyZ', 'Mouse1'],
    lockNext: ['WheelDown', 'KeyB'],
    lockPrev: ['WheelUp'],
    j1: ['KeyQ', 'Digit1'],
    j2: ['KeyE', 'Digit2'],
    j3: ['KeyR', 'Digit3'],
    j4: ['KeyF', 'Digit4'],
    kunai: ['KeyX'],
    charge: ['KeyC'],
    awaken: ['KeyT', 'Digit5'],
    ultimate: ['KeyG', 'KeyV', 'Digit6'],
    score: ['Tab'],
    pause: ['Escape', 'KeyP'],
    mute: ['KeyM'],
  };
  const ACTIONS = Object.keys(BINDINGS);

  const down = new Set();
  const queued = new Set();    // pressed since last tick
  const queuedUp = new Set();  // released since last tick
  let pressed = new Set();
  let released = new Set();

  const mouse = { cx: 0, cy: 0, lastMove: -1e9, inside: false };
  const pad = { active: false, connected: false, sony: false, id: '', lx: 0, ly: 0, rx: 0, ry: 0, lastUse: -1e9 };
  let padPrev = {};
  let lastKeyT = -1e9;
  let canvas = null;
  let enabled = true; // false while typing in UI inputs

  function codeDown(code) {
    if (!down.has(code)) queued.add(code);
    down.add(code);
  }
  function codeUp(code) {
    if (down.has(code)) queuedUp.add(code);
    down.delete(code);
  }

  function attach(cv) {
    canvas = cv;
    window.addEventListener('keydown', (e) => {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
      if (['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
      if (e.repeat) return;
      lastKeyT = performance.now();
      codeDown(e.code);
    });
    window.addEventListener('keyup', (e) => codeUp(e.code));
    window.addEventListener('blur', () => { for (const c of [...down]) codeUp(c); });
    cv.addEventListener('mousedown', (e) => { codeDown('Mouse' + e.button); e.preventDefault(); });
    window.addEventListener('mouseup', (e) => codeUp('Mouse' + e.button));
    cv.addEventListener('contextmenu', (e) => e.preventDefault());
    cv.addEventListener('wheel', (e) => { queued.add(e.deltaY > 0 ? 'WheelDown' : 'WheelUp'); e.preventDefault(); }, { passive: false });
    window.addEventListener('mousemove', (e) => {
      mouse.cx = e.clientX; mouse.cy = e.clientY;
      mouse.lastMove = performance.now();
    });
    cv.addEventListener('mouseenter', () => { mouse.inside = true; });
    cv.addEventListener('mouseleave', () => { mouse.inside = false; });
  }

  // Called once per simulation tick. (Gamepads are polled once per frame by
  // poll(), before UI-level keys like pause are consumed.)
  function tick() {
    pressed = new Set(queued); queued.clear();
    released = new Set(queuedUp); queuedUp.clear();
  }

  function anyCode(action, set) {
    const b = BINDINGS[action];
    for (let i = 0; i < b.length; i++) if (set.has(b[i])) return true;
    return set.has('Pad:' + action);
  }
  const isDown = (a) => enabled && anyCode(a, down);
  const wasPressed = (a) => enabled && anyCode(a, pressed);
  const wasReleased = (a) => anyCode(a, released);

  // Consumes a UI-level key press immediately (menus, pause) outside ticks.
  function consume(action) {
    const b = BINDINGS[action];
    let hit = false;
    for (const c of b) if (queued.has(c)) { queued.delete(c); hit = true; }
    if (queued.has('Pad:' + action)) { queued.delete('Pad:' + action); hit = true; }
    return hit;
  }

  // ---- gamepads -------------------------------------------------------------
  // Every connected pad is read and merged (a phantom/virtual device in slot 0
  // must not hide the real controller). Pads are normalised to the W3C
  // "standard" layout: 0 A/Cross 1 B/Circle 2 X/Square 3 Y/Triangle 4 LB/L1
  // 5 RB/R1 6 LT/L2 7 RT/R2 8 Back/Create 9 Start/Options 10 L3 11 R3
  // 12-15 d-pad up/down/left/right 16 Home/PS 17 touchpad.
  let rawPads = [];
  const std = { b: new Array(18).fill(0), lx: 0, ly: 0, rx: 0, ry: 0 };

  function readPads() {
    let list = [];
    try { list = navigator.getGamepads ? Array.from(navigator.getGamepads() || []) : []; } catch (e) { list = []; }
    return list.filter((p) => p && p.connected !== false);
  }

  function isSony(gp) { return /054c|dualsense|dualshock|wireless controller|playstation/i.test(gp.id || ''); }

  function normalise(gp) {
    const raw = (i) => { const b = gp.buttons[i]; if (!b) return 0; return typeof b === 'object' ? Math.max(b.value || 0, b.pressed ? 1 : 0) : +b; };
    const ax = (i) => gp.axes[i] || 0;
    const out = { b: new Array(18).fill(0), lx: ax(0), ly: ax(1), rx: ax(2), ry: ax(3), sony: isSony(gp) };
    if (gp.mapping === 'standard' || !out.sony) {
      for (let i = 0; i < 18; i++) out.b[i] = raw(i);
      return out;
    }
    // Sony pad the browser didn't remap (e.g. Firefox on Windows):
    // raw 0 Square 1 Cross 2 Circle 3 Triangle 4 L1 5 R1 6 L2 7 R2 8 Create
    // 9 Options 10 L3 11 R3 12 PS 13 touchpad; right stick on axes 2/5; d-pad hat on axis 9.
    const b = out.b;
    b[0] = raw(1); b[1] = raw(2); b[2] = raw(0); b[3] = raw(3);
    b[4] = raw(4); b[5] = raw(5); b[6] = raw(6); b[7] = raw(7);
    b[8] = raw(8); b[9] = raw(9); b[10] = raw(10); b[11] = raw(11); b[16] = raw(12); b[17] = raw(13);
    if (gp.axes.length > 5) out.ry = ax(5);
    const hat = gp.axes[9];
    if (hat !== undefined && hat >= -1.01 && hat <= 1.01) {
      const k = Math.round((hat + 1) * 3.5); // 0 up .. 7 up-left, 8 = centred
      b[12] = [7, 0, 1].includes(k) ? 1 : 0; b[15] = [1, 2, 3].includes(k) ? 1 : 0;
      b[13] = [3, 4, 5].includes(k) ? 1 : 0; b[14] = [5, 6, 7].includes(k) ? 1 : 0;
    }
    return out;
  }

  function stick(x, y) {
    const m = Math.hypot(x, y);
    if (m < 0.2) return [0, 0];
    const k = Math.min(1, (m - 0.2) / 0.75) / m;
    return [x * k, y * k];
  }

  // Poll once per frame (before UI keys are consumed).
  function poll() {
    rawPads = readPads();
    std.b.fill(0); std.lx = std.ly = std.rx = std.ry = 0;
    let lm = 0, rm = 0;
    for (const gp of rawPads) {
      const n = normalise(gp);
      for (let i = 0; i < 18; i++) std.b[i] = Math.max(std.b[i], n.b[i]);
      const [lx, ly] = stick(n.lx, n.ly), [rx, ry] = stick(n.rx, n.ry);
      if (Math.hypot(lx, ly) > lm) { lm = Math.hypot(lx, ly); std.lx = lx; std.ly = ly; }
      if (Math.hypot(rx, ry) > rm) { rm = Math.hypot(rx, ry); std.rx = rx; std.ry = ry; }
      if (n.b.some((v) => v > 0.5) || lm || rm) { pad.sony = n.sony; pad.id = gp.id; }
    }
    pad.connected = rawPads.length > 0;
    pad.lx = std.lx; pad.ly = std.ly; pad.rx = std.rx; pad.ry = std.ry;
    const b = (i) => std.b[i] > 0.45;
    const l2 = b(6);
    // Cross jump, Square light, Triangle heavy (hold), Circle dash, R1 block,
    // L1 charge, R2 kunai (hold = shuriken), R3 lock-on, d-pad left/right switch
    // target; hold L2 for jutsu (face buttons), L2+R2 ultimate, L2+R1 awaken.
    const state = {
      jump: b(0) && !l2, light: b(2) && !l2, heavy: b(3) && !l2, dash: b(1) && !l2,
      j1: l2 && b(0), j2: l2 && b(1), j3: l2 && b(2), j4: l2 && b(3),
      charge: b(4) && !l2, block: b(5) && !l2, kunai: b(7) && !l2,
      ultimate: (l2 && b(7)) || b(13), awaken: (l2 && b(5)) || b(12) || b(10),
      lock: b(11), lockPrev: b(14), lockNext: b(15),
      pause: b(9), score: b(8) || b(17), left: b(14), right: b(15),
    };
    let any = !!(pad.lx || pad.ly || pad.rx || pad.ry);
    for (const k in state) {
      const code = 'Pad:' + k;
      if (state[k]) { any = true; codeDown(code); } else if (padPrev[k]) codeUp(code);
    }
    padPrev = state;
    if (any) { pad.active = true; pad.lastUse = performance.now(); }
    else if (!pad.connected) pad.active = false;
  }

  // Menu navigation edges from the pad: d-pad / left stick with auto-repeat.
  const menu = { prev: {}, dir: null, next: 0 };
  function menuEvents() {
    const ev = [];
    const now = performance.now();
    const b = (i) => std.b[i] > 0.45;
    let dir = null;
    if (b(12) || std.ly < -0.6) dir = 'up';
    else if (b(13) || std.ly > 0.6) dir = 'down';
    else if (b(14) || std.lx < -0.6) dir = 'left';
    else if (b(15) || std.lx > 0.6) dir = 'right';
    if (dir !== menu.dir) { menu.dir = dir; if (dir) { ev.push(dir); menu.next = now + 380; } }
    else if (dir && now >= menu.next) { ev.push(dir); menu.next = now + 110; }
    const cur = { accept: b(0), back: b(1), start: b(9), prevTab: b(4), nextTab: b(5) };
    for (const k in cur) if (cur[k] && !menu.prev[k]) ev.push(k);
    menu.prev = cur;
    if (ev.length) pad.lastUse = now;
    return ev;
  }

  let lastRumble = 0;
  function rumble(strong, weak, ms) {
    if (!usingPad()) return;
    const now = performance.now();
    if (now - lastRumble < 90) return;
    lastRumble = now;
    for (const gp of rawPads) {
      const va = gp.vibrationActuator;
      if (!va || !va.playEffect) continue;
      try { va.playEffect('dual-rumble', { duration: ms, strongMagnitude: U.clamp(strong, 0, 1), weakMagnitude: U.clamp(weak, 0, 1) }).catch(() => {}); } catch (e) { /* unsupported */ }
    }
  }

  // Movement vector in *screen* space (x right, y down), length <= 1.
  function moveVector() {
    let x = 0, y = 0;
    if (isDown('left')) x -= 1;
    if (isDown('right')) x += 1;
    if (isDown('up')) y -= 1;
    if (isDown('down')) y += 1;
    if (pad.lx || pad.ly) { x += pad.lx; y += pad.ly; }
    const l = Math.hypot(x, y);
    if (l > 1) { x /= l; y /= l; }
    return { x, y };
  }

  function mouseView() {
    if (!canvas) return null;
    const r = canvas.getBoundingClientRect();
    return {
      x: ((mouse.cx - r.left) / r.width) * (canvas.logicalW || canvas.width),
      y: ((mouse.cy - r.top) / r.height) * (canvas.logicalH || canvas.height),
    };
  }

  function usingMouse() {
    return mouse.lastMove > pad.lastUse && mouse.lastMove > 0;
  }
  // True when the controller was used more recently than keyboard or mouse.
  function usingPad() {
    return pad.connected && pad.lastUse > Math.max(mouse.lastMove, lastKeyT);
  }

  return {
    attach, tick, poll, menuEvents, rumble, isDown, wasPressed, wasReleased, consume, moveVector, mouseView, usingMouse, usingPad,
    pad, mouse, BINDINGS, ACTIONS,
    set enabled(v) { enabled = v; }, get enabled() { return enabled; },
  };
})();

'use strict';
// ---------------------------------------------------------------------------
// Elemental styles. Advantage cycle: Fire > Wind > Lightning > Earth > Water > Fire
// ---------------------------------------------------------------------------

const ELEMENTS = {
  fire:      { id: 'fire',      name: 'Fire Style',      short: 'FIRE',  color: '#ff6a1f', light: '#ffd35c', dark: '#a3200d', beats: 'wind' },
  wind:      { id: 'wind',      name: 'Wind Style',      short: 'WIND',  color: '#7fe0b0', light: '#e2fff0', dark: '#2f8a6a', beats: 'lightning' },
  lightning: { id: 'lightning', name: 'Lightning Style', short: 'LIGHT', color: '#7fb8ff', light: '#f2f8ff', dark: '#3548c9', beats: 'earth' },
  earth:     { id: 'earth',     name: 'Earth Style',     short: 'EARTH', color: '#c08a4a', light: '#ecc98f', dark: '#5e3b1a', beats: 'water' },
  water:     { id: 'water',     name: 'Water Style',     short: 'WATER', color: '#3fa0ff', light: '#b8e4ff', dark: '#174f9c', beats: 'fire' },
  shinobi:   { id: 'shinobi',   name: 'Shinobi Arts',    short: 'NINJA', color: '#c9b6ff', light: '#f3edff', dark: '#5a3f9e', beats: null },
};
const ELEMENT_ORDER = ['fire', 'water', 'earth', 'wind', 'lightning', 'shinobi'];
const NATURE_ELEMENTS = ['fire', 'water', 'earth', 'wind', 'lightning'];

// Multiplier applied when `atk` element hits a fighter whose affinity is `def`.
function elementMult(atk, def) {
  if (!atk || !def || !ELEMENTS[atk]) return 1;
  if (ELEMENTS[atk].beats === def) return 1.2;
  if (ELEMENTS[def] && ELEMENTS[def].beats === atk) return 0.88;
  return 1;
}

// Projectile clash: returns 1 if a wins, -1 if b wins, 0 if both are destroyed.
function clashResult(a, b) {
  if (a && b && ELEMENTS[a] && ELEMENTS[a].beats === b) return 1;
  if (a && b && ELEMENTS[b] && ELEMENTS[b].beats === a) return -1;
  return 0;
}

<script>
// ---- js/sprites.js ----
'use strict';
// ---------------------------------------------------------------------------
// Procedural pixel-art ninja sprites. Each look + pose + frame + view is drawn
// once to a small canvas (with a 1px outline) and cached.
// Views: 'F' = front (facing down-right), 'B' = back (facing up-right).
// Left-facing variants are mirrored at draw time.
// ---------------------------------------------------------------------------

const SPR_W = 40, SPR_H = 38;
const SPR_OX = 20, SPR_OY = 35; // feet anchor inside the sprite canvas
const DX = 4, DY = 2;           // offset of the design grid inside the canvas (room for extended limbs)

const Sprites = (() => {
  // ---- poses ----------------------------------------------------------------
  // Arms: shoulder -> e (elbow) -> h (hand), offsets from shoulder, 2px brush.
  // Legs: hip -> k (knee, from hip) -> f (foot, from default hip; y=6 is ground).
  // front:true = arm drawn over torso; back:true = arm drawn behind torso.
  const A_DOWN = { e: [0, 3], h: [0, 6] };
  const L_STAND = { k: [0, 3], f: [-1, 6] };
  const R_STAND = { k: [0, 3], f: [1, 6] };
  const POSES = {
    idle: [
      { armL: A_DOWN, armR: A_DOWN, legL: L_STAND, legR: R_STAND },
      { by: 1, armL: { e: [0, 3], h: [-1, 5] }, armR: { e: [0, 3], h: [1, 5] }, legL: L_STAND, legR: R_STAND },
    ],
    run: makeRunCycle(8),

  // Parametric sprint: legs swing through contact / passing / push-off /
  // recovery with knee lift, arms pump opposite the legs, body bobs twice per cycle.
  function makeRunCycle(n) {
    const frames = [];
    for (let i = 0; i < n; i++) {
      const t = (i / n) * TAU;
      const leg = (ph) => {
        const fx = Math.cos(ph) * 5.2;
        const lift = Math.max(0, -Math.sin(ph)) * 3.8;           // foot off the ground on the back-swing
        const fy = Math.round(6 - lift);
        // the knee drives forward and up while the foot recovers
        const kx = Math.round(fx * 0.45 + 1 + (lift > 1 ? 2 : 0));
        const ky = Math.round(3 - lift * 0.7);
        return { k: [kx, ky], f: [Math.round(fx), fy] };
      };
      const arm = (ph, far) => {
        const s = -Math.cos(ph);                                 // opposite to the same-side leg
        const fw = Math.max(0, s), bk = Math.max(0, -s);
        // bent-elbow pump: the hand comes up to the chest going forward, drops behind the hip going back
        return {
          e: [Math.round(s * 1.7), Math.round(2 - fw * 0.4)],
          h: [Math.round(fw * 3.4 - bk * 3.2), Math.round(4 - fw * 3.4 + bk * 0.3)],
          back: far && s < 0, fist: true,
        };
      };
      const by = Math.round(-Math.sin(t * 2) * 1.1);
      frames.push({ lean: 2, by, legR: leg(t), legL: leg(t + Math.PI), armR: arm(t + Math.PI, true), armL: arm(t, false) });
    }
    return frames;
  }

  // ---- drawing primitives -------------------------------------------------------
  function rect(ctx, x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x + DX, y + DY, w, h); }
  function brushLine(ctx, x0, y0, x1, y1, bw, bh, c) {
    ctx.fillStyle = c;
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
    for (let i = 0; i <= n; i++) {
      const x = Math.round(x0 + (x1 - x0) * i / n), y = Math.round(y0 + (y1 - y0) * i / n);
      ctx.fillRect(x + DX, y + DY, bw, bh);
    }
  }
  function mask(ctx, rows, ox, oy, map) {
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r];
      for (let k = 0; k < row.length; k++) {
        const c = map[row[k]];
        if (c) { ctx.fillStyle = c; ctx.fillRect(ox + k + DX, oy + r + DY, 1, 1); }
      }
    }
  }

  function drawArm(ctx, P, sx, sy, arm, dim) {
    const ex = sx + arm.e[0], ey = sy + arm.e[1];
    const hx = sx + arm.h[0], hy = sy + arm.h[1];
    const sleeve = dim ? P.outD : P.out;
    brushLine(ctx, sx, sy, ex, ey, 2, 2, sleeve);
    brushLine(ctx, ex, ey, hx, hy, 2, 2, sleeve);
    if (arm.fist && Math.abs(arm.h[0]) >= 6) {
      // extended fist: wrapped wrist + chunky knuckles
      const dir = arm.h[0] > 0 ? 1 : -1;
      rect(ctx, hx - dir, hy, 1, 2, P.wrap);
      rect(ctx, dir > 0 ? hx : hx - 1, hy - 1, 3, 3, dim ? P.skinD : P.skin);
      rect(ctx, dir > 0 ? hx + 2 : hx - 1, hy - 1, 1, 3, P.skinD);
    } else {
      rect(ctx, hx, hy, 2, 2, dim ? P.skinD : P.skin);
    }
  }

  function drawLeg(ctx, P, hx, hy, leg, lead) {
    const kx = hx + leg.k[0], ky = hy + leg.k[1];
    const fx = hx + leg.f[0], fy = 25 + leg.f[1];
    const col = lead ? P.pants : P.pantsD;
    brushLine(ctx, hx, hy, kx, ky, 3, 2, col);
    brushLine(ctx, kx, ky, fx, fy, 3, 2, col);
    // shin wrap
    const wx = Math.round(U.lerp(kx, fx, 0.55)), wy = Math.round(U.lerp(ky, fy, 0.55));
    rect(ctx, wx, wy, 3, 1, P.wrap);
    // sandal
    rect(ctx, fx, fy, 3, 2, P.sandal);
    rect(ctx, fx + 3, fy + 1, 1, 1, P.sandal);
    rect(ctx, fx + 2, fy + 1, 1, 1, P.skinD);
  }

  function drawTorso(ctx, P, look, tx, ty, back) {
    // torso block 8x8 with shading
    rect(ctx, tx, ty, 8, 8, P.out);
    rect(ctx, tx, ty, 2, 7, P.outL);
    rect(ctx, tx + 7, ty, 1, 8, P.outD);
    if (!back) {
      rect(ctx, tx + 2, ty, 4, 2, P.outL);        // collar
      rect(ctx, tx + 3, ty + 1, 2, 1, P.skinD);   // neck shadow
      rect(ctx, tx + 4, ty + 2, 1, 5, P.outD);    // zipper
      rect(ctx, tx + 1, ty + 3, 2, 2, P.outD);    // pocket
      rect(ctx, tx + 5, ty + 3, 2, 2, P.outD);
    } else {
      rect(ctx, tx + 1, ty, 6, 1, P.outL);
      // clan emblem (spiral)
      rect(ctx, tx + 2, ty + 2, 4, 3, P.cloth);
      rect(ctx, tx + 3, ty + 3, 2, 1, P.clothL);
    }
    rect(ctx, tx, ty + 7, 8, 1, P.pantsD); // belt
    rect(ctx, tx + 3, ty + 7, 2, 1, P.metalD);
    if (look.extra === 'cloak') {
      rect(ctx, tx - 1, ty, 10, 12, P.cloth);
      rect(ctx, tx - 1, ty, 2, 12, P.clothL);
      rect(ctx, tx + 8, ty, 1, 12, P.clothD);
      rect(ctx, tx - 1, ty + 11, 10, 1, P.clothD);
      if (!back) { rect(ctx, tx + 3, ty, 2, 11, P.out); rect(ctx, tx + 2, ty - 1, 4, 1, P.cloth); }
      else { rect(ctx, tx + 2, ty + 3, 4, 3, P.clothD); }
    }
  }

  function drawHead(ctx, P, look, hx, hy, back) {
    // face shape 10 wide x 10 tall at (hx, hy)
    const rows = [[2, 6], [1, 8], [0, 10], [0, 10], [0, 10], [0, 10], [0, 10], [0, 10], [1, 8], [2, 6]];
    for (let r = 0; r < rows.length; r++) rect(ctx, hx + rows[r][0], hy + r, rows[r][1], 1, P.skin);
    rect(ctx, hx + 9, hy + 2, 1, 6, P.skinD);
    rect(ctx, hx + 2, hy + 9, 6, 1, P.skinD);
    if (back) return;
    // eyes (shifted 1px toward facing side)
    rect(ctx, hx + 3, hy + 5, 2, 1, P.outline);
    rect(ctx, hx + 7, hy + 5, 2, 1, P.outline);
    rect(ctx, hx + 3, hy + 6, 2, 1, P.eye);
    rect(ctx, hx + 7, hy + 6, 2, 1, P.eye);
    rect(ctx, hx + 3, hy + 6, 1, 1, '#ffffff');
    rect(ctx, hx + 7, hy + 6, 1, 1, '#ffffff');
    rect(ctx, hx + 6, hy + 8, 1, 1, P.skinD); // mouth
    if (look.extra === 'marks') {
      rect(ctx, hx + 1, hy + 7, 2, 1, P.skinD); rect(ctx, hx + 1, hy + 8, 2, 1, P.skinD);
      rect(ctx, hx + 8, hy + 7, 2, 1, P.skinD); rect(ctx, hx + 8, hy + 8, 1, 1, P.skinD);
    }
    if (look.extra === 'mask') {
      rect(ctx, hx, hy + 7, 10, 2, P.cloth);
      rect(ctx, hx + 1, hy + 9, 8, 1, P.cloth);
      rect(ctx, hx + 9, hy + 7, 1, 2, P.clothD);
    }
  }

  function hairMap(P) { return { '#': P.hair, '+': P.hairL, '-': P.hairD }; }

  function drawHairFront(ctx, P, look, hx, hy) {
    const rows = HAIR[look.hairStyle] || HAIR.spiky;
    const map = look.hairStyle === 'hood' ? { '#': P.cloth, '+': P.clothL, '-': P.clothD } : hairMap(P);
    mask(ctx, rows, hx - 3, hy - 6, map);
  }

  function drawHairBackLayer(ctx, P, look, hx, hy, back) {
    const b = BACK_HAIR[look.hairStyle];
    if (!b) return;
    const ox = hx - 11, oy = hy - 7;
    if (b.tail) {
      // ponytail hangs from the back of the head
      if (back) {
        rect(ctx, 14 + ox, 5 + oy, 4, 12, P.hair);
        rect(ctx, 15 + ox, 5 + oy, 1, 11, P.hairL);
        rect(ctx, 14 + ox, 17 + oy, 2, 2, P.hairD);
      } else {
        rect(ctx, b.x0 + ox, b.y0 + oy, b.x1 - b.x0, b.y1 - b.y0, P.hair);
        rect(ctx, b.x0 + ox, b.y0 + oy, 1, b.y1 - b.y0 - 2, P.hairL);
        rect(ctx, b.x0 + 1 + ox, b.y1 + oy, 2, 2, P.hairD);
      }
      return;
    }
    const w = b.x1 - b.x0 + 1;
    for (let y = b.y0; y <= b.y1; y++) {
      const jag = y > b.y1 - 3 ? ((y * 7 + 3) % 3) : 0;
      rect(ctx, b.x0 + ox + jag, y + oy, w - jag * 2, 1, y % 4 === 0 ? P.hairD : P.hair);
    }
    rect(ctx, b.x0 + ox, b.y0 + oy, 1, b.y1 - b.y0 - 2, P.hairL);
  }

  function drawHairBackView(ctx, P, look, hx, hy) {
    if (look.hairStyle === 'hood') {
      mask(ctx, HAIR.hood, hx - 3, hy - 6, { '#': P.cloth, '+': P.clothL, '-': P.clothD, '.': null });
      rect(ctx, hx, hy + 1, 10, 9, P.cloth);
      rect(ctx, hx + 8, hy + 1, 2, 9, P.clothD);
      return;
    }
    drawHairFront(ctx, P, look, hx, hy);
    // cover the face area fully
    const map = hairMap(P);
    rect(ctx, hx, hy, 10, 9, map['#']);
    rect(ctx, hx + 1, hy + 8, 8, 1, map['-']);
    rect(ctx, hx + 3, hy + 9, 4, 1, P.skinD);
    rect(ctx, hx + 8, hy + 1, 2, 7, map['-']);
    rect(ctx, hx + 1, hy + 1, 2, 3, map['+']);
  }

  function drawHeadband(ctx, P, look, hx, hy, back, tx, ty) {
    const hb = look.headband;
    if (hb === 'forehead') {
      if (!back) {
        rect(ctx, hx, hy + 2, 10, 2, P.cloth);
        rect(ctx, hx + 2, hy + 2, 6, 2, P.metal);
        rect(ctx, hx + 2, hy + 3, 6, 1, P.metalD);
        rect(ctx, hx + 4, hy + 2, 2, 1, P.outline);
        // tails flutter behind (left)
        rect(ctx, hx - 2, hy + 3, 2, 1, P.cloth);
        rect(ctx, hx - 3, hy + 4, 2, 1, P.clothD);
      } else {
        rect(ctx, hx, hy + 2, 10, 2, P.cloth);
        rect(ctx, hx + 4, hy + 2, 2, 3, P.clothD);
        rect(ctx, hx + 3, hy + 5, 1, 3, P.cloth);
        rect(ctx, hx + 6, hy + 5, 1, 2, P.cloth);
      }
    } else if (hb === 'neck') {
      rect(ctx, tx, ty - 1, 8, 2, P.cloth);
      if (!back) { rect(ctx, tx + 2, ty - 1, 4, 2, P.metal); rect(ctx, tx + 2, ty, 4, 1, P.metalD); }
    }
  }

  function drawScarf(ctx, P, look, tx, ty, back, stage) {
    if (look.extra !== 'scarf') return;
    if (stage === 'tail') {
      if (!back) {
        rect(ctx, tx - 3, ty, 3, 2, P.cloth);
        rect(ctx, tx - 5, ty + 1, 3, 2, P.clothD);
        rect(ctx, tx - 6, ty + 3, 2, 1, P.clothD);
      } else {
        rect(ctx, tx + 2, ty + 1, 3, 7, P.cloth);
        rect(ctx, tx + 4, ty + 1, 1, 7, P.clothD);
      }
      return;
    }
    rect(ctx, tx - 1, ty - 1, 10, 3, P.cloth);
    rect(ctx, tx - 1, ty + 1, 10, 1, P.clothD);
    rect(ctx, tx + 1, ty - 1, 3, 1, P.clothL);
  }

  // ---- full character composite ----------------------------------------------
  function drawCharacter(ctx, look, poseName, frame, view) {
    const P = palette(look);
    const frames = POSES[poseName] || POSES.idle;
    const pz = frames[frame % frames.length];
    const back = view === 'B';
    const by = pz.by || 0, lean = pz.lean || 0;
    const tl = Math.round(lean / 2);
    const hx = 11 + lean, hy = 7 + by;
    const tx = 12 + tl, ty = 17 + by;
    const sL = [10 + tl, 18 + by], sR = [20 + tl, 18 + by];
    const hipL = [12, 25 + by], hipR = [17, 25 + by];
    const armL = pz.armL || A_DOWN, armR = pz.armR || A_DOWN;
    const legL = pz.legL || L_STAND, legR = pz.legR || R_STAND;

    const armsBefore = [], armsAfter = [];
    const place = (arm, s, dim) => {
      const behindTorso = back ? !!arm.front : !!arm.back;
      (behindTorso ? armsBefore : armsAfter).push([arm, s, dim]);
    };
    place(armL, sL, back);
    place(armR, sR, !back);

    if (!back) drawHairBackLayer(ctx, P, look, hx, hy, false);
    drawScarf(ctx, P, look, tx, ty, back, back ? '' : 'tail');
    for (const a of armsBefore) drawArm(ctx, P, a[1][0], a[1][1], a[0], true);
    drawLeg(ctx, P, hipR[0], hipR[1], legR, !back);
    drawLeg(ctx, P, hipL[0], hipL[1], legL, back);
    drawTorso(ctx, P, look, tx, ty, back);
    if (back) drawScarf(ctx, P, look, tx, ty, back, 'tail');
    drawHead(ctx, P, look, hx, hy, back);
    if (back) {
      drawHairBackView(ctx, P, look, hx, hy);
      drawHairBackLayer(ctx, P, look, hx, hy, true);
    } else {
      drawHairFront(ctx, P, look, hx, hy);
    }
    drawHeadband(ctx, P, look, hx, hy, back, tx, ty);
    drawScarf(ctx, P, look, tx, ty, back, 'front');
    for (const a of armsAfter) drawArm(ctx, P, a[1][0], a[1][1], a[0], a[2]);
    if (look.headband === 'arm') {
      const a = armsAfter.find((q) => q[1] === sR) || armsAfter[0];
      if (a) {
        const ax = a[1][0] + Math.round(a[0].e[0] / 2), ay = a[1][1] + Math.round(a[0].e[1] / 2);
        rect(ctx, ax, ay, 2, 2, P.cloth);
        rect(ctx, ax, ay, 1, 1, P.metal);
      }
    }
  }

  function outline(canvas, color) {
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    const [r, g, b] = U.hexToRgb(color);
    const solid = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) solid[i] = d[i * 4 + 3] > 0 ? 1 : 0;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        if (solid[i]) continue;
        if ((x > 0 && solid[i - 1]) || (x < w - 1 && solid[i + 1]) || (y > 0 && solid[i - w]) || (y < h - 1 && solid[i + w])) {
          d[i * 4] = r; d[i * 4 + 1] = g; d[i * 4 + 2] = b; d[i * 4 + 3] = 255;
        }
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  const cache = new Map();
  function get(look, pose, frame, view) {
    const key = lookKey(look) + '|' + pose + '|' + frame + '|' + view;
    let c = cache.get(key);
    if (c) return c;
    const base = U.makeCanvas(SPR_W, SPR_H);
    drawCharacter(base.getContext('2d'), look, pose, frame, view);
    outline(base, '#120a18');
    c = epx2(base);
    cache.set(key, c);
    return c;
  }

  // Solid-color silhouette of any sprite (hit flash, auras, afterimages).
  const tintCache = new Map();
  function tinted(src, color, key) {
    const k = key + '|' + color;
    let c = tintCache.get(k);
    if (c) return c;
    if (tintCache.size > 1500) tintCache.clear();
    c = U.makeCanvas(src.width, src.height);
    const ctx = c.getContext('2d');
    ctx.drawImage(src, 0, 0);
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, c.width, c.height);
    c.lw = src.lw || src.width; c.lh = src.lh || src.height;
    tintCache.set(k, c);
    return c;
  }
  function getTinted(look, pose, frame, view, color) {
    const src = get(look, pose, frame, view);
    return tinted(src, color, lookKey(look) + '|' + pose + '|' + frame + '|' + view);
  }

  // Portrait (head + shoulders) for HUD, scaled by an integer factor.
  const portraitCache = new Map();
  function portrait(look, scale = 2) {
    const key = lookKey(look) + '|' + scale;
    let c = portraitCache.get(key);
    if (c) return c;
    const src = get(look, 'idle', 0, 'F');
    const sx = 2 + DX, sy = 1, sw = 24, sh = 22;
    // hi-res canvas; lw/lh give the logical size
    c = U.makeCanvas(sw * scale * HIRES, sh * scale * HIRES);
    c.getContext('2d').drawImage(src, sx * HIRES, sy * HIRES, sw * HIRES, sh * HIRES, 0, 0, c.width, c.height);
    c.lw = sw * scale; c.lh = sh * scale;
    portraitCache.set(key, c);
    return c;
  }

  function frameCount(pose) { return (POSES[pose] || POSES.idle).length; }

  return { get, getTinted, portrait, frameCount, POSES, lookKey };
})();
