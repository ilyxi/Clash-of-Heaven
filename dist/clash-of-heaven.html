defJutsu({
  id: 'aquawhip', name: 'Aqua Whip', element: 'water', cost: 16, cd: 7, cast: 0.15, icon: 'whip', pose: 'release',
  desc: 'Lash out with a water whip that yanks the first enemy toward you — perfect combo starter.',
  mastery: 'Lv5: Drags every enemy along the whip.', ai: { min: 2, max: 5, kind: 'proj' },
  use(f, L, aim) {
    const len = 4.6 * SZ(f, L);
    const ang = aim.ang;
    const x1 = f.x + Math.cos(ang) * len, y1 = f.y + Math.sin(ang) * len;
    // find victims along the line, nearest first
    const victims = W.fighters.filter((e) => e.alive && Combat.enemies(f, e) && U.pointSegDist(e.x, e.y, f.x, f.y, x1, y1).d < 0.45 + e.radius)
      .sort((a, b) => U.dist(f.x, f.y, a.x, a.y) - U.dist(f.x, f.y, b.x, b.y));
    const pulled = L >= 5 ? victims : victims.slice(0, 1);
    let endX = x1, endY = y1;
    for (const e of pulled) {
      const d = U.dist(f.x, f.y, e.x, e.y);
      const res = Combat.hit(e, { src: f, dmg: 30 * D(L), element: 'water', kind: 'proj', knock: 0, stun: 0.65, status: { wet: 5 }, ability: 'aquawhip', sx: f.x, sy: f.y });
      if (res === 'hit') { const [nx, ny] = U.norm(f.x - e.x, f.y - e.y); e.vx = nx * Math.max(0, d - 0.9) * 5.2; e.vy = ny * Math.max(0, d - 0.9) * 5.2; }
      if (e === pulled[0]) { endX = e.x; endY = e.y; }
    }
    SFX.playAt('whip', f.x, f.y);
    const ox = f.x, oy = f.y;
    FX.custom({
      life: 0.25, layer: 1,
      draw(ctx, cam, k) {
        const [ax, ay] = DF.sp(ox + Math.cos(ang) * 0.4, oy + Math.sin(ang) * 0.4, 14, cam);
        const [bx, by] = DF.sp(endX, endY, 14, cam);
        const mx = (ax + bx) / 2 + Math.sin(k * 20) * 6, my = (ay + by) / 2 - 10 * (1 - k);
        for (let t = 0; t <= 1; t += 0.04) {
          const x = (1 - t) * (1 - t) * ax + 2 * (1 - t) * t * mx + t * t * bx, y = (1 - t) * (1 - t) * ay + 2 * (1 - t) * t * my + t * t * by;
          ctx.fillStyle = '#3fa0ff'; ctx.fillRect(Math.round(x) - 1, Math.round(y) - 1, 3, 3);
          ctx.fillStyle = '#e8f6ff'; ctx.fillRect(Math.round(x), Math.round(y) - 1, 1, 1);
        }
      },
    });
    FX.splash(endX, endY, 6, 0.8);
  },
});

defJutsu({
  id: 'tidalwave', name: 'Crashing Wave', element: 'water', cost: 26, cd: 10, cast: 0.35, icon: 'wave',
  desc: 'Send a wide wave rolling forward that sweeps enemies away and douses flames.',
  mastery: 'Lv5: A much wider, heavier wave.', ai: { min: 1, max: 6, kind: 'proj' },
  use(f, L, aim) {
    const width = (L >= 5 ? 5 : 3.8) * SZ(f, L);
    spawnWave(f, aim.ang, width, 7.5 * Math.min(1.3, f.envBoost || 1), 0.8, { dmg: 45 * D(L), knock: 9, stun: 0.55, ability: 'tidalwave' }, 22 * SZ(f, L));
    SFX.playAt('water', f.x, f.y, 1);
  },
});

function spawnWave(f, ang, width, dist, dur, hit, height = 18) {
  const dx = Math.cos(ang), dy = Math.sin(ang), nx = -dy, ny = dx;
  return Combat.hazard({
    src: f, x: f.x + dx * 0.8, y: f.y + dy * 0.8, hitSet: new Set(), layer: 1,
    update(dt) {
      const k = Math.min(1, this.t / dur);
      const cx = f.x + dx * (0.8 + dist * k), cy = f.y + dy * (0.8 + dist * k);
      this.cx = cx; this.cy = cy;
      for (const e of W.fighters) {
        if (!e.alive || !Combat.enemies(f, e)) continue;
        const rx = e.x - cx, ry = e.y - cy;
        const along = rx * dx + ry * dy, side = rx * nx + ry * ny;
        if (Math.abs(side) > width / 2 || along > 0.6 || along < -0.9) continue;
        if (!this.hitSet.has(e)) {
          this.hitSet.add(e);
          Combat.hit(e, Object.assign({ src: f, element: 'water', kind: 'aoe', dirX: dx, dirY: dy, status: { wet: 6 }, sx: cx - dx, sy: cy - dy, noParry: true }, hit));
        }
        if (e.state === 'hitstun' || e.state === 'air') { e.vx = dx * 9; e.vy = dy * 9; }
      }
      if (Math.random() < 0.5) W.arena.wetRadius(cx, cy, width / 2, 6);
      W.arena.damageRadius(cx, cy, width / 2, 25 * dt * 4, 'water', f);
      for (let i = 0; i < 4; i++) {
        const o = U.rand(-width / 2, width / 2);

  });

  use(f, L, aim) {

  mastery: 'Lv5: Jumps to more targets.', ai: { min: 1, max: 6.5, kind: 'proj' },
  use(f, L, aim) {
    const jumps = L >= 5 ? 5 : 3;
    let from = { x: f.x + Math.cos(aim.ang) * 0.4, y: f.y + Math.sin(aim.ang) * 0.4, z: 14 };
    let cand = W.fighters.filter((e) => e.alive && Combat.enemies(f, e) && e.st.stealth <= 0 && U.dist(f.x, f.y, e.x, e.y) < 6.5 && Math.abs(U.angDiff(aim.ang, Math.atan2(e.y - f.y, e.x - f.x))) < 0.7);
    cand.sort((a, b) => U.dist(f.x, f.y, a.x, a.y) - U.dist(f.x, f.y, b.x, b.y));
    let cur = cand[0];
    const segs = [];
    const hit = new Set();
    let dmg = 40 * D(L);
    if (!cur) {
      const p = f.aimPoint(6, 1);
      segs.push([from, { x: p.x, y: p.y, z: 0 }]);
      Combat.explosion(f, p.x, p.y, 0.8, 25 * D(L), 'lightning', { status: { para: 0.2 }, ability: 'chain', fx: false });

      from = { x: cur.x, y: cur.y, z: cur.z + 14 };
      dmg *= 0.82;

    SFX.playAt('lightning', f.x, f.y);
  },

// Shock everyone standing in water/puddles near a point.
function electrify(f, x, y, r, dmg, ability) {
  const A = W.arena;
  let any = false;
  for (const e of W.fighters) {
    if (!e.alive || !Combat.enemies(f, e) || e.z > 3) continue;
    if (U.dist(x, y, e.x, e.y) > r) continue;
    if (!A.isWetW(e.x, e.y)) continue;
    Combat.hit(e, { src: f, dmg, element: 'lightning', kind: 'aoe', knock: 0.5, stun: 0.4, status: { para: 0.4 }, ability, sx: x, sy: y, noParry: true, unblockable: true });
    any = true;
  }
  if (A.isWetW(x, y) || any) {
    for (let k = 0; k < 18; k++) {
      const a = U.rand(0, TAU), d = U.rand(0, r);
      const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d;
      if (A.isWetW(px, py)) FX.electric(px, py, 1, 2);
    }
  }
}

  return Combat.hazard({
    x, y, layer: 1,
    update() { if (this.t >= delay) { Combat.explosion(f, x, y, 1.6, dmg, 'fire', { ability, knock: 7, launch: 170 }); this.dead = true; } },
    draw(ctx, cam) {

      ctx.fillStyle = '#b8322a'; ctx.fillRect(sx - 1, sy - 2, 2, 1);

  });
}

<script>
// ---- js/summons.js ----
'use strict';
// ---------------------------------------------------------------------------
// Summoning jutsu: the Storm Hawk you ride (see Fighter.mountUp), the Great
// Toad turret and the Giant Serpent charge. Pixel art is procedural and
// cached, upscaled with EPX like the ninja sprites.
// ---------------------------------------------------------------------------

const SummonArt = (() => {
  const OUTLINE = '#120a18';

  // crisp polygon fill: a pixel is painted if its centre is inside
  function poly(ctx, pts, col) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    ctx.fillStyle = col;
    for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) for (let x = Math.floor(x0); x <= Math.ceil(x1); x++) {
      const px = x + 0.5, py = y + 0.5;
      let inside = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const [xi, yi] = pts[i], [xj, yj] = pts[j];
        if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
      }
      if (inside) ctx.fillRect(x, y, 1, 1);
    }
  }
  function ell(ctx, cx, cy, rx, ry, col) { ctx.fillStyle = col; PX.ellipse(ctx, cx, cy, rx, ry); }

  function outline(c) {
    const x = c.getContext('2d'), w = c.width, h = c.height;
    const img = x.getImageData(0, 0, w, h), d = img.data;
    const solid = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) solid[i] = d[i * 4 + 3] > 0 ? 1 : 0;
    const [r, g, b] = U.hexToRgb(OUTLINE);
    for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++) {
      const i = y * w + xx;
      if (solid[i]) continue;
      if ((xx > 0 && solid[i - 1]) || (xx < w - 1 && solid[i + 1]) || (y > 0 && solid[i - w]) || (y < h - 1 && solid[i + w])) {
        d[i * 4] = r; d[i * 4 + 1] = g; d[i * 4 + 2] = b; d[i * 4 + 3] = 255;
      }
    }
    x.putImageData(img, 0, 0);
  }

  const cache = new Map();
  function cached(key, w, h, draw) {
    let c = cache.get(key);
    if (c) return c;
    const base = U.makeCanvas(w, h);
    draw(base.getContext('2d'));
    outline(base);
    c = epx2(base);
    cache.set(key, c);
    return c;
  }

  // ---- Storm Hawk (64x44, facing right; anchor = back at 32,20) ------------------
  const HK = { dark: '#2c4450', mid: '#3f6a7a', light: '#6fa8b8', pale: '#d8f0f0', belly: '#e8e4d8', beak: '#ffc83a', beakD: '#c88a1a', eye: '#ff4a3a' };
  const FAR = [
    [[28, 21], [38, 21], [26, 3], [18, 1], [13, 5]],
    [[28, 21], [38, 21], [22, 11], [10, 11], [5, 15]],
    [[28, 22], [38, 22], [25, 29], [14, 33], [10, 30]],
    [[27, 20], [37, 20], [12, 16], [8, 19], [15, 22]],
  ];
  const NEAR = [
    [[25, 21], [36, 21], [30, 6], [21, 2], [16, 6]],
    [[25, 22], [36, 22], [27, 33], [13, 38], [8, 35]],
    [[25, 22], [36, 22], [31, 38], [23, 43], [18, 40]],
    [[25, 22], [38, 22], [10, 25], [7, 28], [16, 28]],
  ];
  // Scaled "pen": art is authored on a small grid and drawn S times larger
  // (crisp shapes, single-pixel details stay fine) before the EPX pass.
  function pen(x, S) {
    const r = Math.round;
    return {
      S,
      poly(pts, col) { poly(x, pts.map(([a, b]) => [a * S, b * S]), col); },
      ell(cx, cy, rx, ry, col) { x.fillStyle = col; PX.ellipse(x, cx * S, cy * S, rx * S, ry * S); },
      rect(a, b, w, h, col) { x.fillStyle = col; x.fillRect(r(a * S), r(b * S), Math.max(1, r(w * S)), Math.max(1, r(h * S))); },
      line(a, b, c, d, col, w = 1) { x.fillStyle = col; PX.line(x, a * S, b * S, c * S, d * S, w); },
      dot(a, b, col, n = 1) { x.fillStyle = col; x.fillRect(r(a * S), r(b * S), n, n); },
    };
  }
  function featherLines(g, w, col, colD) {
    // primaries: streaks from the wing root toward the tip region
    const [a, b, t1, t2, t3] = w;
    const root = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const tips = [t1, [(t1[0] + t2[0]) / 2, (t1[1] + t2[1]) / 2], t2, [(t2[0] + t3[0]) / 2, (t2[1] + t3[1]) / 2], t3];
    tips.forEach((tip, k) => {
      g.line(U.lerp(root[0], tip[0], 0.3), U.lerp(root[1], tip[1], 0.3), U.lerp(root[0], tip[0], 0.95), U.lerp(root[1], tip[1], 0.95), k % 2 ? colD : col);
    });
  }
  const HAWK_S = 1.6, TOAD_S = 1.9;
  function hawk(frame) {
    const S = HAWK_S;
    return cached('hawk' + frame, Math.ceil(64 * S), Math.ceil(46 * S), (x) => {
      const g = pen(x, S);
      // far wing
      g.poly(FAR[frame], HK.dark);
      featherLines(g, FAR[frame], HK.mid, '#1e3038');
      // tail fan with bands
      g.poly([[21, 19], [21, 25], [6, 29], [3, 24], [6, 18]], HK.dark);
      g.line(5, 21, 18, 21.5, HK.pale); g.line(5, 24, 18, 23.5, HK.mid); g.line(6, 27, 18, 25, HK.pale);
      // body + belly
      g.ell(30, 22, 12, 6, HK.mid);
      g.ell(29, 20, 9, 3, HK.light);
      g.ell(31, 25, 9, 3, HK.belly);
      for (let k = 0; k < 6; k++) g.dot(25 + k * 2.2, 25.5 + (k % 2), '#b8b0a0', 2);
      // saddle cloth for the rider
      g.poly([[25, 17], [34, 17], [35, 21], [24, 21]], '#b8322a');
      g.line(24, 21, 35, 21, '#e8c890');
      // head
      g.ell(44, 18, 5, 5, HK.mid);
      g.ell(44, 16, 4, 2, HK.light);
      g.rect(41, 14, 6, 1.5, HK.pale); g.rect(45, 20, 3, 2, HK.pale);
      g.rect(39.5, 18, 2, 3, HK.dark);
      g.poly([[48, 16], [55, 19], [52, 21.5], [48, 21]], HK.beak);
      g.line(49, 20, 54, 19.5, HK.beakD); g.rect(54, 19, 1, 2, HK.beakD);
      g.rect(45, 16.6, 2, 1.2, HK.eye); g.dot(45, 16.4, '#ffffff', 2);
      g.line(43, 15.5, 47.5, 16.2, '#1e3038');
      // talons
      g.rect(28.5, 28, 2, 2, HK.beak); g.rect(33, 28, 2, 2, HK.beak);
      // near wing
      g.poly(NEAR[frame], HK.light);
      featherLines(g, NEAR[frame], HK.pale, HK.mid);
      const n = NEAR[frame];
      g.line(n[0][0], n[0][1], n[1][0], n[1][1], HK.pale, 2);
    });
  }

  // ---- Great Toad (56x48 grid, facing right; anchor = feet at 28,46) ------------------
  const TD = { dark: '#44602a', mid: '#6a8a3a', light: '#9ab85a', belly: '#ecdca4', vest: '#c83a2a', vestD: '#8a2418' };
  function toad(frame) {
    const S = TOAD_S;
    return cached('toad' + frame, Math.ceil(56 * S), Math.ceil(48 * S), (x) => {
      const g = pen(x, S);
      // back legs
      g.ell(12, 40, 7, 5, TD.dark);
      // body
      g.ell(27, 31, 21, 13, TD.mid);
      g.ell(24, 26, 15, 7, TD.light);
      // red vest over the back
      g.poly([[8, 25], [26, 20], [30, 36], [10, 40]], TD.vest);
      g.rect(10, 38, 18, 2, TD.vestD); g.line(26, 21, 29, 35, TD.vestD, 2);
      g.ell(18, 30, 3.2, 3.2, '#ffe9a0'); g.rect(17, 28, 2, 4, TD.vestD); g.rect(16, 29.5, 4, 1, TD.vestD);
      // belly & throat
      g.ell(38, 37, 11, 7, TD.belly);
      for (let k = 0; k < 4; k++) g.line(31 + k * 3, 39, 33 + k * 3, 42, '#d8c488');
      if (frame === 1) { g.ell(42, 36, 7, 6, '#f6ecc4'); g.rect(38, 40, 8, 1, '#e0cc90'); }
      // warts
      for (const [wx, wy] of [[33, 22], [38, 25], [29, 18], [42, 28], [35, 29], [24, 34], [16, 22], [44, 24]]) { g.ell(wx, wy, 1.2, 1.2, TD.dark); g.dot(wx - 0.4, wy - 0.6, TD.light, 2); }
      // eyes
      for (const [ex, ey] of [[26, 15], [37, 14]]) {
        g.ell(ex, ey, 5, 5, TD.mid);
        g.ell(ex + 1, ey - 1, 3.2, 3.2, '#ffd84a');
        g.rect(ex + 0.6, ey - 3.5, 1, 5, OUTLINE);
        g.dot(ex - 0.6, ey - 2.6, '#ffffff', 2);
      }
      // mouth
      if (frame === 2) { g.ell(46, 31, 5, 4, '#6a1414'); g.ell(46, 33, 3, 2, '#e05a6a'); }
      else { g.line(30, 32, 48, 30, '#5a1a1a', 2); g.line(48, 30, 50, 28, '#5a1a1a', 2); }
      // front legs
      g.rect(38, 40, 5, 6, TD.mid); g.rect(28, 41, 5, 5, TD.mid);
      g.rect(37, 45, 8, 2, TD.light); g.rect(27, 45, 8, 2, TD.light);
      g.rect(40, 45, 1, 2, TD.dark); g.rect(30, 45, 1, 2, TD.dark);
    });
  }

  // flip when moving/looking toward the left of the screen
  function flipFor(ang) { return Math.cos(ang) - Math.sin(ang) < 0; }
  function blit(ctx, c, sx, sy, ax, ay, flip) {
    const w = c.lw, h = c.lh;
    sx = Math.round(sx); sy = Math.round(sy);
    if (!flip) { ctx.drawImage(c, sx - ax, sy - ay, w, h); return; }
    ctx.save(); ctx.translate(sx, 0); ctx.scale(-1, 1); ctx.drawImage(c, -ax, sy - ay, w, h); ctx.restore();
  }

  return { hawk, toad, flipFor, blit, HAWK_S, TOAD_S };
})();

// Storm Hawk at screen (sx, sy) = where the rider kneels.
function drawHawk(ctx, sx, sy, ang, flap, dive) {
  const seq = [0, 1, 2, 1];
  const frame = dive ? 3 : seq[Math.floor(flap) % 4];
  const S = SummonArt.HAWK_S;
  SummonArt.blit(ctx, SummonArt.hawk(frame), sx, sy + 8, Math.round(30 * S), Math.round(20 * S), SummonArt.flipFor(ang));
}

// ---- Great Toad -------------------------------------------------------------------
function spawnToad(f, L, x, y) {
  const dur = L >= 5 ? 9 : 7, R = 2.1;
  return Combat.hazard({
    src: f, x, y, r: R, dur, fall: 0.42, landed: false, shotT: 0.7, mouthT: 0, facing: f.facing, sorted: true,
    update(dt) {
      if (!this.landed && this.t >= this.fall) {
        this.landed = true;
        Combat.explosion(f, x, y, R, 60 * D(L), 'water', { ability: 'summontoad', knock: 7, launch: 220, stun: 0.6, blockDmg: 90 });
        FX.splash(x, y, 30, 2);
        FX.dust(x, y, 14);
        FX.ring(x, y, 0.5, '#9ad4ff', 0.45, 9, 2);
        W.arena.wetRadius(x, y, 3.2, 8);
        W.shakeAt(x, y, 8);
        SFX.playAt('hitHeavy', x, y, 1);
      }
      if (!this.landed) return;
      this.mouthT = Math.max(0, this.mouthT - dt);
      this.shotT -= dt;
      if (this.shotT <= 0) {
        let best = null, bd = 8.5;
        for (const e of W.fighters) {
          if (!e.alive || !Combat.enemies(f, e) || e.st.stealth > 0) continue;
          const d = U.dist(x, y, e.x, e.y);
          if (d < bd && W.arena.lineClear(x, y, e.x, e.y, 16)) { bd = d; best = e; }

      if (this.t >= this.fall + dur) {
        this.dead = true;
        FX.poof(x, y, 30);
        SFX.playAt('poof', x, y, 0.9);
      }
    },

      const [sx, sy] = DF.sp(x, y, 0, cam);
      const k = this.landed ? 1 : this.t / this.fall;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      PX.ellipse(ctx, sx, sy, 38 * (0.4 + 0.6 * k), 17 * (0.4 + 0.6 * k));
      if (!this.landed) { ctx.fillStyle = '#9ad4ff'; ctx.globalAlpha = 0.6; PX.ellipseRing(ctx, sx, sy, R * ISO_RX, R * ISO_RY, 1); ctx.globalAlpha = 1; }
    },

      ctx.globalAlpha = 1;

}

// ---- Giant Serpent ------------------------------------------------------------------
function spawnSerpent(f, L, ang) {
  const len = 7.5 * SZ(f, L), speed = 15, dx = Math.cos(ang), dy = Math.sin(ang);
  const A = W.arena;
  return Combat.hazard({
    src: f, x: f.x + dx * 0.6, y: f.y + dy * 0.6, hx: f.x + dx * 0.6, hy: f.y + dy * 0.6, dist: 0, hist: [], hitSet: new Set(),
    phase: 'go', endT: 0, blockAcc: 0, sorted: true,
    update(dt) {
      if (this.phase === 'go') {
        const step = speed * dt;
        this.dist += step;
        this.hx = U.clamp(this.hx + dx * step, 2.6, A.w - 2.6); this.hy = U.clamp(this.hy + dy * step, 2.6, A.h - 2.6);
        this.x = this.hx; this.y = this.hy;
        this.hist.push([this.hx, this.hy]);
        if (this.hist.length > 30) this.hist.shift();
        for (const e of W.fighters) {
          if (!e.alive || this.hitSet.has(e) || !Combat.enemies(f, e) || e.z > 50) continue;
          if (U.dist(this.hx, this.hy, e.x, e.y) > 0.85 + e.radius) continue;
          this.hitSet.add(e);
          Combat.hit(e, { src: f, dmg: 55 * D(L), element: 'earth', kind: 'aoe', knock: 5, launch: 260, stun: 0.7, dirX: dx, dirY: dy, ability: 'summonsnake', sx: this.hx - dx, sy: this.hy - dy, noParry: true });
        }
        this.blockAcc += dt;
        if (this.blockAcc > 0.06) { this.blockAcc = 0; A.damageRadius(this.hx, this.hy, 0.9, 45, 'earth', f); }
        if (Math.random() < 0.8) FX.debris(this.hx, this.hy, 2, ['#8a5a2c', '#c08a4a', '#5e3b1a'], 2, 0.6);
        if (Math.random() < 0.4) A.addStain(this.hx, this.hy, 0.35, 'crater');
        if (this.dist >= len) {
          this.phase = 'bite'; this.endT = this.t;
          Combat.explosion(f, this.hx + dx * 0.6, this.hy + dy * 0.6, 1.7, 40 * D(L), 'earth', { ability: 'summonsnake', knock: 6, launch: 180, stun: 0.5 });
          SFX.playAt('hitHeavy', this.hx, this.hy, 1);
        }
      } else if (this.t - this.endT > 0.7) {
        this.dead = true;
        FX.dust(this.hx, this.hy, 12);
      }
    },
    depth() { return this.hx + this.hy + 0.2; },
    drawSorted(ctx, cam) {
      const H = this.hist;
      if (H.length < 2) return;
      const sink = this.phase === 'bite' ? Math.min(1, (this.t - this.endT) / 0.7) : 0;
      const n = H.length;
      // body: tail (oldest) to head
      for (let i = 0; i < n; i += 1) {
        const u = i / (n - 1);
        // slither: the body weaves side to side around its path
        const wv = Math.sin(i * 0.45 - this.t * 14) * 0.45 * (1 - u * 0.6);
        const px = H[i][0] - dy * wv, py = H[i][1] + dx * wv;
        const z = (4 + u * 14 + Math.sin(i * 0.7 + this.t * 16) * 3) * (1 - sink) - sink * 10;
        const r = 2.5 + u * 7.5;
        const [sx, sy] = DF.sp(px, py, z, cam);
        ctx.fillStyle = OUTLINE_COL; PX.circle(ctx, sx, sy, r + 1);
        ctx.fillStyle = i % 3 === 0 ? '#3a2458' : '#6a3a8a'; PX.circle(ctx, sx, sy, r);
        ctx.fillStyle = '#9a6ab8'; PX.circle(ctx, sx - 1, sy - Math.round(r * 0.4), Math.max(1, r - 3));
        ctx.fillStyle = '#e0d0a0'; ctx.fillRect(Math.round(sx - r * 0.5), Math.round(sy + r * 0.4), Math.max(1, Math.round(r)), 1);
      }
      // head
      const [hx, hy] = H[n - 1];
      const hz = 26 * (1 - sink) - sink * 14;
      const [sx, sy] = DF.sp(hx + dx * 0.25, hy + dy * 0.25, hz, cam);
      const sdx = (dx - dy), sdy = (dx + dy) * 0.5;
      const l = Math.hypot(sdx, sdy) || 1, ux = sdx / l, uy = sdy / l;
      const open = this.phase === 'bite' ? Math.max(0, 1 - (this.t - this.endT) * 4) * 5 + 1 : 2 + Math.sin(this.t * 20);
      ctx.fillStyle = OUTLINE_COL; PX.ellipse(ctx, sx, sy, 15, 10);
      ctx.fillStyle = '#6a3a8a'; PX.ellipse(ctx, sx, sy, 14, 9);
      ctx.fillStyle = '#9a6ab8'; PX.ellipse(ctx, sx - 1, sy - 3, 9, 4);
      ctx.fillStyle = '#3a2458'; for (let k = -1; k <= 1; k++) ctx.fillRect(Math.round(sx - ux * 6 + k * 4), Math.round(sy - uy * 6 - 1), 2, 2);
      // jaws
      const jx = sx + ux * 13, jy = sy + uy * 13 + 1, op = open * 1.5;
      ctx.fillStyle = OUTLINE_COL; PX.ellipse(ctx, jx, jy, 7, Math.max(2, op + 1));
      ctx.fillStyle = '#b02a3a'; PX.ellipse(ctx, jx, jy, 6, Math.max(1, op));
      ctx.fillStyle = '#e05a6a'; PX.ellipse(ctx, jx, jy + 1, 3, Math.max(1, op * 0.5));
      ctx.fillStyle = '#ffffff';
      for (const fx of [-4, 3]) { ctx.fillRect(Math.round(jx + fx), Math.round(jy - op), 2, 3); ctx.fillRect(Math.round(jx + fx), Math.round(jy + op - 2), 2, 3); }
      // eyes
      for (const s of [-1, 1]) {
        const ex = Math.round(sx + ux * 5 + s * uy * 5), ey = Math.round(sy + uy * 5 - s * ux * 3 - 4);
        ctx.fillStyle = OUTLINE_COL; ctx.fillRect(ex - 1, ey - 1, 5, 4);
        ctx.fillStyle = '#ffe14a'; ctx.fillRect(ex, ey, 3, 2);
        ctx.fillStyle = OUTLINE_COL; ctx.fillRect(ex + 1, ey, 1, 2);
      }
    },
  });
}

<script>
// ---- js/ai.js ----
'use strict';
// ---------------------------------------------------------------------------
// AI controllers. They produce the exact same input struct the player does,
// so bots obey every rule (cooldowns, chakra, recovery frames...).
// ---------------------------------------------------------------------------

const AI_DIFF = {
  easy:   { name: 'Genin',   react: 0.45, aimErr: 0.35, block: 0.12, parry: 0.02, sub: 0.15, dodge: 0.12, jutsu: 0.55, combo: 0.3, aggro: 0.55, think: 0.34, lead: 0.3, ult: 0.5 },
  normal: { name: 'Chunin',  react: 0.28, aimErr: 0.18, block: 0.3, parry: 0.08, sub: 0.35, dodge: 0.3, jutsu: 0.8, combo: 0.6, aggro: 0.7, think: 0.22, lead: 0.7, ult: 0.8 },
  hard:   { name: 'Jonin',   react: 0.18, aimErr: 0.08, block: 0.5, parry: 0.2, sub: 0.6, dodge: 0.5, jutsu: 1.0, combo: 0.85, aggro: 0.85, think: 0.15, lead: 0.9, ult: 1 },
  master: { name: 'Kage',    react: 0.1, aimErr: 0.03, block: 0.65, parry: 0.4, sub: 0.8, dodge: 0.7, jutsu: 1.2, combo: 1.0, aggro: 0.95, think: 0.1, lead: 1.0, ult: 1 },
};

class AIController {
  constructor(f, diff = 'normal') {
    this.f = f;
    this.d = AI_DIFF[diff] || AI_DIFF.normal;
    this.target = null;
    this.retargetT = 0;
    this.thinkT = U.rand(0, 0.3);
    this.time = 0;
    this.queue = [];
    this.blockT = 0; this.heavyT = 0; this.chargeT = 0; this.fleeT = 0;
    this.path = null; this.pathIdx = 0; this.pathT = 0;
    this.strafe = U.chance(0.5) ? 1 : -1; this.strafeT = 0;
    this.stuckT = 0; this.lastPos = { x: f.x, y: f.y }; this.unstickT = 0; this.unstickDir = [0, 0];
    this.seen = new Set();
    this.subDecided = false;
    this.wanderPt = null;
    this.kunaiHoldT = 0;
    this.out = { mx: 0, my: 0, ax: null, ay: null, light: false, heavy: false, heavyPressed: false, jump: false, kunaiHeld: false, dash: false, block: false, kunai: false, charge: false, j: [false, false, false, false], awaken: false, ult: false };
    // preferred fighting range from the loadout
    let ranged = 0;
    for (const s of f.jutsu) if (s && ['proj', 'aoe'].includes(s.def.ai.kind)) ranged++;
    this.prefRange = ranged >= 3 ? 4.2 : ranged === 2 ? 2.6 : 1.1;
  }

  valid(t) {
    const f = this.f;
    return t && t.alive && Combat.enemies(f, t) && (t.st.stealth <= 0 || U.dist(f.x, f.y, t.x, t.y) < 1.4);
  }

  pickTarget() {
    const f = this.f;
    let best = null, bs = Infinity;
    for (const e of W.fighters) {
      if (!this.valid(e)) continue;
      const d = U.dist(f.x, f.y, e.x, e.y);
      let s = d;
      s += (e.hp / e.maxHp) * 3;
      const hitMe = f.lastAttackers.get(e.owner || e);
      if (hitMe && W.time - hitMe < 3) s -= 5;
      if (e.isClone) s += 3;
      if (e === this.target) s -= 2; // stickiness
      s += U.rand(0, 2.5);
      if (s < bs) { bs = s; best = e; }
    }
    this.target = best;
    this.retargetT = U.rand(1.2, 2.4);
  }

  aimAt(o, t, speed = 11) {
    const f = this.f, d = this.d;
    const dist = U.dist(f.x, f.y, t.x, t.y);
    const lead = (dist / speed) * d.lead;
    const tvx = t.vx + t.mvx, tvy = t.vy + t.mvy;
    const err = d.aimErr * Math.min(dist, 8);
    o.ax = t.x + tvx * lead + U.rand(-err, err);
    o.ay = t.y + tvy * lead + U.rand(-err, err);
  }

  schedule(a, delay, hold) {
    const q = { a, at: this.time + Math.max(0, delay), hold };
    this.queue.push(q);
    return q;
  }

  input(f, dt) {
    const o = this.out, d = this.d;
    this.time += dt;
    o.light = o.heavyPressed = o.dash = o.kunai = o.awaken = o.ult = o.jump = false;
    o.j[0] = o.j[1] = o.j[2] = o.j[3] = false;
    o.block = o.heavy = o.charge = false;
    o.mx = 0; o.my = 0;

    // queued actions (reaction delay)
    for (let n = this.queue.length - 1; n >= 0; n--) {
      const q = this.queue[n];
      if (q.at > this.time) continue;
      this.queue.splice(n, 1);
      if (q.a === 'block') this.blockT = Math.max(this.blockT, q.hold || 0.35);
      else if (q.a === 'dash') { o.dash = true; if (q.dir) { o.mx = q.dir[0]; o.my = q.dir[1]; this.dashDir = q.dir; this.dashDirT = 0.05; } }
      else if (q.a === 'light') o.light = true;
      else if (q.a === 'jump') o.jump = true;
    }
    if (this.blockT > 0) { this.blockT -= dt; o.block = true; }
    if (this.heavyT > 0) { this.heavyT -= dt; o.heavy = true; }
    if (this.chargeT > 0) { this.chargeT -= dt; o.charge = true; }
    o.kunaiHeld = this.kunaiHoldT > 0; if (this.kunaiHoldT > 0) this.kunaiHoldT -= dt;
    this.fleeT = Math.max(0, this.fleeT - dt);

    this.retargetT -= dt;
    if (!this.valid(this.target) || this.retargetT <= 0) this.pickTarget();
    const t = this.target;
    if (t) this.aimAt(o, t, 30);
    else { o.ax = f.x + Math.cos(f.facing) * 2; o.ay = f.y + Math.sin(f.facing) * 2; }

    if (f.mount) { this.ride(f, dt, o, t); return o; }
    this.defend(f, dt, o);
    this.thinkT -= dt;
    if (this.thinkT <= 0) {
      this.thinkT = d.think * U.rand(0.7, 1.3);
      this.decide(f, o);
    }
    this.steer(f, dt, o);
    if (this.dashDirT > 0) { this.dashDirT -= dt; o.mx = this.dashDir[0]; o.my = this.dashDir[1]; }
    return o;
  }

  // Riding a summon: circle the target at bombing range and rain bombs.
  ride(f, dt, o, t) {
    o.lightHeld = false;
    if (!t) { o.mx = Math.cos(this.time * 0.7); o.my = Math.sin(this.time * 0.7); return; }
    const dist = U.dist(f.x, f.y, t.x, t.y);
    this.aimAt(o, t, 8);
    if (dist < 6.5) o.lightHeld = Math.random() < 0.9;
    const [nx, ny] = U.norm(t.x - f.x, t.y - f.y);
    const radial = dist > 4.8 ? 1 : dist < 3.2 ? -0.8 : 0;
    this.strafeT -= dt;
    if (this.strafeT <= 0) { this.strafeT = U.rand(1, 2.5); if (Math.random() < 0.5) this.strafe *= -1; }
    o.mx = nx * radial - ny * this.strafe * 0.8; o.my = ny * radial + nx * this.strafe * 0.8;
    const m = f.mount;
    if ((m.t < 1.2 || m.shield < m.maxShield * 0.2) && dist < 5 && Math.random() < dt * 3) o.heavyPressed = true;
  }

  // ---- defence: blocks, parries, dodges, substitution --------------------------
  defend(f, dt, o) {
    const d = this.d;
    if (f.isNeutral() || f.state === 'attack') this.subDecided = false;
    // substitution out of combos
    if ((f.state === 'hitstun' || f.state === 'air') && f.canSubstitute() && !this.subDecided && f.comboHits >= 2) {
      const threshold = 3 + Math.floor(Math.random() * 3);
      if (f.comboHits >= threshold || f.hp < f.maxHp * 0.3) {
        this.subDecided = true;
        if (Math.random() < d.sub) this.schedule('dash', d.react * 0.6);
      }
    }
    if (f.state === 'down' && f.stateT < 0.05 && Math.random() < d.sub) this.schedule('dash', 0.2);
    if (!(f.isNeutral() || f.state === 'block' || f.state === 'charge')) return;

    // melee threats
    for (const e of W.fighters) {
      if (!e.alive || !Combat.enemies(f, e)) continue;
      const dist = U.dist(f.x, f.y, e.x, e.y);
      if (dist > 2.4) continue;
      const facingMe = Math.abs(U.angDiff(e.facing, Math.atan2(f.y - e.y, f.x - e.x))) < 1.0;
      if (e.state === 'attack' && facingMe && e.stateT < 0.06) {
        const key = 'a' + e.id + ':' + e.comboStep + ':' + Math.floor(e.time * 5);
        if (this.seen.has(key)) continue;
        this.seen.add(key);
        const r = Math.random();
        if (r < d.parry) this.schedule('block', 0, 0.22);
        else if (r < d.parry + d.block * 0.7) this.schedule('block', d.react * 0.4, 0.45);
        else if (r < d.parry + d.block * 0.7 + d.dodge * 0.25) {
          const [nx, ny] = U.norm(f.x - e.x, f.y - e.y);
          this.schedule('dash', d.react * 0.5).dir = [-ny * this.strafe + nx * 0.5, nx * this.strafe + ny * 0.5];
        }
      }
      if (e.state === 'heavy' && !e.heavyReleased && facingMe && dist < 2) {
        const key = 'h' + e.id + ':' + Math.floor(e.time);
        if (this.seen.has(key)) continue;
        this.seen.add(key);
        if (Math.random() < d.combo * 0.6 && dist < 1.4) this.schedule('light', d.react);
        else if (Math.random() < d.dodge) { const [nx, ny] = U.norm(f.x - e.x, f.y - e.y); this.queue.push({ a: 'dash', at: this.time + d.react, dir: [nx, ny] }); }
      }
    }
    // projectile threats
    for (const p of W.projectiles) {
      if (p.dead || !Combat.enemies(p.src, f) || this.seen.has(p.id)) continue;
      const rx = f.x - p.x, ry = f.y - p.y;
      if (rx * rx + ry * ry > 49) continue;
      const sp2 = p.vx * p.vx + p.vy * p.vy;
      if (sp2 < 1) continue;
      const tca = (rx * p.vx + ry * p.vy) / sp2;
      if (tca < 0 || tca > 0.8) continue;
      const cx = p.x + p.vx * tca - f.x, cy = p.y + p.vy * tca - f.y;
      if (Math.hypot(cx, cy) > p.radius + f.radius + 0.35) continue;
      this.seen.add(p.id);
      this.projThreat = 0.6;
      const r = Math.random();
      const sp = Math.sqrt(sp2);
      const px = -p.vy / sp, py = p.vx / sp;
      const side = (cx * px + cy * py) > 0 ? -1 : 1;
      if (r < d.dodge && tca > d.react * 0.5) {
        if (Math.random() < 0.4 && f.z < 1) this.schedule('jump', d.react * 0.4); // hop over it
        else this.queue.push({ a: 'dash', at: this.time + d.react * 0.5, dir: [px * side, py * side] });
      }
      else if (r < d.dodge + d.parry && p.reflectable) this.schedule('block', Math.max(0, tca - 0.1), 0.25);
      else if (r < d.dodge + d.parry + d.block * 0.6) this.schedule('block', d.react * 0.5, Math.max(0.3, tca + 0.1));
    }
    if (this.projThreat > 0) this.projThreat -= dt;
    if (this.seen.size > 400) this.seen.clear();
  }

  // ---- offence & planning ------------------------------------------------------------
  decide(f, o) {
    const d = this.d;
    const t = this.target;
    if (!t) return;
    const busy = !(f.isNeutral() || f.state === 'attack' || f.state === 'recover' || f.state === 'block' || f.state === 'charge');
    if (busy) return;
    const dist = U.dist(f.x, f.y, t.x, t.y);
    const los = W.arena.lineClear(f.x, f.y, t.x, t.y, 12);
    this.dist = dist; this.los = los;

    // stop charging if threatened
    if (f.state === 'charge' && dist < 4.5) this.chargeT = 0;

    if (f.awakening && !f.awakened && f.awak >= 100 && dist < 6 && Math.random() < 0.6) { o.awaken = true; return; }
    if (f.ultimate && f.ult >= 100 && Math.random() < d.ult && this.ultReady(f, t, dist, los)) {
      this.aimAt(o, t, 12);
      o.ult = true;
      return;
    }

    // retreat when badly hurt (less likely for aggressive bots)
    if (f.hp < f.maxHp * 0.22 && !f.awakened && this.fleeT <= 0 && Math.random() < (1 - d.aggro) * 0.8) this.fleeT = U.rand(1.5, 3);
    if (this.fleeT > 0 && f.chakra < 60 && dist > 7) { this.chargeT = 0.5; return; }

    if (f.chakra < 22 && dist > 6.5 && this.nearestEnemyDist(f) > 6) { this.chargeT = U.rand(0.6, 1.2); return; }

    // jutsu
    if (Math.random() < 0.5 * d.jutsu || (t.state === 'hitstun' || t.state === 'air') && Math.random() < d.combo) {
      const j = this.pickJutsu(f, t, dist, los);
      if (j >= 0) {
        const def = f.jutsu[j].def;
        this.aimAt(o, t, def.ai.kind === 'aoe' ? 30 : def.ai.kind === 'dash' ? 16 : 11);
        o.j[j] = true;
        if (def.ai.kind === 'escape') this.fleeT = 2;
        return;
      }
    }

    // melee
    if (dist < 1.55) {
      if (t.state === 'block' && Math.random() < 0.55 * d.combo) { o.heavyPressed = true; this.heavyT = U.rand(0.45, 0.85); return; }
      if (t.state === 'down' || t.state === 'getup') return; // wait for them
      if (Math.random() < 0.88) { o.light = true; return; }
      if (Math.random() < 0.3) { o.heavyPressed = true; this.heavyT = U.rand(0.15, 0.4); return; }
    }
    // juggle chase after launcher
    if (f.state === 'attack' && f.atk && f.atk.finisher && f.atkConnected && Math.random() < d.combo) o.light = true;

    // dive-kick onto targets below us
    if (f.z > 20 && dist < 3 && Math.random() < 0.35 * d.combo) { o.heavyPressed = true; return; }
    // chase airborne targets into the air
    if (t.z > 18 && dist < 2 && f.z < 1 && Math.random() < d.combo) { o.jump = true; return; }
    if (dist > 2.8 && dist < 8 && los && f.kunai > 0 && Math.random() < 0.16) {
      o.kunai = true;
      if (f.kunai >= 2 && Math.random() < 0.35) this.kunaiHoldT = 0.4; // charged shuriken
      return;
    }
    if (dist > 2 && dist < 5 && f.z < 1 && Math.random() < 0.05 * d.aggro) { o.jump = true; return; }
    if (dist > 2.5 && dist < 5.5 && this.prefRange < 2 && los && Math.random() < 0.12 * d.aggro && f.dashCD <= 0) {
      const [nx, ny] = U.norm(t.x - f.x, t.y - f.y);
      o.dash = true; this.dashDir = [nx, ny]; this.dashDirT = 0.05;
    }
  }

  nearestEnemyDist(f) {
    let m = Infinity;
    for (const e of W.fighters) if (e.alive && Combat.enemies(f, e)) m = Math.min(m, U.dist(f.x, f.y, e.x, e.y));
    return m;
  }

  countEnemiesNear(f, x, y, r) {
    let n = 0;
    for (const e of W.fighters) if (e.alive && Combat.enemies(f, e) && !e.isClone && U.dist(x, y, e.x, e.y) <= r) n++;
    return n;
  }

  ultReady(f, t, dist, los) {
    const u = f.ultimate.ai;
    switch (u.kind) {
      case 'aoe': return dist >= u.min && dist <= u.max;
      case 'line': return dist <= u.max && (los || f.ultimate.id === 'cannon');
      case 'proj': return dist >= u.min && dist <= u.max && los;
      case 'self': return this.countEnemiesNear(f, f.x, f.y, u.r || u.max) >= 1 && dist <= (u.r || u.max) * 0.8;
      default: return dist < 6;
    }
  }

  pickJutsu(f, t, dist, los) {
    let best = -1, bs = 0;
    const tStunned = t.state === 'hitstun' || t.state === 'air' || t.state === 'stun' || t.st.slow > 0 || t.st.root > 0;
    for (let i = 0; i < 4; i++) {
      const s = f.jutsu[i];
      if (!s || s.cd > 0 || f.chakra < f.costFor(s)) continue;
      const ai = s.def.ai;
      let sc = 0;
      switch (ai.kind) {
        case 'proj': if (dist >= ai.min && dist <= ai.max && los) sc = 1; break;
        case 'aoe': if (dist >= ai.min && dist <= ai.max) sc = 1.05 + (tStunned ? 0.5 : 0); break;
        case 'melee': if (dist <= ai.max && los) sc = 1.1; break;
        case 'self': { const n = this.countEnemiesNear(f, f.x, f.y, ai.max + 0.3); if (n) sc = 0.85 + 0.35 * n; break; }
        case 'dash': if (dist >= ai.min && dist <= ai.max && los) sc = 0.9; break;
        case 'buff': if (dist < 5 && !f.buffs.length) sc = 0.85; break;
        case 'escape': if (f.hp < f.maxHp * 0.35 && dist < 5) sc = 1.4; break;
        case 'defend': if (this.countEnemiesNear(f, f.x, f.y, 2) >= 1 || this.projThreat > 0) sc = 1.1; break;
        case 'wall': if (this.projThreat > 0 || (f.hp < f.maxHp * 0.4 && dist > 3)) sc = 0.95; break;
        case 'summon': if (dist < 8) sc = 0.9; break;
      }
      if (sc > 0 && tStunned && ['proj', 'aoe', 'dash', 'melee'].includes(ai.kind)) sc += 0.4 * this.d.combo;
      sc *= U.rand(0.7, 1.3);
      if (sc > bs) { bs = sc; best = i; }
    }
    return bs > 0.8 ? best : -1;
  }

  // ---- movement ------------------------------------------------------------------------
  steer(f, dt, o) {
    const t = this.target;
    let gx = 0, gy = 0;
    // anti-stuck
    this.stuckT += dt;
    if (this.stuckT > 0.6) {
      const moved = U.dist(f.x, f.y, this.lastPos.x, this.lastPos.y);
      if (moved < 0.25 && this.wantMove && f.isNeutral()) {
        this.unstickT = 0.5;
        const a = U.rand(0, TAU);
        this.unstickDir = [Math.cos(a), Math.sin(a)];
        this.path = null;
      }
      this.stuckT = 0; this.lastPos = { x: f.x, y: f.y };
    }
    if (this.unstickT > 0) { this.unstickT -= dt; o.mx = this.unstickDir[0]; o.my = this.unstickDir[1]; this.wantMove = true; return; }

    if (!t) {
      // wander toward the arena centre / random points
      if (!this.wanderPt || U.dist(f.x, f.y, this.wanderPt.x, this.wanderPt.y) < 1.5) this.wanderPt = W.arena.randomOpenPoint(6);
      [gx, gy] = this.seek(f, this.wanderPt.x, this.wanderPt.y, dt);
    } else if (this.fleeT > 0) {
      let ax = 0, ay = 0;
      for (const e of W.fighters) {
        if (!e.alive || !Combat.enemies(f, e)) continue;
        const d = U.dist(f.x, f.y, e.x, e.y);
        if (d < 9) { ax += (f.x - e.x) / (d * d + 0.1); ay += (f.y - e.y) / (d * d + 0.1); }
      }
      [gx, gy] = U.norm(ax, ay);
      // don't hug the arena wall
      const cx = W.arena.w / 2, cy = W.arena.h / 2;
      if (U.dist(f.x, f.y, cx, cy) > W.arena.w * 0.36) { const [nx, ny] = U.norm(cx - f.x, cy - f.y); gx += nx * 0.8; gy += ny * 0.8; }
    } else {
      const dist = U.dist(f.x, f.y, t.x, t.y);
      const want = t.state === 'down' ? 1.6 : this.prefRange;
      this.strafeT -= dt;
      if (this.strafeT <= 0) { this.strafeT = U.rand(0.8, 2.2); if (Math.random() < 0.5) this.strafe *= -1; }
      if (dist > want + 0.7) {
        [gx, gy] = this.seek(f, t.x, t.y, dt);
      } else {
        const [nx, ny] = U.norm(t.x - f.x, t.y - f.y);
        let radial = dist < want - 0.6 ? -0.8 : dist > want + 0.2 ? 0.5 : 0;
        if (want < 2 && dist > 0.9) radial = 0.9;
        const tang = want < 2 ? 0.25 : 0.75;
        gx = nx * radial + -ny * this.strafe * tang;
        gy = ny * radial + nx * this.strafe * tang;
      }
    }
    // hazards: telegraphed AoEs, burning ground, enemy zones
    for (const h of W.hazards) {
      if (h.dead || !h.src || !Combat.enemies(f, h.src)) continue;
      if ((h.type === 'aoe' && !h.fired) || h.type === 'zone') {
        const d = U.dist(f.x, f.y, h.x, h.y);
        if (d < (h.r || 1) + 0.6) {
          const key = 'z' + (h.id || (h.id = U.uid()));
          if (!this.seen.has(key)) { this.seen.add(key); h['aw' + f.id] = Math.random() < 0.35 + this.d.dodge; }
          if (h['aw' + f.id]) { const [nx, ny] = U.norm(f.x - h.x, f.y - h.y); gx += nx * 2.2; gy += ny * 2.2; }
        }
      }
    }
    if (W.arena.isBurningW(f.x, f.y)) { gx += U.rand(-1, 1); gy += U.rand(-1, 1); }
    // separate from allies
    for (const e of W.fighters) {
      if (e === f || !e.alive || Combat.enemies(f, e)) continue;
      const d = U.dist(f.x, f.y, e.x, e.y);
      if (d < 1.2 && d > 0.01) { gx += (f.x - e.x) / d * 0.5; gy += (f.y - e.y) / d * 0.5; }
    }
    const l = Math.hypot(gx, gy);
    this.wantMove = l > 0.2;
    if (l > 1) { gx /= l; gy /= l; }
    o.mx = gx; o.my = gy;
  }

  seek(f, tx, ty, dt) {
    const A = W.arena;
    if (A.walkClear(f.x, f.y, tx, ty, 0.3)) { this.path = null; return U.norm(tx - f.x, ty - f.y); }
    this.pathT -= dt;
    if (!this.path || this.pathT <= 0 || this.pathVer !== A.version && this.pathT < 0.3) {
      this.path = A.findPath(f.x, f.y, tx, ty);
      this.pathIdx = 0; this.pathT = U.rand(0.6, 1.0); this.pathVer = A.version;
    }
    const p = this.path;
    if (!p || !p.length) return U.norm(tx - f.x, ty - f.y);
    // skip reached / directly visible waypoints
    while (this.pathIdx < p.length - 1 && (U.dist(f.x, f.y, p[this.pathIdx].x, p[this.pathIdx].y) < 0.45 || (this.pathIdx + 1 < p.length && A.walkClear(f.x, f.y, p[this.pathIdx + 1].x, p[this.pathIdx + 1].y, 0.3) && U.dist(f.x, f.y, p[this.pathIdx + 1].x, p[this.pathIdx + 1].y) < 6))) this.pathIdx++;
    const w = p[Math.min(this.pathIdx, p.length - 1)];
    return U.norm(w.x - f.x, w.y - f.y);
  }
}

// Simple, aggressive brain for shadow clones.
class CloneAI {
  constructor(f) { this.f = f; this.t = 0; this.target = null; this.out = { mx: 0, my: 0, ax: null, ay: null, light: false, heavy: false, heavyPressed: false, dash: false, block: false, kunai: false, charge: false, j: [false, false, false, false], awaken: false, ult: false }; this.path = null; this.pathT = 0; }
  input(f, dt) {
    const o = this.out;
    this.t -= dt;
    o.light = o.dash = o.kunai = o.heavyPressed = false;
    if (!this.target || !this.target.alive || this.t <= 0) {
      this.t = 1;
      let best = null, bd = 18;
      const anchor = f.owner && f.owner.alive ? f.owner : f;
      for (const e of W.fighters) {
        if (!e.alive || !Combat.enemies(f, e) || e.st.stealth > 0) continue;
        const d = U.dist(anchor.x, anchor.y, e.x, e.y) + U.rand(0, 2);
        if (d < bd) { bd = d; best = e; }
      }
      this.target = best;
    }
    const t = this.target;
    if (!t) {
      const a = f.owner && f.owner.alive ? f.owner : null;
      if (a && U.dist(f.x, f.y, a.x, a.y) > 2) { [o.mx, o.my] = U.norm(a.x - f.x, a.y - f.y); } else { o.mx = o.my = 0; }
      o.ax = f.x + Math.cos(f.facing); o.ay = f.y + Math.sin(f.facing);
      return o;
    }
    o.ax = t.x; o.ay = t.y;
    const d = U.dist(f.x, f.y, t.x, t.y);
    if (d > 1.1) {
      if (W.arena.walkClear(f.x, f.y, t.x, t.y, 0.3)) [o.mx, o.my] = U.norm(t.x - f.x, t.y - f.y);
      else {
        this.pathT -= dt;
        if (!this.path || this.pathT <= 0) { this.path = W.arena.findPath(f.x, f.y, t.x, t.y, 800); this.pathT = 0.8; }
        const w = this.path && this.path.find((p) => U.dist(f.x, f.y, p.x, p.y) > 0.5);
        [o.mx, o.my] = w ? U.norm(w.x - f.x, w.y - f.y) : U.norm(t.x - f.x, t.y - f.y);
      }
      if (d < 4 && d > 2 && Math.random() < dt * 1.2) o.dash = true;
    } else { o.mx = o.my = 0; }
    if (d < 1.5 && Math.random() < dt * 7) o.light = true;
    if (d > 3 && d < 7 && f.kunai > 0 && Math.random() < dt * 0.5) o.kunai = true;
    return o;
  }
}

</script>
<script>
// ---- js/world.js ----
'use strict';
// ---------------------------------------------------------------------------
// World = one match: arena, fighters, projectiles, hazards, rules & camera.
// ---------------------------------------------------------------------------

const TEAM_COLORS = ['#4aa8ff', '#ff5a4a', '#5ad06a', '#ffc83a', '#c07aff'];
const TEAM_NAMES = ['Leaf', 'Sand', 'Mist', 'Cloud', 'Stone'];
const FFA_COLORS = ['#4aa8ff', '#ff5a4a', '#5ad06a', '#ffc83a', '#c07aff', '#ff8ad0', '#4ae0d0', '#ff9a3a', '#d0e060', '#b0b0c0'];

class PlayerController {
  constructor(f) {
    this.f = f;
    this.lmbHold = 0;
    this.out = { mx: 0, my: 0, ax: null, ay: null, light: false, lightHeld: false, heavy: false, heavyPressed: false, jump: false, dash: false, block: false, kunai: false, kunaiHeld: false, charge: false, j: [false, false, false, false], awaken: false, ult: false };
  }

  validLock(f, t) {
    return t && t.alive && Combat.enemies(f, t) && (t.st.stealth <= 0 || U.dist(f.x, f.y, t.x, t.y) < 1.4) && U.dist(f.x, f.y, t.x, t.y) < 20;
  }

  // Best lock target: favours enemies near where you're aiming, then distance.
  pickLock(f, aimAng, exclude, dir) {
    let best = null, bs = Infinity;
    const cur = f.lock;
    const curAng = cur ? Math.atan2(cur.y - f.y, cur.x - f.x) : aimAng;
    for (const e of W.fighters) {
      if (e === exclude || e.isClone || !this.validLock(f, e) || U.dist(f.x, f.y, e.x, e.y) > 16) continue;
      const a = Math.atan2(e.y - f.y, e.x - f.x);
      let score;
      if (dir) {
        // cycle clockwise / counter-clockwise from the current target
        let d = U.angDiff(curAng, a) * dir;
        if (d <= 0.01) d += TAU;
        score = d;
      } else score = Math.abs(U.angDiff(aimAng, a)) * 5 + U.dist(f.x, f.y, e.x, e.y) * 0.4;
      if (score < bs) { bs = score; best = e; }
    }
    return best;
  }

  input(f, dt) {
    const o = this.out;
    const mv = Input.moveVector();
    const mag = Math.min(1, Math.hypot(mv.x, mv.y));
    const [wx, wy] = ISO.screenDirToWorld(mv.x, mv.y);
    o.mx = wx * mag; o.my = wy * mag;
    const pad = Input.pad;
    let aimAng = f.facing;
    if (pad.active && (pad.rx || pad.ry) && !Input.usingMouse()) {
      const [ax, ay] = ISO.screenDirToWorld(pad.rx, pad.ry);
      o.ax = f.x + ax * 4.5; o.ay = f.y + ay * 4.5;
    } else if (Input.usingMouse()) {
      const m = Input.mouseView();
      const w = W.screenToWorld(m.x, m.y);
      o.ax = w.x; o.ay = w.y;
    } else {
      // keyboard / pad without right stick: auto-aim the nearest enemy
      let best = null, bd = 9;
      for (const e of W.fighters) {
        if (!e.alive || !Combat.enemies(f, e) || e.st.stealth > 0) continue;
        const d = U.dist(f.x, f.y, e.x, e.y);
        if (d < bd) { bd = d; best = e; }
      }
      if (best) { o.ax = best.x; o.ay = best.y; }
      else if (mag > 0.1) { o.ax = f.x + wx * 3; o.ay = f.y + wy * 3; }
      else { o.ax = f.x + Math.cos(f.facing) * 3; o.ay = f.y + Math.sin(f.facing) * 3; }
    }
    if (o.ax !== null) aimAng = Math.atan2(o.ay - f.y, o.ax - f.x);

    // ---- lock-on ----
    if (f.lock && !this.validLock(f, f.lock)) f.lock = null;
    if (Input.wasPressed('lock')) {
      if (f.lock) { f.lock = null; SFX.play('uiBack', 0.4); }
      else { f.lock = this.pickLock(f, aimAng); if (f.lock) SFX.play('ui', 0.6); }
    }
    if (f.lock && (Input.wasPressed('lockNext') || Input.wasPressed('lockPrev'))) {
      const n = this.pickLock(f, aimAng, f.lock, Input.wasPressed('lockNext') ? 1 : -1);
      if (n) { f.lock = n; SFX.play('ui', 0.5); }
    }
    if (f.lock) { o.ax = f.lock.x; o.ay = f.lock.y; }

    // hold left mouse for a heavy (tap = light combo)
    // (not while riding a summon: holding fire drops a stream of bombs instead)
    const lmb = Input.isDown('light') && !Input.usingPad() && !f.mount;
    const prevHold = this.lmbHold;
    this.lmbHold = lmb ? this.lmbHold + dt : 0;
    const holdHeavy = this.lmbHold >= 0.26;

    o.light = Input.wasPressed('light');
    o.lightHeld = Input.isDown('light');
    o.heavyPressed = Input.wasPressed('heavy') || (holdHeavy && prevHold < 0.26);
    o.heavy = Input.isDown('heavy') || holdHeavy;
    o.jump = Input.wasPressed('jump');
    o.dash = Input.wasPressed('dash');
    o.block = Input.isDown('block');
    o.kunai = Input.wasPressed('kunai');
    o.kunaiHeld = Input.isDown('kunai');
    o.charge = Input.isDown('charge');
    o.j[0] = Input.wasPressed('j1'); o.j[1] = Input.wasPressed('j2'); o.j[2] = Input.wasPressed('j3'); o.j[3] = Input.wasPressed('j4');
    o.awaken = Input.wasPressed('awaken');
    o.ult = Input.wasPressed('ultimate');
    return o;
  }
}

class World {
  // cfg: { map, seed, mode:'ffa'|'teams', teamCount, winType:'kills'|'stock', killLimit, stock, timeLimit,
  //        entries:[{char, team, isPlayer, diff}], demo }
  constructor(cfg) {
    W = this;
    this.cfg = cfg;
    this.demo = !!cfg.demo;
    this.time = 0;
    this.realTime = 0;
    this.arena = new Arena(cfg.map, cfg.seed || (Math.random() * 1e9) | 0);
    this.fighters = [];
    this.projectiles = [];
    this.hazards = [];
    this.slowFields = [];
    this.killfeed = [];
    this.notices = [];
    this.cam = { x: 0, y: 0, w: 640, h: 360, shake: 0, sx: 0, sy: 0 };
    this.slowT = 0; this.slowK = 1;
    this.flashT = 0; this.flashDur = 0; this.flashCol = '#fff';
    this.cutin = null;
    this.moonFx = null;
    this.over = false; this.overT = 0; this.winner = null;
    this.showNumbers = Settings.data ? Settings.data.numbers : true;
    this.teamScore = {};
    this.player = null;
    this.spectateIdx = 0; this.spectateT = 0;
    this.startT = 0;
    FX.clear();

    const spawns = this.arena.spawnPoints.slice();
    const entries = cfg.entries;
    // group team spawns together around the ring
    let order;
    if (cfg.mode === 'teams') {
      const T = cfg.teamCount || 2;
      const per = Math.ceil(10 / T);
      const used = {};
      order = entries.map((e) => { const k = used[e.team] = (used[e.team] || 0) + 1; return (e.team * per + k - 1) % spawns.length; });
    } else {
      order = U.shuffle(spawns.map((_, i) => i));
    }
    entries.forEach((e, n) => {
      const team = cfg.mode === 'teams' ? e.team : n;
      const color = cfg.mode === 'teams' ? TEAM_COLORS[e.team % TEAM_COLORS.length] : FFA_COLORS[n % FFA_COLORS.length];
      const f = new Fighter(e.char, team, { isPlayer: !!e.isPlayer, teamColor: color, lives: cfg.winType === 'stock' ? cfg.stock : 0 });
      const sp = spawns[order[n] % spawns.length];
      f.x = sp.x + U.rand(-0.2, 0.2); f.y = sp.y + U.rand(-0.2, 0.2);
      f.facing = Math.atan2(this.arena.h / 2 - f.y, this.arena.w / 2 - f.x);
      f.ctrl = e.isPlayer ? new PlayerController(f) : e.diff === 'dummy' ? null : new AIController(f, e.diff || 'normal');
      f.spawnProt = 2;
      f.diff = e.diff;
      this.fighters.push(f);
      this.teamScore[team] = 0;
      if (e.isPlayer) this.player = f;
    });
    if (cfg.training && this.player) {
      // gather the practice partners around the player
      this.fighters.filter((f) => f !== this.player).forEach((f, i) => this.placeNear(f, this.player, 3 + i * 0.8));
    }
    this.camTarget = this.player || this.fighters[0];
    this.snapCamera();
    this.timeLeft = cfg.timeLimit || 0;
  }

  get alivePlayers() { return this.fighters.filter((f) => !f.isClone); }

  placeNear(f, anchor, dist) {
    for (let k = 0; k < 24; k++) {
      const a = U.rand(0, TAU);
      const x = anchor.x + Math.cos(a) * dist, y = anchor.y + Math.sin(a) * dist;
      if (!this.arena.isSolid(Math.floor(x), Math.floor(y)) && Math.min(x, y, this.arena.w - x, this.arena.h - y) > 3) {
        f.x = x; f.y = y;
        f.facing = Math.atan2(anchor.y - y, anchor.x - x);
        return true;
      }
    }
    return false;
  }

  isWatched(f) { return !!f && f === this.camTarget; }

  screenToWorld(vx, vy) { return ISO.toWorld(vx + this.cam.x, vy + this.cam.y); }

  // ---- camera ---------------------------------------------------------------------
  camCenterFor(f) {
    let x = ISO.sx(f.x, f.y), y = ISO.sy(f.x, f.y, f.z * 0.5) - 14;
    const L = f === this.player && f.lock && f.lock.alive ? f.lock : null;
    if (L) {
      // frame both fighters, weighted toward the player, keeping the player on screen
      const lx = ISO.sx(L.x, L.y), ly = ISO.sy(L.x, L.y, L.z * 0.5) - 14;
      x += U.clamp((lx - x) * 0.4, -this.cam.w * 0.3, this.cam.w * 0.3);
      y += U.clamp((ly - y) * 0.4, -this.cam.h * 0.28, this.cam.h * 0.28);
    } else if (f === this.player && Input.usingMouse() && !this.over) {
      const m = Input.mouseView();
      if (m) { x += U.clamp((m.x - this.cam.w / 2) * 0.18, -50, 50); y += U.clamp((m.y - this.cam.h / 2) * 0.18, -34, 34); }
    }
    return { x: x - this.cam.w / 2, y: y - this.cam.h / 2 };
  }
  snapCamera() {
    if (!this.camTarget) return;
    const c = this.camCenterFor(this.camTarget);
    this.cam.x = c.x; this.cam.y = c.y;
  }
  updateCamera(dt) {
    const cam = this.cam;
    if (this.demo || !this.player) this.updateSpectate(dt);
    else if (this.player.dead && this.player.lastAttackerFighter() && this.player.deadT > 1.2 && this.player.deadT < 4) this.camTarget = this.player.lastAttackerFighter();
    else this.camTarget = this.player;
    const t = this.camTarget;
    if (t) {
      const c = this.camCenterFor(t);
      const k = 1 - Math.exp(-7 * dt);
      cam.x += (c.x - cam.x) * k; cam.y += (c.y - cam.y) * k;
    }
    const A = this.arena;
    cam.x = U.clamp(cam.x, -A.h * HALF_W - 40, A.w * HALF_W - cam.w + 40);
    cam.y = U.clamp(cam.y, -60, (A.w + A.h) * HALF_H - cam.h + 40);
    cam.shake *= Math.exp(-9 * dt);
    const s = cam.shake * (Settings.data ? Settings.data.shake : 1);
    cam.sx = s > 0.3 ? U.rand(-s, s) : 0; cam.sy = s > 0.3 ? U.rand(-s, s) : 0;
    SFX.listener.x = ISO.toWorld(cam.x + cam.w / 2, cam.y + cam.h / 2).x;
    SFX.listener.y = ISO.toWorld(cam.x + cam.w / 2, cam.y + cam.h / 2).y;
  }
  updateSpectate(dt) {
    this.spectateT -= dt;
    const alive = this.fighters.filter((f) => f.alive && !f.isClone);
    if (!alive.length) return;
    if (!this.camTarget || !this.camTarget.alive || this.spectateT <= 0) {
      // follow whoever is in the thick of it
      let best = alive[0], bs = -1;
      for (const f of alive) {
        let s = f.comboShowT * 3 + (f.awakened ? 4 : 0) + (f.state === 'ult' ? 8 : 0) + Math.random() * 2;
        for (const e of alive) if (e !== f && Combat.enemies(f, e) && U.dist(f.x, f.y, e.x, e.y) < 5) s += 1.5;
        if (s > bs) { bs = s; best = f; }
      }
      this.camTarget = best;
      this.spectateT = this.demo ? U.rand(5, 9) : 6;
    }
  }
  spectateNext(dir) {
    const alive = this.fighters.filter((f) => f.alive && !f.isClone);
    if (!alive.length) return;
    const i = alive.indexOf(this.camTarget);
    this.camTarget = alive[(i + dir + alive.length) % alive.length];
    this.spectateT = 30;
  }
  shake(m) { this.cam.shake = Math.max(this.cam.shake, m); }
  shakeAt(x, y, m) {
    const c = this.screenToWorld(this.cam.w / 2, this.cam.h / 2);
    const d = U.dist(x, y, c.x, c.y);
    if (d < 16) this.shake(m * (1 - d / 16));
  }
  slowmo(k, dur) { if (this.demo) return; this.slowK = k; this.slowT = Math.max(this.slowT, dur); }
  flash(col, dur) { this.flashCol = col; this.flashT = dur; this.flashDur = dur; }

  // ---- spawning helpers --------------------------------------------------------------
  spawnClone(owner, x, y, life, opts = {}) {
    const mine = this.fighters.filter((f) => f.isClone && f.owner === owner && f.alive);
    if (mine.length >= 12) mine[0].poof();
    if (this.arena.isSolid(Math.floor(x), Math.floor(y))) { x = owner.x; y = owner.y; }
    const c = new Fighter(owner.char, owner.team, { isClone: true, owner, hp: opts.hp || 1, teamColor: owner.teamColor });
    c.jutsu = []; c.awakening = null; c.ultimate = null;
    c.level = owner.level; c.computeMods();
    c.x = x; c.y = y; c.facing = owner.facing;
    c.life = life;
    c.ctrl = new CloneAI(c);
    this.fighters.push(c);
    FX.poof(x, y, 10);
    return c;
  }

  spawnLog(x, y, z) {
    FX.custom({
      life: 1.1, layer: 1,
      draw(ctx, cam, k) {
        const zz = Math.max(0, z + 20 * (1 - k * 3)) ;
        const [sx, sy] = DF.sp(x, y, zz, cam);
        ctx.globalAlpha = k > 0.8 ? (1 - k) * 5 : 1;
        ctx.fillStyle = '#5a3a1c'; ctx.fillRect(sx - 8, sy - 6, 16, 7);
        ctx.fillStyle = '#8a5a2c'; ctx.fillRect(sx - 8, sy - 6, 16, 3);
        ctx.fillStyle = '#c89a5e'; ctx.fillRect(sx + 6, sy - 6, 3, 7);
        ctx.fillStyle = '#6a4424'; ctx.fillRect(sx + 7, sy - 4, 1, 3);
        ctx.globalAlpha = 1;
      },
    });
  }

  // ---- events ---------------------------------------------------------------------------
  onDeath(f, src, h) {
    const killer = src ? (src.owner || src) : f.lastAttackerFighter();
    const ability = h && h.ability;
    if (killer && killer !== f && Combat.enemies(killer, f)) {
      killer.kills++;
      this.teamScore[killer.team] = (this.teamScore[killer.team] || 0) + 1;
      killer.gainXP(130);
      if (ability) killer.masteryXP(ability, 150);
      if (!killer.awakened) killer.awak = Math.min(100, killer.awak + 20);
      killer.ult = Math.min(100, killer.ult + 20);
      killer.heal(killer.maxHp * 0.12);
      FX.text(killer.x, killer.y, killer.z + 46, 'K.O.!', '#ff6a3a', { scale: 2, life: 1.2 });
      // multi-KOs and streaks
      killer.streak = (killer.streak || 0) + 1;
      killer.multi = this.time - (killer.lastKillT || -99) < 7 ? (killer.multi || 1) + 1 : 1;
      killer.lastKillT = this.time;
      if (killer === this.player) {
        SFX.play('ko', 0.6); this.slowmo(0.3, 0.5);
        this.notice('YOU DEFEATED ' + f.name.toUpperCase(), '#ffd35c');
        const m = killer.multi;
        if (m >= 2) this.notice(m === 2 ? 'DOUBLE K.O.!' : m === 3 ? 'TRIPLE K.O.!' : 'SHINOBI MASSACRE!', '#ff9a3a');
      }
      if (killer.streak === 5 || killer.streak === 10 || killer.streak === 15) {
        this.notice(killer.name.toUpperCase() + (killer.streak >= 10 ? ' IS GODLIKE!' : ' IS UNSTOPPABLE!'), '#ff6af0');
        SFX.play('horn', 0.5);
      }
      if ((f.lastStreak || 0) >= 5) this.notice(killer.name.toUpperCase() + ' ENDED ' + f.name.toUpperCase() + "'S STREAK", '#9af0ff');
    }
    for (const [a, t] of f.lastAttackers) {
      if (a === killer || this.time - t > 8 || !Combat.enemies(a, f) || a.isClone) continue;
      a.assists++;
      a.gainXP(55);
      a.ult = Math.min(100, a.ult + 8);
    }
    const name = ability ? (JUTSU[ability] ? JUTSU[ability].name : ULTIMATES[ability] ? ULTIMATES[ability].name : ability === 'taijutsu' ? 'Taijutsu' : ability === 'kunai' ? 'Kunai' : '') : '';
    this.killfeed.push({ killer, victim: f, name, t: this.realTime });
    if (this.killfeed.length > 6) this.killfeed.shift();
    if (f === this.player) {
      this.notice(killer ? 'DEFEATED BY ' + killer.name.toUpperCase() : 'DEFEATED', '#ff6a6a');
      Input.rumble(1, 1, 450);
    }

    if (this.cfg.training) {
      f.respawnT = f === this.player ? 2 : 1.5;
    } else if (this.cfg.winType === 'stock' && !this.demo) {
      f.lives--;
      f.respawnT = f.lives > 0 ? 4 : Infinity;
      if (f.lives <= 0) f.eliminated = true;
    } else {
      f.respawnT = 3.5 + Math.min(4, f.deaths * 0.4);
    }
    this.checkWin();
  }

  onUltimate(f) {
    if (f === this.player) Input.rumble(0.7, 0.8, 380);
    if (this.isWatched(f) || this.onScreen(f)) {
      this.cutin = { f, t: 0, dur: 1.15, name: f.ultimate.name };
      if (f === this.player) this.slowmo(0.4, 0.35);
    }
    const el = ELEMENTS[f.ultimate.element] || ELEMENTS.shinobi;
    FX.ring(f.x, f.y, 0.3, el.color, 0.6, 6, 2);
  }
  onAwaken(f) {
    if (this.isWatched(f)) this.notice('AWAKENING: ' + f.awakening.name.toUpperCase(), f.awakening.colors[1]);
    FX.text(f.x, f.y, 50, f.awakening.name.toUpperCase(), f.awakening.colors[0], { life: 1.4 });
  }
  onLevelUp(f) { if (f === this.player) this.notice('LEVEL UP!  LV ' + f.level, '#ffe14a'); }
  onMastery(f, id, lvl) {
    if (f !== this.player) return;
    const name = id === 'taijutsu' ? 'Taijutsu' : (JUTSU[id] || ULTIMATES[id]).name;
    let extra = '';
    if (id === 'taijutsu' && lvl === 3) extra = ' - 5-HIT COMBO';
    if (id === 'taijutsu' && lvl === 4) extra = ' - AIR CHASE';
    if (id === 'taijutsu' && lvl === 5) extra = ' - UNBLOCKABLE HEAVY';
    this.notice(name.toUpperCase() + (lvl >= 5 ? ' MASTERED!' : ' LV ' + lvl) + extra, lvl >= 5 ? '#ff9af0' : '#8ff0ff');
  }
  onBlockDestroyed(b, src) {
    if (src && src.gainXP) (src.owner || src).gainXP(4);
  }
  notice(text, color) {
    this.notices.push({ text, color, t: 0 });
    if (this.notices.length > 4) this.notices.shift();
  }

  onScreen(f) {
    const sx = ISO.sx(f.x, f.y) - this.cam.x, sy = ISO.sy(f.x, f.y) - this.cam.y;
    return sx > -20 && sy > -40 && sx < this.cam.w + 20 && sy < this.cam.h + 20;
  }

  // ---- rules ------------------------------------------------------------------------------
  teamsAlive() {
    const s = new Set();
    for (const f of this.fighters) if (!f.isClone && !f.eliminated) s.add(f.team);
    return s;
  }

  checkWin() {
    if (this.over || this.demo) return;
    const c = this.cfg;
    if (c.winType === 'kills') {
      for (const team in this.teamScore) {
        if (this.teamScore[team] >= c.killLimit) { this.endMatch(+team); return; }
      }
    } else {
      const alive = this.teamsAlive();
      if (alive.size <= 1) this.endMatch(alive.size ? [...alive][0] : null);
    }
  }

  endMatch(team) {
    if (this.over) return;
    this.over = true;
    this.overT = 0;
    this.winner = team;
    this.slowmo(0.25, 1.2);
    SFX.play('horn', 1);
    const pw = this.player && team !== null && this.player.team === team;
    this.notice(team === null ? 'DRAW' : pw ? 'VICTORY!' : this.player ? 'DEFEAT' : this.teamLabel(team) + ' WINS', pw ? '#ffe14a' : '#ff8a8a');
  }

  teamLabel(team) {
    if (this.cfg.mode === 'teams') return TEAM_NAMES[team] + ' Team';
    const f = this.fighters.find((x) => x.team === team && !x.isClone);
    return f ? f.name : 'Nobody';
  }

  leadingTeam() {
    let best = null, bs = -1, tie = false;
    for (const team in this.teamScore) {
      let s = this.teamScore[team];
      if (this.cfg.winType === 'stock') s = this.fighters.filter((f) => f.team === +team && !f.isClone).reduce((a, f) => a + Math.max(0, f.lives) + (f.alive ? f.hp / f.maxHp : 0), 0);
      if (s > bs) { bs = s; best = +team; tie = false; } else if (s === bs) tie = true;
    }
    return tie ? null : best;
  }

  respawn(f) {
    const A = this.arena;
    let best = A.spawnPoints[0], bs = -1;
    for (const sp of A.spawnPoints) {
      let m = Infinity;
      for (const e of this.fighters) if (e.alive && Combat.enemies(f, e)) m = Math.min(m, U.dist(sp.x, sp.y, e.x, e.y));
      m += U.rand(0, 3);
      if (m > bs) { bs = m; best = sp; }
    }
    f.x = best.x; f.y = best.y;
    if (this.cfg.training && this.player && f !== this.player && this.player.alive) this.placeNear(f, this.player, U.rand(3, 5));
    f.z = 0; f.vx = f.vy = f.vz = 0; f.mvx = f.mvy = 0;
    f.dead = false; f.hp = f.maxHp; f.chakra = f.maxChakra; f.guard = 100;
    f.st = { burn: 0, burnDps: 0, burnSrc: null, burnTick: 0, wet: 0, para: 0, paraResist: 0, slow: 0, slowAmt: 0, root: 0, stealth: 0, genjutsu: 0 };
    f.buffs = []; f.computeMods();
    f.setState('idle'); f.spawnProt = 2.5; f.comboHits = 0; f.juggle = 0;
    f.lastAttackers.clear();
    for (const s of f.jutsu) if (s) s.cd = Math.min(s.cd, 2);
    FX.poof(f.x, f.y, 14);
    if (f === this.player) SFX.play('sub', 0.8);
  }

  // ---- main update -----------------------------------------------------------------------
  update(dt) {
    this.realTime += dt;
    if (this.slowT > 0) this.slowT -= dt;
    const sdt = dt * (this.slowT > 0 ? this.slowK : 1);
    this.time += sdt;
    this.startT += dt;

    this.slowFields = this.fighters.filter((f) => f.alive && f.mod && f.mod.projSlow > 0);
    if (this.cfg.training && this.player && this.player.alive) {
      // the dojo keeps your meters topped up so you can practise everything
      const p = this.player;
      if (!p.awakened) p.awak = Math.min(100, p.awak + 9 * sdt);
      p.ult = Math.min(100, p.ult + 9 * sdt);
      p.chakra = Math.min(p.maxChakra, p.chakra + 6 * sdt);
    }
    for (const f of this.fighters) f.update(sdt);

    // soft body separation
    const fs = this.fighters;
    for (let i = 0; i < fs.length; i++) {
      const a = fs[i];
      if (!a.alive) continue;
      for (let j = i + 1; j < fs.length; j++) {
        const b = fs[j];
        if (!b.alive || Math.abs(a.z - b.z) > 20) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy, r = a.radius + b.radius;
        if (d2 < r * r && d2 > 1e-6) {
          const d = Math.sqrt(d2), push = (r - d) * 0.5;
          a.x -= dx / d * push; a.y -= dy / d * push; b.x += dx / d * push; b.y += dy / d * push;
        }
      }
    }

    for (const p of this.projectiles) if (!p.dead) p.update(sdt);
    this.clashProjectiles();
    this.projectiles = this.projectiles.filter((p) => !p.dead);

    for (const h of this.hazards) { if (!h.dead) { h.t += sdt; h.update(sdt); } }
    this.hazards = this.hazards.filter((h) => !h.dead);

    this.arena.update(sdt, this);
    FX.update(sdt);
    if (this.moonFx) this.moonFx.t += sdt;

    // respawns / cleanup
    for (const f of this.fighters) {
      if (!f.dead || f.isClone || f.eliminated) continue;
      f.respawnT -= sdt;
      if (f.respawnT <= 0 && !this.over) this.respawn(f);
    }
    if (this.fighters.some((f) => f.removed)) this.fighters = this.fighters.filter((f) => !f.removed);
    for (const f of this.fighters) {
      if (f.blindT > 0) f.blindT -= sdt;
    }

    // timers
    if (!this.demo && !this.over && this.cfg.timeLimit) {
      this.timeLeft -= sdt;
      if (this.timeLeft <= 10 && Math.floor(this.timeLeft + sdt) !== Math.floor(this.timeLeft) && this.timeLeft > 0) SFX.play('tick', 1);
      if (this.timeLeft <= 0) { this.timeLeft = 0; this.endMatch(this.leadingTeam()); }
    }
    if (this.over) {
      this.overT += dt;
      if (this.overT > 1.2) for (const f of this.fighters) if (f.alive && f.team === this.winner && f.isNeutral()) f.setState('victory');
    }
    if (this.demo && this.time > 150) this.demoReset = true;

    for (const n of this.notices) n.t += dt;
    this.notices = this.notices.filter((n) => n.t < 3);
    if (this.cutin) { this.cutin.t += dt; if (this.cutin.t > this.cutin.dur) this.cutin = null; }
    if (this.flashT > 0) this.flashT -= dt;
    this.updateCamera(dt);
  }

  clashProjectiles() {
    const ps = this.projectiles;
    for (let i = 0; i < ps.length; i++) {
      const a = ps[i];
      if (a.dead || !a.clash) continue;
      for (let j = i + 1; j < ps.length; j++) {
        const b = ps[j];
        if (b.dead || !b.clash || a.team === b.team) continue;
        const r = a.radius + b.radius;
        if (Math.abs(a.x - b.x) > r || Math.abs(a.y - b.y) > r) continue;
        if (U.dist2(a.x, a.y, b.x, b.y) > r * r || Math.abs(a.z - b.z) > 16) continue;
        const res = clashResult(a.element, b.element);
        const pa = a.clash * (res === 1 ? 2 : res === -1 ? 0.5 : 1);
        const pb = b.clash * (res === -1 ? 2 : res === 1 ? 0.5 : 1);
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, mz = (a.z + b.z) / 2;
        if (a.kind === 'kunai' && b.kind === 'kunai') {
          a.dead = b.dead = true;
          FX.spark(mx, my, mz, ['#ffffff', '#ffe08a'], 8, 5);
          SFX.playAt('clink', mx, my);
          continue;
        }
        FX.glow(mx, my, mz, 8, '#ffffff', 0.15);
        FX.spark(mx, my, mz, ['#ffffff', '#ffe08a', '#ff8a4a'], 12, 6);
        if (pa > pb * 1.2) { b.impact(); a.clash -= pb; a.dmg *= 0.8; }
        else if (pb > pa * 1.2) { a.impact(); b.clash -= pa; b.dmg *= 0.8; }
        else { a.impact(); b.impact(); }
        SFX.playAt('explosion', mx, my, 0.4);
        if (a.dead) break;
      }
    }
  }
}

  };

  function colorsFor(el, override) {
    const E = ELEMENTS[el] || ELEMENTS.shinobi;
    return override || { main: E.color, light: E.light, dark: E.dark };
  }

  function make(glyph, el, override) {
    const key = glyph + ':' + el + ':' + (override ? override.main : '');
    let c = cache.get(key);
    if (c) return c;
    const C = colorsFor(el, override);
    c = U.makeCanvas(S, S);
    const x = c.getContext('2d');
    x.fillStyle = '#140c1c'; x.fillRect(0, 0, S, S);
    x.fillStyle = U.shade(C.dark, -0.55); x.fillRect(1, 1, S - 2, S - 2);
    (G[glyph] || G.star)(x, C);
    // crisp: kill antialiased alpha
    const img = x.getImageData(0, 0, S, S);
    for (let i = 3; i < img.data.length; i += 4) img.data[i] = 255;
    x.putImageData(img, 0, 0);
    x.fillStyle = C.main; x.fillRect(0, 0, S, 1); x.fillRect(0, S - 1, S, 1); x.fillRect(0, 0, 1, S); x.fillRect(S - 1, 0, 1, S);
    cache.set(key, c);
    return c;
  }

  function jutsu(def) { return make(def.icon, def.element); }
  function awakening(def) { return make('eye', 'shinobi', { main: def.colors[1], light: def.colors[0], dark: def.colors[2] }); }
  function ultimate(def) { return make('star', def.element); }
  function url(canvas) { return canvas.toDataURL(); }

  return { jutsu, awakening, ultimate, url, make };
})();
